# AutoCodeFlow — Prometheus 告警规则（第十轮观测；OBS-02 第十六轮补注）
#
# 适用对象：apps/admin-api GET /api/metrics（Prometheus text exposition）。
# series 名与 label 已与源码逐字核对（见 docs/observability/README.md 附录 A）。
#
# 阅读版声明（审计批次 A 轻量对账 → 2026-10-07 语义级对账）：本文件是
# README §3 的教学/阅读载体；compose monitoring profile 实际挂载并生效的
# 规则是 config/monitoring/alerts.yml（31 条接线版）——本文件受
# `npm run test:alerts` 三层对账：存在性 + 指标名与源码清单一致 +
# **语义级对账**（每条告警的 for/severity/expr 空白归一后必须与接线版同名
# 规则逐字一致；规则集允许子集，不要求全等）。接线版演进（如多实例矩阵轮
# 的 expr 重写）必须同步本文件，教学载体教的永远是真实生效的语义。
#
# OBS-02（第十六轮）/ OBS3-06（第三轮审计）：本文件各规则的 `runbook`
# annotation 是面向 Grafana UI 的相对路径链接；自 OBS3-06 起每条另有一行
# `runbook_url:`（**绝对 URL**，锚点见 README §3.6）。告警经 Alertmanager
# 路由到平台通知渠道（POST /api/alerts/webhook，配置样例见 README §3.5）时，
# 消息里的 runbook 段取自 `annotations.runbook_url`（缺失则回退旧的
# `annotations.runbook`，相对路径按仓库文档地址补全——映射层
# alert-webhook.mapping.ts 两个都认），或 labels.taskId 对应的 tasks.runbook。
#
# 挂载方式（prometheus.yml）：
#   rule_files:
#     - /etc/prometheus/rules/autoflow-alerting.yml
#
# 注：本机无 promtool，未跑 `promtool check rules`；语法按 Prometheus rule
# 文件惯例编写（groups[].rules[]，UPPER_SNAKE alert 名）。
#
# 多实例说明：计数为 per-process（每实例各自暴露），rate 类表达式按
# instance 维度评估、聚合类按 job 维度评估；job label 由 Prometheus 抓取
# 配置注入（见 README 的 scrape_config 示例，job_name: autoflow-admin-api）。

groups:
  - name: autoflow-scheduler
    rules:
      # 调度器停摆（集群级，2026-10-07 与接线版对齐）：tick 计数器仅 leader
      # 实例递增（scheduler.service.ts 的 isLeader 门）——单实例 rate==0 不能
      # 区分 follower 与真停摆（多实例矩阵轮的接线版结论），必须对全体实例
      # 求和：和为 0 = 没有任何实例在执行调度扫描。10m 回看窗容忍 leader
      # 换届的短暂空档。
      # 调优思路：
      # - ticks 正常速率 ≈ 1/扫描间隔（如 15s 间隔 → ~0.067/s，仅 leader 有
      #   样本）。若扫描间隔被调大，请同步放宽 `rate(...[10m]) == 0` 的回看
      #   窗口。
      # - 进程重启瞬间 counter 归零，rate() 能处理 reset 不会误判；但抓取
      #   中断（target down）会让表达式无样本而非 0——target 失联由下方
      #   AUTOFLOW_METRICS_TARGET_DOWN 兜底。
      # - Redis 不可读（queue_up==0）在接线版是**独立告警**
      #   AUTOFLOW_QUEUE_UNREADABLE（fail-open 降级后 tick 可能仍走，两条
      #   并存是预期）——本条只管调度活性。
      - alert: AUTOFLOW_SCHEDULER_DOWN
        expr: sum(rate(autoflow_scheduler_ticks_total[10m])) == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "调度器停摆：无任何实例产生调度 tick"
          description: >-
            全体 admin-api 实例的调度扫描 tick 速率已为 0 持续 5 分钟，cron
            与依赖触发全部停摆。检查各实例是否赢得 leader（isLeader 门，只有
            leader 递增 ticks）、Redis 连通性（leader 锁依赖 Redis）、调度
            循环异常日志；恢复前积压任务由 AUTOFLOW_QUEUE_BACKLOG 伴生观察。
          runbook: "docs/observability/README.md#autoflow_scheduler_down"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_scheduler_down"

      # 兜底：抓取目标失联（series 消失 ≠ 值为 0，==0 类表达式在无样本时不
      # 触发，必须用 absent 补位）。absent 挂在调度 tick 上（每 leader 一
      # 个活跃 series，接线版口径）。
      - alert: AUTOFLOW_METRICS_TARGET_DOWN
        expr: absent(autoflow_scheduler_ticks_total)
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "admin-api metrics 抓取目标全部失联"
          description: >-
            所有 autoflow-admin-api target 均已 5 分钟未上报
            autoflow_scheduler_ticks_total series（leader 实例每扫描间隔
            +1）。可能：进程挂死、/api/metrics 被
            METRICS_PROMETHEUS_ENABLED=false 关闭、JWT bearer 过期导致
            抓取 401（见 README 抓取配置的 token 过期坑）。
          runbook: "docs/observability/README.md#autoflow_metrics_target_down"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_metrics_target_down"

      # 队列积压：waiting 深度持续超阈值。
      # 调优思路：
      # - 100 是保守起点：正常水位取决于 cron 密度 × 执行时长。先观察
      #   dashboard「Queue depth by state」两周基线，取 p99 的 2~3 倍。
      # - waiting 高但 active 也高 = 执行器容量不足（考虑 ExecutorOffline
      #   方向排查）；waiting 高而 active≈0 = 消费端停摆，更危险，可另加
      #   `autoflow_queue_depth{state="waiting"} > 50 unless autoflow_queue_depth{state="active"} > 0`。
      # - Redis 不可读时 queue_depth 被源码置 0（不会误触发本告警），
      #   该场景由 AUTOFLOW_SCHEDULER_DOWN 覆盖。
      - alert: AUTOFLOW_QUEUE_BACKLOG
        expr: autoflow_queue_depth{state="waiting"} > 100
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "任务队列积压：{{ $labels.instance }} waiting > 100"
          description: >-
            BullMQ waiting 深度 {{ $value }} 持续 10 分钟超过 100。核对执行器
            在线数与消费速率（dashboard「Queue depth by state」active 曲线、
            GET /api/metrics/executors JSON）。
          runbook: "docs/observability/README.md#autoflow_queue_backlog"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_queue_backlog"

  - name: autoflow-callback-auth
    rules:
      # —— 宽松级：v1_expired ——
      # token 过期可能只是「任务超时后迟到的合法回调」（执行端持有已过期的
      # per-execution token 重试），属预期长尾，阈值宽松、warning 即可。
      # 调优思路：0.05/s ≈ 3 次/分钟。若 fleet 大、超时任务占比高，按
      # expired/ok 比例改写成比率表达式，例如：
      #   rate(...{result="v1_expired"}[15m])
      #     > 0.1 * rate(...{result="ok"}[15m])
      - alert: AUTOFLOW_CALLBACK_AUTH_EXPIRED_ELEVATED
        expr: |
          sum by (job) (rate(autoflow_execution_callback_auth_total{result="v1_expired"}[5m])) > 0.05
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "回调 token 过期占比升高（{{ $labels.job }}）"
          description: >-
            v1_expired 速率 {{ $value }}/s 持续 15 分钟 > 0.05。多为任务超时
            后执行端迟到的回调（合法但无效）；若伴随执行超时告警，核对
            token TTL 与任务最长运行时间配置是否匹配。
          runbook: "docs/observability/README.md#autoflow_callback_auth_expired_elevated"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_callback_auth_expired_elevated"

      # —— 严格级：签名/共享 token 类 ——
      # v1_bad_signature 与 legacy_shared_invalid 在正常运行下应几乎为 0：
      # 出现即意味着 secret 漂移（fleet 全局 / per-executor secret 不一致）
      # 或外部探测/伪造尝试，阈值严格、critical。
      # 调优思路：0.01/s ≈ 0.6 次/分钟；若担心偶发单点毛刺漏报，可把 for
      # 降为 2m 并配合 dashboard「异常分类绝对值」面板人工确认台阶。
      - alert: AUTOFLOW_CALLBACK_AUTH_SIGNATURE_CRITICAL
        expr: |
          sum by (job) (rate(autoflow_execution_callback_auth_total{result=~"v1_bad_signature|legacy_shared_invalid"}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "回调签名校验异常（疑似 secret 漂移或伪造）"
          description: >-
            v1_bad_signature / legacy_shared_invalid 速率 {{ $value }}/s 持续
            5 分钟 > 0.01（应≈0）。立即核对：① executor 与 admin-api 的
            fleet/per-executor secret 是否轮换不同步；② 回调来源 IP 是否
            异常（安全事件可能）；③ legacy 共享 token 客户端是否未迁移完。
          runbook: "docs/observability/README.md#autoflow_callback_auth_signature_critical"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_callback_auth_signature_critical"

      # —— 中间级：绑定/缺 token/缺地址 ——
      # v1_binding_mismatch（token 与 executionId 绑定不符）、missing_token、
      # bad_address 多为集成配置错误（复用 token、漏 header），非攻击信号，
      # 但持续出现说明有客户端用错凭证，warning 提示排查。
      - alert: AUTOFLOW_CALLBACK_AUTH_MISUSE
        expr: |
          sum by (job) (rate(autoflow_execution_callback_auth_total{result=~"v1_binding_mismatch|missing_token|bad_address"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "回调凭证使用异常（{{ $labels.job }}）"
          description: >-
            v1_binding_mismatch / missing_token / bad_address 合计速率
            {{ $value }}/s 持续 10 分钟 > 0.1。常见原因：执行端复用其他
            execution 的 token、未带 Authorization 头、legacy 回调缺
            executorAddress。按 result 分解见 dashboard 饼图/表格面板。
          runbook: "docs/observability/README.md#autoflow_callback_auth_misuse"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_callback_auth_misuse"

  # # —— ExecutorOffline（暂不启用）——
  # # 核对结论：admin-api 的 Prometheus 端点【没有】执行器在线/心跳 series
  # # （全库 grep `autoflow_` 仅命中 metrics 模块；执行器状态存于 DB
  # # Executor.status/lastHeartbeat，由 heartbeat() 更新，仅通过 JSON 端点
  # # GET /api/metrics/executors 与 GET /health/metrics 暴露，非 Prometheus
  # # 格式）。因此无法在本文件用 PromQL 表达该告警。
  # # 建议：执行器离线检测走现有 notification 渠道
  # # （apps/admin-api/src/modules/notification，如 Slack channel——服务端
  # # 已有基于 DB 状态的离线判定路径），或未来在 executor 模块补一个
  # # autoflow_executor_online gauge 后再启用如下规则：
  # - alert: AUTOFLOW_EXECUTOR_OFFLINE
  #   expr: sum(autoflow_executor_online) < <期望最小在线数>
  #   for: 5m
  #   labels:
  #     severity: warning
  #   annotations:
  #     summary: "执行器离线数量超阈值"

  # ── 通知投递（R34-C1 起：接线版有 3 条，本阅读版同步）──────────────
  # result label 自 R33-A1 起是四值：success / failure / blocked / skipped。
  # 旧版把「除 promise rejected 外一律 success」——渠道自报 failed 也计 success，
  # 于是下面两条 failure 告警在「渠道一直失败」时是哑的。
  - alert: AUTOFLOW_NOTIFICATION_FAILURE_RATE_HIGH
    expr: sum by (channel) (increase(autoflow_notification_delivery_total{result="failure"}[15m])) > 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "通知投递失败增多（channel={{ $labels.channel }}）"
      runbook: "docs/observability/README.md#autoflow_notification_failure_rate_high"
      runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_notification_failure_rate_high"

  - alert: AUTOFLOW_NOTIFICATION_FAILURE_STORM
    expr: sum(increase(autoflow_notification_delivery_total{result="failure"}[15m])) > 10
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "通知投递风暴：全渠道失败过多"
      runbook: "docs/observability/README.md#autoflow_notification_failure_storm"
      runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_notification_failure_storm"

  # blocked = 被 SSRF 策略拦截（不是传输故障）。正常应恒为 0：非零要么是渠道 URL
  # 被配成内网/回环（配置错误），要么有人在拿通知配置探测内网（安全事件）。
  - alert: AUTOFLOW_NOTIFICATION_BLOCKED_SPIKE
    expr: sum by (channel) (increase(autoflow_notification_delivery_total{result="blocked"}[15m])) > 0
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "通知渠道被 SSRF 规则拦截（channel={{ $labels.channel }}）"
      runbook: "docs/observability/README.md#autoflow_notification_blocked_spike"
      runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_notification_blocked_spike"

  # ── HTTP RED（本轮新增）────────────────────────────────────────────────
  # 数据源：autoflow_http_requests_total / autoflow_http_request_duration_ms_*
  # （HttpMetricsInterceptor 埋点，声明在 prometheus-metrics.service.ts）。
  # route label 是 **Express 路由模板**（/tasks/:id），不是原始 URL——原始
  # URL 带具体 id，每个 id 一条 series，是 RED 指标最常见的基数爆炸源；
  # 未匹配路由统一折成 "unmatched"（扫描器爱打的 /.env、/wp-admin 等）。
  # SSE / 长连接不入账（拦截器按 text/event-stream 与 /logs/stream 排除），
  # 否则一条挂几小时的日志流会把 P99 与 _sum 直接带偏。
  - name: autoflow-http-red
    rules:
      # 5xx 占比（cluster 级）。4xx 刻意不计入：鉴权失败/参数错/扫描器是
      # 调用方问题，混进来会让「有人在扫接口」触发服务端故障告警。
      # 调优思路：
      # - 5% 是保守起点；上线两周后按基线回调（本仓纪律：取 p99 的 2~3 倍）。
      # - 需要逐路由下钻时，把 `sum(...)` 换成 `sum by (route) (...)`——
      #   本文件与接线版必须保持 expr 空白归一后逐字一致，改这里要同步改
      #   config/monitoring/alerts.yml。
      # - clamp_min 分母防除零：无流量时占比无意义（NaN 不触发）。
      - alert: AUTOFLOW_HTTP_5XX_RATE_HIGH
        expr: |
          sum(rate(autoflow_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(autoflow_http_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "HTTP 5xx 占比升高（服务端错误率 > 5%）"
          description: >-
            5xx 占全部 HTTP 请求的 {{ $value | humanizePercentage }} 持续
            10 分钟（阈值 5%）。先在 Grafana「HTTP RED」行按 route 分行定位
            是哪个路由在报 5xx，再按该 route 过滤 admin-api 结构化日志的
            context 字段；HTTP 异常过滤器只在未捕获异常时产出 5xx，栈里通常
            就是根因。若 5xx 集中在 route="unmatched"，说明错误来自全局
            中间件/异常过滤器而非具体处理器。
          runbook: "docs/observability/README.md#http-red"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#http-red"

      # P99 慢请求。histogram_quantile 读的是手写累积桶
      # （le = 5/10/25/50/100/250/500/1000/2500/5000/+Inf ms），与 CORE-06
      # 的调度延迟直方图同一套渲染口径（本仓无 prom-client Histogram）。
      # 调优思路：
      # - 2s 是管理台 API 的保守起点（列表页含分页查询，正常在百毫秒级）。
      # - status_class!="5xx" 排除失败请求：失败请求的耗时没有容量意义，
      #   且 5xx 往往快速返回，会把 P99 拉低掩盖真实的慢请求。
      # - 均值对照：sum(rate(_sum))/clamp_min(sum(rate(_count)), 1e-9)。
      #   均值也高 = 整体变慢；均值正常而 P99 高 = 少量长尾。
      - alert: AUTOFLOW_HTTP_LATENCY_P99_HIGH
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(autoflow_http_request_duration_ms_bucket{status_class!="5xx"}[5m]))) > 2000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "HTTP P99 延迟超 2s（服务端慢请求）"
          description: >-
            全部路由的 HTTP P99 耗时 {{ $value }}ms 持续 10 分钟（阈值
            2000ms，已排除 5xx）。均值高 = 整体变慢（慢 SQL/大结果集分页/
            序列化放大），均值正常而 P99 高 = 少量长尾（锁等待、GC、偶发慢
            查询）；结合 autoflow_db_pool_waiting_requests 与
            nodejs_eventloop_lag_seconds 判断是存储层还是事件循环。SSE 长流
            不入账，故本条不会因日志流挂得久而误报。
          runbook: "docs/observability/README.md#http-red"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#http-red"

  # ── 执行器 fleet 水位（本轮新增）────────────────────────────────────────
  # 本节替代上方 ExecutorOffline 的「暂不启用」注释：本轮在
  # prometheus-metrics.service.ts 补了 autoflow_executors_online /
  # autoflow_executors_total 两个 gauge（数据源 = Executor 仓库，与 OBS-05
  # 磁盘水位同一取数路径），该告警从此可以表达。
  #
  # 纪律：渲染侧在 DB 查询失败时**保留上一轮值、绝不 reset 成 0**——
  # 否则每次 PG 毛刺都会把 online 打成 0，AllExecutorsOffline 立刻误报，
  # 值班人很快就会把它静音，真正掉线时反而没人看见。
  - name: autoflow-executor-fleet
    rules:
      # 全部执行器离线。`and autoflow_executors_total > 0` 是必需的前提守卫：
      # 全新部署/尚未注册任何执行器时 total=0，不告警（否则一装就炸）。
      # 10m 的 for 覆盖心跳判定离线的迟滞窗口，避免滚动重启期间抖动。
      - alert: AUTOFLOW_ALL_EXECUTORS_OFFLINE
        expr: |
          sum(autoflow_executors_online) == 0 and sum(autoflow_executors_total) > 0
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "全部执行器离线：没有任何在线执行器可接单"
          description: >-
            已注册执行器总数 > 0 但在线数为 0 持续 10 分钟——所有任务将只在
            队列积压（伴生 AUTOFLOW_QUEUE_BACKLOG 的 waiting 曲线上升），
            不会被执行。排查：① 执行器进程是否存活（各节点服务/桌面端托盘
            状态）；② 心跳是否到达 admin-api（GET /api/metrics/executors 看
            lastHeartbeat 与 offlineReason：manual=被手动下线、
            stale_timeout=心跳超时）；③ 网络与防火墙（pull 模式下执行器需
            能回连 admin-api）；④ 是否刚做过 token 轮换/升级导致全量注册失败
            （伴生 AUTOFLOW_PUSH_AUTH_STILL_UNAUTHORIZED）。注意
            autoflow_executors_online 在 DB 查询失败时保留旧值，若本条与 PG
            告警同时出现，先确认 DB 是否真的可查。
          runbook: "docs/observability/README.md#autoflow_all_executors_offline"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_all_executors_offline"

      # SSE 票据被用于非 stream 路由（PLAN-SECURITY-HARDENING §2.2）。
      #
      # 这是纯安全信号，正常业务下**恒为 0**：合法前端只会在三条 /stream
      # 路由的 ?ticket= 上传票据（EventSource 无法设请求头），access 令牌
      # 走 Authorization 头、不受本规则影响。因此任何一次拒绝都意味着有人
      # 拿到了票据文件（票据只能从 URL、浏览器历史或反代日志泄漏），并且
      # 正在尝试把它当全权令牌复用。
      #
      # 阈值取 >0 而非速率：误报面极低（前端代码路径固定），宁可一次就报。
      # reason 维度预留，当前只有 wrong_path 一个取值。
      - alert: AUTOFLOW_SSE_TICKET_REJECTED
        expr: |
          sum(increase(autoflow_sse_ticket_rejected_total{reason="wrong_path"}[15m])) > 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "SSE 票据被用于非 stream 路由（疑似票据泄漏后被复用）"
          description: >-
            15 分钟内有 SSE 票据被塞进非 stream 路由的 Authorization 头而
            遭拒（reason=wrong_path）。合法前端从不会这样做——EventSource
            只在三条 /stream 路由的 ?ticket= 上传票据，access 令牌走
            Authorization 头。因此这几乎必然意味着票据已从 URL、浏览器历史
            或反代访问日志中泄漏，且有人正在尝试把它当全权令牌复用（票据
            30 秒有效、路径受限，成功即等于全权访问）。处置：① 按 admin-api
            日志定位票据的 sub（用户）与来源 IP；② 立即 revoke 该用户全部
            会话并强制改密；③ 检查反代 access log 是否记录了 ?ticket=
            （应在 nginx 侧对该查询参数脱敏）。
          runbook: "docs/observability/README.md#autoflow_sse_ticket_rejected"
          runbook_url: "https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/observability/README.md#autoflow_sse_ticket_rejected"
