# docker-compose.staging.yml — staging 环境 override（E-3）
#
# 用法（staging 部署）：
#   cp .env.example .env   # 按 staging 覆盖（如 LOG_LEVEL=debug、弱密钥换强密钥）
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# 与生产共用同一基线 compose（靠 .env 区分）是配置漂移隐患；本 override 显式
# 收紧资源（减半）并默认 debug 日志，避免 staging 误用生产级资源/日志水位。
services:
  postgres:
    mem_limit: 768m
    cpus: '0.5'

  admin-api:
    mem_limit: 512m
    cpus: '0.5'
    environment:
      # staging 默认 debug 日志（可被 .env 的 LOG_LEVEL 覆盖前，此处强制 debug）
      LOG_LEVEL: debug
      # STAGING-HEAP（审计 P2，2026-10-17）：容器 mem_limit 减半到 512m，
      # 但基线 compose 的 `--max-old-space-size=512` 会被本 override **继承**
      # ——堆上限与容器上限完全重合。debug 日志下 RSS 还含非堆部分
      # （Buffer/元数据/原生内存），堆一逼近 512MB 就先撞 cgroup 硬限被
      # SIGKILL（OOMKilled），而不是 Node 自己 GC/报 heap out of memory。
      # 症状是「staging 的 admin-api 随机重启、日志无异常结尾」。
      # 与生产同款思路（生产 768m 容器配 512 堆，留 256m 非堆余量）：这里
      # 512m 容器配 320 堆，留 192m 余量。
      NODE_OPTIONS: '--max-old-space-size=320'

  executor-python:
    mem_limit: 768m
    cpus: '0.5'
    environment:
      LOG_LEVEL: debug
      # 次序不变量：本 override 把容器上限减半到 768m，基线的任务上限（768MB）
      # 就会**反转**成「任务上限 = 容器上限」——任务级 RLIMIT_AS 永远不会先
      # 触发，达到 cap 时由内核 cgroup OOM killer 挑受害者（同容器邻任务陪葬 +
      # 归因丢失）。与上方 admin-api 的 NODE_OPTIONS、下方 executor-node 的堆
      # 上限同一个道理：内存上限必须**成组**下调。守卫
      # scripts/check-sandbox-limit-order.mjs 钉住 512MB < 768m。
      TASK_MEMORY_LIMIT_MB: 512

  executor-node:
    mem_limit: 768m
    cpus: '0.5'
    environment:
      LOG_LEVEL: debug
      # STAGING-HEAP：同上——基线是 1024 堆 / 1G 容器，本 override 把容器
      # 减到 768m，堆必须同步下调（否则堆上限 > 容器上限，必然 OOMKilled）。
      NODE_OPTIONS: '--max-old-space-size=512'
      # 次序不变量：同 executor-python——容器减半到 768m，任务进程树看门狗的
      # 上限必须跟着降到其下（基线 768MB 会反转），否则先触发的是内核 OOM
      # killer，而不是我们自己的树杀 + 专属归因文案。
      TASK_MEMORY_LIMIT_MB: 512
