# NETOPT-2④: 与 apps/admin-web/nginx.conf 的 gzip 静态资源链对齐
# （deployment.md 明文要求两份配置保持同步）。此前本文件只有运行时 gzip
# 三行：缺 gzip_static（构建期预压缩 .gz 直发，零实时压缩 CPU）、缺
# gzip_vary（CDN/浏览器按编码区分协商缓存）、gzip_types 少 image/svg+xml
# application/wasm font/woff2、gzip_comp_level 用 nginx 默认 1（admin-web
# 侧为 5）。SSE（text/event-stream）与 admin-web 侧一致，刻意不在
# gzip_types 内——流式增量不压缩。
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm font/woff2;

# DEP-HA-1: 多副本（--scale admin-api=N）支持 —— 上游用「变量 + 运行时再解析」
# 形态：nginx 启动期不再把 admin-api 解析成单个 IP，而是每请求经 Docker 内嵌
# DNS（127.0.0.11）解析服务名，对 --scale 出来的多容器 A 记录轮询；容器重建
# IP 漂移后 10s（valid=10s）内收敛，滚动重启不再需要重启代理。单副本部署
# 行为不变（一条 A 记录 = 原直连语义）。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DEP-HA-1: 变量形态的统一上游（resolver 在上方 server 级声明）。
    set $admin_api_upstream admin-api:3105;
    # B-1（私有包仓库域审计）：私有包仓库上游同走变量形态——registry 服务为
    # 单实例（无 --scale 轮询诉求），变量化的收益是启动期不解析服务名：
    # registry 容器未就绪时 nginx 仍能启动，解析失败只影响当次请求（与
    # /api/ 块的 DEP-HA-1 取舍一致）。须与 apps/admin-web/nginx.conf 的
    # 对应三块同步（deployment.md 要求两份配置一致，差异仅在上游形态）。
    set $registry_pypi_upstream registry-pypi:8003;
    set $registry_npm_upstream registry-npm:4873;

    # API proxy
    location /api/ {
        # S7/QA2: nginx defaults to 1m — executor packages up to 500MB, app
        # packages up to 200MB and the pypi proxy up to 50MB.
        client_max_body_size 510m;
        proxy_pass http://$admin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # R12-fix（nginx-sse ⑤ 间歇性 terminated）：通用 /api/ 位置承载
        # executions/stream 与 metrics/stream 两条 SSE 长流。应用侧有 ping
        # 兜底（executions 30s / metrics 15s），但极端负载下事件循环可能
        # 短暂饥饿（CI 高负载实测），60s 会被偶发超时误断合法长流。
        # 放宽到 300s：普通 API 有 Nest 30s 超时兜底，SSE 流有 ping 兜底，
        # 该值只是极端场景的最后一层保险，不再误伤。
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        # DEP-HA-1: 取证头——暴露本请求实际命中的 upstream（IP:port），
        # ha-compose 自检据此断言多副本轮询；排障时也可定位实例。
        add_header X-Upstream $upstream_addr always;
    }

    # QA3: dedicated SSE location for execution log streams. A regex location
    # takes priority over the /api/ prefix location, but only URLs shaped
    # /api/tasks/<id>/executions/<execId>/logs/stream land here (task.controller
    # @Get(":id/executions/:execId/logs/stream") + global prefix "api"); every
    # other /api/ request still hits the prefix block above and keeps its 510m
    # upload limit. Regex locations do NOT inherit directives from sibling
    # locations, so proxy_set_header / client_max_body_size are repeated here.
    # DEP-HA-1: proxy_pass 同样走变量——静态形态会在启动期解析并永久缓存单个
    # IP，多副本/容器漂移下长流会钉在死地址上；server 级 set 的变量与 resolver
    # 对本 location 均生效（rewrite 阶段先于 location 匹配执行）。
    location ~ ^/api/tasks/[^/]+/executions/[^/]+/logs/stream$ {
        proxy_pass http://$admin_api_upstream;
        # The SSE request is a body-less GET; repeating 510m only keeps this
        # location self-contained (otherwise nginx falls back to the 1m default).
        client_max_body_size 510m;
        proxy_http_version 1.1;
        # Empty Connection header keeps the upstream HTTP/1.1 connection
        # persistent — required for a long-lived SSE stream.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Log streams may stay silent far longer than the generic 60s. The app
        # also sends 15s ": ping" frames and sets X-Accel-Buffering: no, which
        # nginx respects by default (no proxy_ignore_headers is set here).
        proxy_read_timeout 1h;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Upstream $upstream_addr always;
    }

    # APP-002 收口（生产故障根因）：/uploads **不在 /api 前缀下**。
    #
    # admin-api 的 `app.use("/uploads", …)` 注册在 `setGlobalPrefix("api")`
    # **之前**（main.ts:199 vs 209），故真实路径是 `/uploads/packages/*.zip`，
    # 而本文件此前只代理 `/api/`——于是该请求落进下方 SPA 回退，
    # `try_files $uri $uri/ /index.html` 找不到文件即回退成 **HTTP 200 +
    # index.html**。执行器把这段 HTML 当 zip 落盘，zip-guard 解析中央目录时
    # 找不到 EOCD 签名，报 `Unsafe package rejected by zip-guard [unparseable]`
    # ——错误指向执行器，根因却在代理层，且因为 HTTP 是 200 而毫无线索。
    #
    # 为什么现在才暴露：API_BASE_URL 缺失时上传接口直接 500，请求根本走不到
    # 下载；接线后上传首次成功，下载路径才第一次被真正执行。
    #
    # `^~` 前缀修饰符：命中后**不再检查正则 location**——下方静态资产正则含
    # js/css/png 等，若 /uploads 下将来出现同名扩展名的文件会被它抢走并 404。
    # proxy_pass **不带 URI**：保留原 `/uploads` 前缀（admin-api 就挂在该路径，
    # 与 /api/ 块同理，带尾斜杠会剥掉前缀导致 404）。
    # Authorization 头默认透传（nginx 不改客户端请求头）——/uploads 的鉴权
    # 中间件要求 JWT 或执行器共享 token，缺了它必然 401。
    location ^~ /uploads/ {
        # 应用包最大 200MB，下载可能远超默认 60s read timeout。
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 510m;
        proxy_pass http://$admin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # DEP-HA-1: 取证头，与 /api/ 块一致。
        add_header X-Upstream $upstream_addr always;
    }

    # B-1（私有包仓库域审计）：/pypi/ 与 /npm/ 反代——管理台页面可复制的
    # 安装命令（pip --index-url <origin>/pypi/simple/、npm config set registry
    # <origin>/npm/）此前无对应路由，落进 SPA try_files 回退（HTTP 200 +
    # index.html），pip/npm 端把 HTML 当索引/包且毫无线索（与 APP-002
    # /uploads 同形故障：目标路径不在 /api 前缀下）。
    #
    # 认证端到端透传：Authorization 原样转发（显式声明以自证契约）——
    # registry-pypi 索引面 S9 起一律要求 Basic、registry-npm 对所有包要求
    # $authenticated，反代**不新增任何匿名可达面**；凭据为部署下发的
    # REGISTRY_USER / REGISTRY_PASS 与 npm 服务账号。仓库服务宿主端口默认
    # loopback-only，反代是局域网客户端唯一可达入口。
    #
    # `^~` 前缀修饰符同 /uploads/ 块：命中后不再检查正则 location。
    # 剥前缀：变量 proxy_pass 的 URI 段会整体替换原始请求 URI（nginx 语义：
    # 带 URI 的 proxy_pass 在变量形态下「原样传递、替换整个请求 URI」），
    # 故用 rewrite 完成前缀剥离——/pypi/simple/ → /simple/、/pypi/ → /。
    location ^~ /pypi/ {
        rewrite ^/pypi(/.*)$ $1 break;
        proxy_pass http://$registry_pypi_upstream;
        # twine 经反代直传制品最大 50MB（registry-pypi S10 上限）+ 余量。
        client_max_body_size 60m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        add_header X-Upstream $upstream_addr always;
    }

    # B-1：制品下载面。registry-pypi 的索引锚点是绝对路径
    # href="/packages/<pkg>/<file>#sha256=…"，pip 按当前 origin 解析——若只
    # 代理 /pypi/ 不代理 /packages/，下载会再次落进 SPA 回退（pip 拿到
    # HTML 必然失败）。同为剥前缀代理。
    location ^~ /packages/ {
        rewrite ^/packages(/.*)$ $1 break;
        proxy_pass http://$registry_pypi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大制品下载可能远超默认 60s（同 /uploads/ 的考量）。
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        add_header X-Upstream $upstream_addr always;
    }

    # B-1：<origin>/npm/ → registry-npm /（剥前缀）。npm login / publish /
    # install 的全部路径（/-/user/login、/-/verdaccio/packages、tarball）
    # 都在前缀之下；凭据经 Authorization 透传（同上，不新增匿名面）。
    location ^~ /npm/ {
        rewrite ^/npm(/.*)$ $1 break;
        proxy_pass http://$registry_npm_upstream;
        # verdaccio 上游 max_body_size 100mb，反代上限须不小于它，否则 npm
        # publish 大包会在代理层被 413。
        client_max_body_size 110m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        add_header X-Upstream $upstream_addr always;
    }

    # L-5（下载速率限流 P2）：执行器包下载单连接带宽上限。
    # 为什么用 limit_rate 而不是 limit_req：包下载是「单请求、大 body」语义
    # （执行器包最大 500MB），按「每秒请求数」限流会把一次合法大包传输误杀；
    # limit_rate 限的是该连接向客户端吐响应体的字节速率——一次 500MB 下载在
    # 10MB/s 下约 50s 完成，不影响正常分发，只压住单连接把出口带宽打满的滥用。
    # 可调：带宽充足的内网分发可改大（20m / 50m），公网窄带可改小（2m）；
    # 改完用 `nginx -t` 校验。正则 location 不继承兄弟 location 的指令，故
    # proxy_set_header / client_max_body_size 与 /api/ 前缀块一致地重复一遍
    # （同 SSE location 的做法）。仅命中 GET /api/executor-packages/<uuid>/download，
    # 其余 /api/ 仍走前缀块、不受速率限制。
    location ~ ^/api/executor-packages/[^/]+/download$ {
        proxy_pass http://$admin_api_upstream;
        client_max_body_size 510m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        # L-5: 单连接下载速率上限（limit_rate 单位字节/秒，m=MB/s）。
        # 10m ≈ 80Mbps/连接；保守默认，兼顾正常大包分发与出口带宽保护。
        limit_rate 10m;
        add_header X-Upstream $upstream_addr always;
    }

    # F-4（可扩展性审查）：/socket.io/ WebSocket 代理块已删除——全仓无
    # socket.io / WebSocket 实际使用（前端长连接仅 SSE；ADR-015 已否决
    # WebSocket 反向隧道）。如需恢复，按下方 SSE location 的变量形态重写。

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NETOPT-2⑤: index.html 禁缓存（与 apps/admin-web/nginx.conf 同步）。
    # hash 资产已 immutable 1y，index.html 若无 Cache-Control，浏览器按启发式
    # 缓存（≈Last-Modified 时长的 10%），发版后老用户可持旧 index.html 指向
    # 已删除的 chunk → 白屏。精确 location 会命中 try_files 回退到
    # /index.html 的内部重定向，语义正确。本文件 server 级无 add_header，
    # 无需重复安全头（admin-web 侧有，见其 location = /index.html 注释）。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Static assets cache
    # NETOPT-4：补 try_files——hash 资产 location 此前缺失（admin-web 侧
    # nginx.conf 同位置已有），发版后旧资产被删时本块会把请求回退进 SPA
    # fallback 语义之外的四散路径；显式 $uri =404 让缺失资产快速失败，与
    # admin-web 侧行为对齐（deployment.md 要求两份配置同步）。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
