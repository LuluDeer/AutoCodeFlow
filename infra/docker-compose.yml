# infra/docker-compose.yml
# 用途：本地开发时仅启动基础设施依赖（postgres + redis），不含应用服务。
# 完整部署请使用根目录 docker-compose.yml。
#
# 使用方式：
#   cd <project-root>
#   cp .env.example .env  # 填写环境变量
#   docker compose -f infra/docker-compose.yml up -d   # 仅启动 postgres + redis
#   npm run start:dev  # 本地启动 admin-api

version: '3.9'

services:
  # ── Infrastructure ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-autoflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host access is local-only by default; local services use localhost.
    # Override deliberately when a host client must connect remotely.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autoflow}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host access is local-only by default; local services use localhost.
    # Override deliberately when a host client must connect remotely.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
