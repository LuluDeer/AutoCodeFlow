# infra/docker-compose.yml
# 用途：本地开发时仅启动基础设施依赖（postgres + redis），不含应用服务。
# 完整部署请使用根目录 docker-compose.yml。
#
# 使用方式：
#   cd <project-root>
#   cp .env.example .env  # 填写环境变量
#   docker compose -f infra/docker-compose.yml up -d   # 仅启动 postgres + redis
#   npm run start:dev  # 本地启动 admin-api

# F-5: 删除 version 字段——Compose V2 已弃用并告警，与根 docker-compose.yml 对齐
#
# 镜像 digest：与**根 docker-compose.yml 同一镜像同一 digest**（postgres:16-alpine /
# redis:7-alpine）。2026-11-04 起本文件进入 check-image-pinned 的扫描面
# （此前只扫仓库根 ⇒ 本机开发入口漏出判据面）。理由是「静默变化」型缺口：
# 上游重推同 tag ⇒ 本机栈与 CI 栈**字节不同**，而 CI 永远绿、无人报错
# —— diff 里看不见、单测看不见。
services:
  # ── Infrastructure ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-autoflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host access is local-only by default; local services use localhost.
    # Override deliberately when a host client must connect remotely.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autoflow}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    # Host access is local-only by default; local services use localhost.
    # Override deliberately when a host client must connect remotely.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
