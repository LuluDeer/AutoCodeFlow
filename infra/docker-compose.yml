version: '3.9'

services:
  # ── Infrastructure ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoflow
      POSTGRES_PASSWORD: autoflow_pass
      POSTGRES_DB: autoflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoflow']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Admin API (NestJS) ───────────────────────────────────
  admin-api:
    build:
      context: ../apps/admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: autoflow
      DB_PASSWORD: autoflow_pass
      DB_DATABASE: autoflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES_IN: 7d
    ports:
      - '3001:3001'

  # ── Admin Web (React/Vite) ───────────────────────────────
  admin-web:
    build:
      context: ../apps/admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - admin-api
    ports:
      - '80:80'

  # ── Python Executor ──────────────────────────────────────
  executor-python:
    build:
      context: ../apps/executor-python
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - admin-api
    environment:
      APP_NAME: executor-python-1
      PORT: 8001
      EXECUTOR_ADDRESS: executor-python:8001
      ADMIN_API_URL: http://admin-api:3001
      WORK_DIR: /tmp/autoflow/tasks
      MAX_CONCURRENT_TASKS: 10
    ports:
      - '8001:8001'

  # ── Node Executor ────────────────────────────────────────
  executor-node:
    build:
      context: ../apps/executor-node
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - admin-api
    environment:
      APP_NAME: executor-node-1
      PORT: 8002
      EXECUTOR_ADDRESS: executor-node:8002
      ADMIN_API_URL: http://admin-api:3001
      WORK_DIR: /tmp/autoflow/tasks
      MAX_CONCURRENT_TASKS: 10
    ports:
      - '8002:8002'

volumes:
  postgres_data:
