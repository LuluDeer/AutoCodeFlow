# Gitleaks 配置（SEC-06）——扩展默认规则集，仅声明"放行"例外，不删减任何默认规则。
# 工具：https://github.com/gitleaks/gitleaks
#   · pre-commit hook：见 .pre-commit-config.yaml（repo: gitleaks/gitleaks，rev 固定）
#   · CI job：.github/workflows/ci.yml 的 secret-scan（双保险：pre-commit 拦提交，
#     CI 拦直推/历史面）
# 本地全量扫描：gitleaks detect --source . --config .gitleaks.toml --verbose
#
# 例外原则：只 allowlist 明确的测试样例/文档演示假凭据（逐条注明理由），
# 不做全局路径放行——宁可误报跑一次修，不放漏一个真 secret。

[extend]
# 继承 gitleaks 内置默认规则（aws/azure/gcp/slack/私钥/通用 token 等一百余条）
useDefault = true

[allowlist]
description = "已审阅的测试样例与文档演示假凭据（逐条理由）"
# ⚠️ Go 正则不支持自由间隔——paths 必须单行、不得内联 # 注释（旧多行写法
# 把注释当字面量，allowlist 从未生效，QA-05 轮 CI 全历史扫描实证）。
# 放行口径 = 测试文件名模式（.spec/.test/.selftest/执行器 __tests__）+ 文档
# 示例 + ci.yml 自身 env——均为审阅过的 fixture 假凭据；生产 secret 走
# env/secret manager，不落任何被放行的文件形态。
paths = '''(?i)(e2e-full\.spec\.js|apps/executor-node/src/__tests__/|apps/executor-node/__tests__/|docs/.*\.md|README\.md|\.github/workflows/ci\.yml|.*\.spec\.ts|.*\.spec\.js|.*\.test\.tsx|.*\.test\.ts|.*\.selftest\.ts|.*-selftest\.mjs|scripts/.*-selftest\.mjs)'''
# 兜底：占位符标记的值一律放行（无论出现在哪个文件）
regexes = [
  # `REDACTED` 族是**本仓自己的脱敏占位标记**（脱敏器把密钥替换成它），
  # 不是密钥。gitleaks 的 generic-api-key 规则会把它误判为真凭据——
  # 第一次出现于 `apps/admin-api/src/common/utils/sanitize-secrets.util.ts`
  # （2026-11-02，候选 N8 收成单一脱敏实现时）。
  # 放行它**不是**放行密钥：它是**替换产物**，仓里任何真密钥都不会长这样；
  # 且真密钥的判定仍由 gitleaks 上百条默认规则（aws/azure/gcp/slack/私钥/通用 token）负责。
  # ⚠ 不要改成「按路径豁免整个文件」——那会把该文件里的真密钥一起放掉。
  '''(?i)(your[_-]?api[_-]?key|your[_-]?token|changeme|placeholder|<your-|dGVzdA==|admin123)''',
  '''\[REDACTED(_HEX|_B64)?\]''',
  # 脱敏一致性守卫（候选 N8）的**夹具**里必须放一条**真的长 base64**（>=40 字符）
  # 才能验证「40+ base64 样式串会被打码」这条规则 —— 缩短它会让该条断言失去意义。
  # 这里**精确放行这一条固定值**（不是按路径豁免整个文件）：它是我们**自己编的**假值，
  # 由 base64 的固定原文「QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVphYmNkZWZnaGlqa2xtbm9wcXJzdHU=」构成，
  # 不对应任何真实凭据。
  '''QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVphYmNkZWZnaGlqa2xtbm9wcXJzdHU=''',
  # -- 下面 4 个是**本仓自己编的假值**，出现在 2026-11-02 的「脱敏收成单一实现」那批提交里
  #    （注释里的示例 + 守卫夹具）。CI 的 secret-scan 扫**全量历史**（fetch-depth: 0），
  #    所以即使工作树已把这些改掉，**历史提交里的它们仍会被扫出来**。
  #    精确放行这 4 个**固定值**（不是按路径豁免）：它们不含任何真实凭据，
  #    且真实凭据的判定仍由 gitleaks 上百条默认规则（aws/azure/gcp/slack/私钥/通用 token）负责。
  #    这批值是**本会话引入**的——写注释/夹具时用了完整的 key=value 形态，
  #    而 gitleaks 的 generic-api-key 规则看的是「赋值符右侧的高熵串」。
  #    今后写示例：(1) 放在 allowlist 的测试文件路径下；(2) 或**不要写成完整赋值形态**。
  '''sk-live-abc123''',
  '''abcdef123456''',
  '''eyJhbGciOiJIUzI1NiJ9''',
  '''0123456789abcdef0123456789abcdef''',
]
