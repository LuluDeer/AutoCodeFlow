name: Release

# ── 触发与保护 ──────────────────────────────────────────────────────────
# 仅 push tag `vX.Y.Z[-pre]` 触发真发布（SDK lockstep：node-sdk / mcp-server /
# python-sdk 共用同一版本号）。桌面端安装包已**解耦**为独立 workflow
# `release-desktop.yml`（`desktop-vX.Y.Z` tag 触发），不在此处。发布流程：
#   1) 同步 bump SDK 三处版本（见下方守卫清单）并提交 develop/main；
#   2) git tag v<version> && git push origin v<version>。
# 故意不配 workflow_dispatch：避免手动误触发真发布；本地演练请用
#   `npm publish --dry-run` / `npm pack --dry-run` / `python -m build`，
#   取证方法见 docs/sdk-guide.md「SDK 矩阵」小节。
# N42 (round-10)：两个 publish job 挂 `environment: release` 审批闸门
#   （GitHub 侧配置 Settings → Environments → Required reviewers，详见
#   job 注释）；version-guard 只保证版本 lockstep，不防未授权 tag。
# N44 (round-11)：幂等与恢复语义——版本号一经发布即不可复用：
#   同版本重发 npm 必报 EP409（cannot publish over previously published
#   version）、PyPI 必回 400（File already exists，未配 skip-existing）。
#   两个 publish job 均无覆盖逻辑，失败干净、不产生部分写入，但整 run
#   重跑（Re-run jobs / 删 tag 后同版本重打）对已发布成功的一侧必红。
#   标准恢复路径：修复后 `gh run rerun <run-id> --failed`——只重跑失败的
#   publish job（version-guard 等已成功 job 不重跑；environment 审批门
#   需重新 Approve）。仅当需要更换 tag 指向的内容时才删 tag 重打，且
#   已发布成功的一侧必须 bump 版本换新 tag，否则该侧红是幂等保护、
#   不是回归。恢复纪律同步见 docs/sdk-guide.md「版本与发布流程」。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 版本一致性守卫：tag 必须等于每个待发布包的 version，否则 fail ──
  version-guard:
    runs-on: ubuntu-latest
    # N44 (round-11)：原 outputs.version 无任何下游消费（两个 publish job
    # 仅 needs 依赖本 job 的通过/失败），死输出已删除。
    steps:
      - uses: actions/checkout@v7

      - name: Version guard (tag == package versions)
        id: guard
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          python3 - "$RELEASE_TAG" <<'PY'
          import json, re, sys

          tag = sys.argv[1]
          m = re.fullmatch(r"v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)", tag)
          if not m:
              print(f"::error::tag {tag!r} 不是合法发布 tag（期望 vX.Y.Z[-pre]）")
              sys.exit(1)
          want = m.group(1)

          def pkg_json_version(path):
              with open(path, encoding="utf-8") as f:
                  return json.load(f)["version"]

          def pyproject_version(path):
              try:
                  import tomllib
                  with open(path, "rb") as f:
                      return tomllib.load(f)["project"]["version"]
              except ModuleNotFoundError:  # python < 3.11 兜底
                  text = open(path, encoding="utf-8").read()
                  sec = text.split("[project]", 1)[1]
                  return re.search(r'^version\s*=\s*"([^"]+)"', sec, re.M).group(1)

          def regex_version(path, pattern):
              with open(path, encoding="utf-8") as f:
                  return re.search(pattern, f.read(), re.M).group(1)

          checks = {
              "@autocodeflow/sdk (packages/autocodeflow-node-sdk/package.json)":
                  pkg_json_version("packages/autocodeflow-node-sdk/package.json"),
              "@autocodeflow/cli (packages/acf-cli/package.json)":
                  pkg_json_version("packages/acf-cli/package.json"),
              "autocodeflow-mcp-server (packages/mcp-server/package.json)":
                  pkg_json_version("packages/mcp-server/package.json"),
              "autoflow-sdk (packages/autoflow-sdk/pyproject.toml)":
                  pyproject_version("packages/autoflow-sdk/pyproject.toml"),
              "autoflow_sdk.__version__ (packages/autoflow-sdk/autoflow_sdk/__init__.py)":
                  regex_version("packages/autoflow-sdk/autoflow_sdk/__init__.py",
                                r'^__version__\s*=\s*"([^"]+)"'),
          }

          bad = {k: v for k, v in checks.items() if v != want}
          for k, v in checks.items():
              print(f"{'OK ' if v == want else 'BAD'}  {k}: {v}  (tag wants {want})")
          if bad:
              print("::error::版本一致性守卫失败，拒绝发布："
                    + "; ".join(f"{k}={v}" for k, v in bad.items()))
              sys.exit(1)

          print(f"version guard passed: {want}")
          PY

  # ── npm 发布 ─────────────────────────────────────────────────────────
  # secrets.NPM_TOKEN：npmjs.com 的 Automation/Access token
  # （npm → Access Tokens → Generate New Token）。setup-node 的
  # registry-url + NODE_AUTH_TOKEN 会自动写入 ~/.npmrc：
  #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
  # 包侧无需 .npmrc：@autocodeflow/sdk 已在 package.json 配
  # publishConfig.access=public（scoped 包默认 private，必须显式 public）。
  # 若发内网 Verdaccio（apps/registry-npm），把 registry-url 换成私有地址
  # 并改用 verdaccio 用户 token。
  # 注：CLI 的包名是 `@autocodeflow/cli`，**不是** `acf-cli`——后者在 npmjs 上
  # 已被第三方占用（`npm view acf-cli` → 1.0.1，一个 NPM+Java 安装指南），
  # 直接 publish 必然 403，故长期未纳入矩阵。改用本仓已持有的 `@autocodeflow`
  # scope（与 @autocodeflow/sdk 同 scope，品牌一致且不会被抢注）。
  # `bin` 名保持 `acf` 不变——终端命令改名会破坏既有脚本与用户肌肉记忆，
  # 而 bin 名不必与包名一致。
  # 注意勿用 `@autoflow/*`：该 scope 已被抢注（见 f0f8b96 改名理由）。
  publish-npm:
    needs: version-guard
    runs-on: ubuntu-latest
    # N42 (round-10): tag push 本身即发布动作，version-guard 之外再加一道
    # 人工审批闸门。`environment: release` 需在 GitHub 侧配置：
    #   仓库 Settings → Environments → New environment（名必须为 `release`）
    #   → Environment protection rules → Required reviewers（指定 1+ 审批人）。
    # 配置后，两个 publish job 会停在 "waiting" 直至审批通过；未配置该
    # environment 时 GitHub 隐式放行（不报错），故启用 workflow 前必须先建。
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: packages/autocodeflow-node-sdk
            pkg: '@autocodeflow/sdk'
          - dir: packages/acf-cli
            pkg: '@autocodeflow/cli'
          - dir: packages/mcp-server
            pkg: 'autocodeflow-mcp-server'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # node 20 已入弃用周期；且 lockfile 由 npm 11 生成，node 20 自带
          # npm 10 解析有差异（f3a2d88 教训），与 CI 对齐 node 24
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Publish (dry-run 结构校验)
        working-directory: ${{ matrix.dir }}
        run: npm publish --access public --dry-run

      - name: Publish
        working-directory: ${{ matrix.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  # ── PyPI 发布 ────────────────────────────────────────────────────────
  # U-1（2026-09）：已迁移到 PyPI Trusted Publishing（OIDC，免长期 token）——
  # 本 job 声明 `permissions: id-token: write` 且不再使用 secrets.PYPI_API_TOKEN，
  # 发布凭证由 pypi.org 侧 OIDC 动态签发，无长期 token 泄露面。
  # ⚠ 本 job 依赖一个**仓库外的手动登记**，漏做则发版当天才失败（v1.5.0 实证）：
  #     Trusted publishing exchange failure: invalid-publisher:
  #     valid token, but no corresponding publisher
  #   该报错**不指向本注释**（v1.5.0 排查实证：报错只给出 OIDC claims，需要靠
  #   claims 反推登记缺失），排查成本很高——故登记参数在此固化。
  #   登记步骤与逐字参数见 docs/release-checklist.md「4.2.1 PyPI 发布凭证」：
  #     pypi.org → autoflow-sdk → Publishing → Add a new trusted publisher
  #     Owner=LuluDeer / Repository=AutoCodeFlow /
  #     Workflow name=release.yml（只文件名，无 .github/workflows/ 前缀）/
  #     Environment name=release（必须填：本 job 有 environment: release，
  #     OIDC claims 的 sub 因此是 repo:LuluDeer/AutoCodeFlow:environment:release，
  #     PyPI 侧留空即与之不匹配）
  # 登记完成后，本 job 不再需要任何 PyPI secret。
  # 临时回退（登记未完成时）：给下方 Publish 步骤加回
  #   password: ${{ secrets.PYPI_API_TOKEN }}（该 secret 仍在仓库中）。
  # 内网发布：加 `repository-url: https://<registry-pypi-host>/...` 并把
  # token 换成私有 registry 凭证（apps/registry-pypi）。
  publish-pypi:
    needs: version-guard
    runs-on: ubuntu-latest
    # U-1: OIDC 取 token 需要 id-token 权限；contents: read 保留给 checkout。
    # 注意：job 级 permissions 会覆盖 workflow 级默认（此处显式补回 contents: read）。
    permissions:
      contents: read
      id-token: write
    # N42 (round-10): 与 publish-npm 同一道人工审批闸门（配置路径见该 job
    # 注释：Settings → Environments → `release` → Required reviewers）。
    # Trusted Publishing 的 OIDC 配置同样以 environment 为锚点（pypi.org 登记
    # 时指定 environment 名称），此闸门保留。
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        working-directory: packages/autoflow-sdk
        run: python -m build

      - name: Publish to PyPI
        # NETOPT-4：SHA 钉死（release/v1 分支头 = dc37677）。本 action 以
        # PyPI Trusted Publishing 的 OIDC（id-token: write）发布，tag 漂移
        # 即发布凭据面漂移；升级走 dependabot（github-actions 生态，weekly，
        # 会跟随 `# release/v1` 注释更新钉死 SHA）受控 PR。
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/autoflow-sdk/dist/

  # ── 保护桌面自动更新：把本 tag 的 Release 移出 GitHub「latest」竞争 ──────
  # 根因（v1.5.0 实证，客户端报错）：
  #   Cannot find latest.yml in the latest release artifacts
  #   (.../releases/download/v1.5.0/latest.yml): HttpError: 404
  # electron-updater 的 github provider **硬编码**查仓库的 latest release
  #   （GitHubProvider.js:162 → /releases/latest；channel 只改文件名
  #   latest.yml→xxx.yml，不改 latest 的选择），**无法**指定 tag。
  # 而 round-14 把桌面解耦成独立 `desktop-v*` tag 线后，两条 tag 线仍共用
  #   同一个 GitHub Releases 池：本 workflow 的 `v*` Release 是 SDK 发版产物、
  #   **不含任何安装包**，一旦它比 desktop-v* 新就抢占 latest，客户端随即 404
  #   ——**每次 SDK 发版都会复发**（v1.5.0 打完，全量装机用户更新检查即坏）。
  #
  # 修法：GitHub 的 latest 判定**排除 prerelease**，故把本 Release 标为
  #   prerelease 即永久退出竞争，latest 恒为 desktop-v*（含 latest*.yml）。
  #   - 不影响 npm/PyPI 发布（产物不在 GitHub Releases）；
  #   - 不影响 release-please 状态机（它以 tag 与 Release 存在性为事实源，
  #     prerelease 仍是 Release——已实测：标完后 release-please 仍 success、
  #     无 untagged/aborting）；
  #   - 幂等，重跑安全。
  # 为什么 needs 只依赖 version-guard 而非 publish：保护桌面更新的窗口越短
  #   越好；且即使某个 publish 失败，latest 也必须已经被保护（否则存量用户
  #   立刻受影响）。故与 publish 并行，不等其结果。
  demote-sdk-release:
    needs: version-guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark this SDK release as prerelease (protect desktop auto-update)
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # Release 可能尚未被 release-please 创建（时序竞争），轮询等待。
          for _ in $(seq 1 30); do
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::warning::Release $tag 尚不存在，跳过标记（若它随后被创建，桌面 latest 会被抢占，需人工复核）"
            exit 0
          fi
          gh release edit "$tag" --repo "${{ github.repository }}" --prerelease
          echo "::notice::Release $tag 已标记为 prerelease——退出 GitHub latest 竞争，桌面自动更新源保持为 desktop-v*"
