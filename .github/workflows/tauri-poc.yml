# ── Tauri 2 POC 构建（仅手动触发）──────────────────────────────────────
# 验证同一份 V2 渲染层能在 Tauri/WebKitGTK 上编译。POC 不含 IPC/托盘/更新器，
# 不参与发布；构建产物只作为 artifact 留档。
name: tauri-poc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/executor-desktop-v2/package-lock.json

      - name: Install WebKitGTK / GTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build V2 renderer (frontendDist)
        working-directory: apps/executor-desktop-v2
        run: |
          npm ci
          npm run build

      - name: cargo build (release)
        working-directory: apps/executor-desktop-tauri
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tauri-poc-binary
          path: apps/executor-desktop-tauri/src-tauri/target/release/acf-executor-tauri
          retention-days: 7
