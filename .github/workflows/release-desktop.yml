name: Release Desktop

# ── 桌面端安装包独立发布（N47 hotfix 解耦，用户拍板 round-14）────────────
# 背景：v1.4.3 之前桌面安装包与 npm/PyPI SDK 共用 lockstep 单版本线 + 单一
#   `v*` tag，导致任何纯桌面 hotfix（如窗口透明渲染 bug）都会连带 bump 并
#   重发 npm/PyPI SDK（内容未变）。解耦后：
#     - 桌面独立版本线（apps/executor-desktop/package.json 单独维护）
#     - 用独立的 `desktop-vX.Y.Z` tag 触发本 workflow，只发桌面安装包
#     - npm/PyPI 的发布（release.yml）完全不受影响
# 触发形态：`git tag desktop-v1.4.4 && git push origin desktop-v1.4.4`。
# 注意：release-please 的 SDK 版（release.yml）用普通 `v*` tag，两者前缀
#   不同不会互相触发（workflow 的 on 条件各自收敛匹配）。
#
# 桌面版本守卫：tag 必须等于 apps/executor-desktop/package.json 的 version，
#   否则 fail。desktop version 也会写进 electron-builder 出包的
#   latest.yml / 安装包文件名，是 electron-updater 的版本比较基准；守卫保证
#   打 tag 的版本与出包版本一致，客户端自动更新不会因版本漂移永久失效。
#
# 发布形态（DESKTOP-PUBLISH-01）：三平台各自原生 runner 出包，上传到以
#   `desktop-vX.Y.Z` 命名的 GitHub Release（electron-updater 通过 latest*.yml
#   的 version 决定可更新性，不依赖 Release/tag 名称形态）。用官方 gh CLI
#   env release create + upload（runner 预装、GITHUB_TOKEN 认证），先确保
#   Release 存在再逐平台追加资产（见 job 内注释）。
on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 桌面版本守卫：tag（去 desktop- 前缀）必须 == desktop package.json ──
  desktop-version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Desktop version guard (desktop-v<ver> == package.json version)
        id: guard
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          python3 - "$RELEASE_TAG" <<'PY'
          import json, re, sys

          raw = sys.argv[1]
          # 期望形态 desktop-vX.Y.Z[-pre]
          m = re.fullmatch(r"desktop-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)", raw)
          if not m:
              print(f"::error::tag {raw!r} 不是合法桌面发布 tag（期望 desktop-vX.Y.Z[-pre]）")
              sys.exit(1)
          want = m.group(1)

          with open("apps/executor-desktop/package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          actual = pkg["version"]

          print(f"{'OK ' if actual == want else 'BAD'}  executor-desktop: {actual}  (tag wants {want})")
          if actual != want:
              print(f"::error::desktop 版本守卫失败，拒绝发布：executor-desktop={actual} (tag wants {want})")
              sys.exit(1)

          print(f"desktop version guard passed: {want}")
          PY

  # ── 桌面端安装包构建 + 上传（DSK-06 / DESKTOP-PUBLISH-01）─────────────────
  # 三平台各自原生 runner：electron-builder 不支持交叉产出 mac 的 dmg、
  # win 又要 wine 兜底，原生 runner 是唯一稳妥形态。Linux 只出 x64。
  # mac 侧无 Apple Developer ID，CI 用 CSC_IDENTITY_AUTO_DISCOVERY=false
  # 跳过签名（产物不适合直接分发，验证链路优先）。
  desktop-installer:
    needs: desktop-version-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            paths: |
              apps/executor-desktop/dist-electron/*.exe
              apps/executor-desktop/dist-electron/*.blockmap
              apps/executor-desktop/dist-electron/latest.yml
          - os: macos-latest
            script: dist:mac
            paths: |
              apps/executor-desktop/dist-electron/*.dmg
              apps/executor-desktop/dist-electron/*.blockmap
              apps/executor-desktop/dist-electron/latest-mac.yml
          - os: ubuntu-latest
            script: dist:linux
            paths: |
              apps/executor-desktop/dist-electron/*.AppImage
              apps/executor-desktop/dist-electron/*.deb
              apps/executor-desktop/dist-electron/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/executor-desktop/package-lock.json

      - name: Install desktop deps
        working-directory: apps/executor-desktop
        run: npm ci

      # bundle-executor.sh 的 ncc 会对 executor-node 全项目做类型检查，
      # 必须先装其依赖，否则整片报错（同 ci.yml desktop-linux-bundle 的教训）。
      - name: Install executor-node deps (ncc 类型检查前置)
        working-directory: apps/executor-node
        run: npm ci

      - name: Main-process selftests
        working-directory: apps/executor-desktop
        run: npm run test:main

      # 安装包内必须内嵌与源码一致的 executor bundle：F-19 的清单校验
      # 在 CI 的 desktop-bundle-drift job 离线重打比对过；这里构建时会重新生成。
      # 发布包必须自带 uv（desktop-v1.5.1 实爆）：全新设备上没装 uv 时，执行器
      # 只上报 `runtimes: shell, node`，所有声明 runtimeVersion 的 Python 任务
      # 全部不可用，而用户侧只有一条 WARN。因此发布构建显式打开 uv 打包，
      # 并用 ACF_UV_REQUIRED=1 把"没打进 uv"从 WARN 升级为硬失败——绝不允许
      # 再产出一个能力残缺的安装包。ACF_UV_VERSION 固定版本，保证可复现。
      - name: Build installer
        working-directory: apps/executor-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ACF_BUNDLE_UV: '1'
          ACF_UV_REQUIRED: '1'
          ACF_UV_VERSION: '0.8.17'
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Verify embedded executor bundle present
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/executor-desktop/resources/executor-node/index.js \
            || { echo "::error::executor-node bundle missing — installer 会缺少执行器内核"; exit 1; }
          echo "executor bundle present: $(wc -c < apps/executor-desktop/resources/executor-node/index.js) bytes"

      # 打包前校验"资源目录里有 uv"还不够——真正决定用户体验的是**安装包内**
      # 有没有 uv。electron-builder 的 extraResources 过滤规则写错时，源目录
      # 有文件也会被漏掉，所以这里直接解包已生成的安装产物来断言。
      - name: Verify uv embedded in packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          cd apps/executor-desktop
          exe_name="uv"; case "${{ matrix.os }}" in windows-*) exe_name="uv.exe" ;; esac

          test -f "resources/uv/${exe_name}" \
            || { echo "::error::resources/uv/${exe_name} 缺失 — uv 打包失败（发布闸应已拦住，此处兜底）"; exit 1; }
          echo "staged uv: $(wc -c < "resources/uv/${exe_name}") bytes"

          found=0
          work="$(mktemp -d)"
          case "${{ matrix.os }}" in
            windows-*)
              # NSIS 安装包**不能直接**用 7z 列：electron-builder 产出的 .exe
              # 只是 NSIS 外壳，`7z l` 仅列出 $PLUGINSDIR\$R0 等外壳条目，真正
              # 的应用负载在**嵌套的** $PLUGINSDIR\app-64.7z 内。desktop-v1.5.2
              # 首发时此处误判为"未找到 uv"——而同一步上方已打印
              # `staged uv: 59046912 bytes`（真 uv.exe 确已在包内），说明问题在
              # 校验方法而非打包。正确做法：先取出嵌套 7z 再列它，其条目形如
              # `resources\executor-node\index.js`，与下面的正则一致。
              nsis="$(ls dist-electron/*.exe | head -n 1)"
              7z e "$nsis" "-o$work" '$PLUGINSDIR/app-64.7z' -y >/dev/null 2>&1 || true
              # P3-3：区分两类失败。取不到嵌套 app-64.7z 是**解包环境/包结构**
              # 问题（如 7z 缺少 Nsis 解码器——本机 bundled 7za 就没有该 codec，
              # 会直接解析内嵌 7z 流、0 文件取出），与"uv 漏打包"无关。若继续
              # 走下去，nsis-list.txt 不存在、grep 不匹配，最终只会抛"extraResources
              # 可能漏带"，把人引向错误的排查方向。这里显式给出独立错误（仍 fail-
              # closed：宁可假红，绝不假绿）。
              if [ ! -f "$work/app-64.7z" ]; then
                echo "::error::NSIS 解包失败：未从安装包取出嵌套的 \$PLUGINSDIR/app-64.7z（7z 缺少 Nsis 解码器或安装包结构变化）——这不是 uv 漏打包，请先检查校验环境"
                exit 1
              fi
              if ! 7z l "$work/app-64.7z" > "$work/nsis-list.txt" 2>/dev/null; then
                echo "::error::已取出 app-64.7z 但 7z 无法列出其内容——无法据此确认 uv 是否在包内（校验环境问题，非打包结论）"
                exit 1
              fi
              if grep -qiE 'resources[\\/]uv[\\/]uv\.exe' "$work/nsis-list.txt"; then found=1; fi
              ;;
            macos-*)
              # dmg → 挂载后进 .app/Contents/Resources/uv/uv 查看。
              # 多 arch（x64+arm64）会产出多个 dmg：逐个挂载，命中即止。
              for dmg in dist-electron/*.dmg; do
                [ -f "$dmg" ] || continue
                mnt="$work/mnt"; mkdir -p "$mnt"
                hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet || continue
                if compgen -G "$mnt/*.app/Contents/Resources/uv/uv" >/dev/null; then found=1; fi
                hdiutil detach "$mnt" -quiet || true
                [ "$found" = "1" ] && break
              done
              ;;
            ubuntu-*)
              # AppImage 是 squashfs：--appimage-extract 在**当前目录**展开成
              # squashfs-root，必须 cd 进 work 目录再跑，展开结果才可预期。
              appimg="$(ls dist-electron/*.AppImage | head -n 1)"
              ( cd "$work" && "$GITHUB_WORKSPACE/apps/executor-desktop/$appimg" --appimage-extract >/dev/null 2>&1 ) || true
              if [ -f "$work/squashfs-root/resources/uv/uv" ]; then found=1; fi
              ;;
          esac
          rm -rf "$work" 2>/dev/null || true

          if [ "$found" != "1" ]; then
            echo "::error::安装包内未找到 uv（${exe_name}）— electron-builder extraResources 可能漏带；全新设备将无法执行声明 runtimeVersion 的 Python 任务"
            exit 1
          fi
          echo "::notice::安装包内已确认自带 uv（${exe_name}）— Python 多版本任务可用"

      # 产物哈希：供下载者核对完整性。三平台各一份，避免并行互相覆盖。
      # N46（v1.4.1 实证）：文件名含空格，不能用 xargs sha256sum（会按空白
      # 切碎报 No such file）；用 find -print + while IFS= read -r 逐行读
      # （GNU/BSD find、bash 3.2/5.x 全兼容），sha256sum 缺省回落 shasum。
      - name: Generate SHA256SUMS
        shell: bash
        working-directory: apps/executor-desktop/dist-electron
        run: |
          set -euo pipefail
          outfile="SHA256SUMS-${{ matrix.os }}.txt"
          : > "$outfile"
          n=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> "$outfile"
            else
              shasum -a 256 "$f" >> "$outfile"
            fi
            n=$((n+1))
          done < <(find . -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' \) -print | sort)
          if [ "$n" -eq 0 ]; then
            echo "::error::未找到任何安装包产物"; exit 1
          fi
          echo "找到 $n 个安装包产物"
          cat "$outfile"

      # DESKTOP-PUBLISH-01（真发布启用）：把三平台安装包 + SHA256 上传到当前
      # `desktop-v<ver>` tag 对应的 GitHub Release。用官方 gh CLI（runner 预装、
      # 自动以 GITHUB_TOKEN 认证，`permissions: contents: write`）替代第三方
      # softprops/action-gh-release——消除了该 action 的 Node.js 20 弃用告警
      # （它声明 Node 20 运行时，被告警 forced to run on Node 24）。
      #   - release create：三平台并行，首个创建 Release、其余 `|| true` 幂等跳过；
      #   - release upload：--clobber 覆盖旧资产，逐平台追加，不互相覆盖。
      # N45（v1.4.2 实证）：文件名含空格（productName "AutoCodeFlow Executor"，
      # *.exe/*.dmg/*.AppImage/*.deb），用 find -print + while 逐行读构造参数
      # 数组（GNU/BSD find、bash 3.2/5.x 兼容），不能用 xargs 切空白。
      # 只上传实际产物面（*.exe/*.dmg/*.AppImage/*.deb + *.blockmap +
      # latest*.yml + 本平台 SHA256SUMS），找不到任何产物即硬失败（等价
      # fail_on_unmatched_files）。
      - name: Ensure Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release create "$tag" --repo "${{ github.repository }}" \
            --title "$tag" --generate-notes || \
            { echo "::notice::Release $tag 已存在（或已被创建），跳过 create"; }

      - name: Upload installer to GitHub Release
        shell: bash
        working-directory: apps/executor-desktop/dist-electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          files=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            files+=("$f")
          done < <(find . -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.blockmap' \
            -o -name 'latest*.yml' \
            -o -name 'SHA256SUMS-${{ matrix.os }}.txt' \) -print | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::未找到任何发布产物"; exit 1
          fi
          echo "上传 ${#files[@]} 个产物："
          printf '  - %s\n' "${files[@]}"
          gh release upload "$tag" --repo "${{ github.repository }}" --clobber "${files[@]}"

          # 上传后核验：**这一步是本工作流唯一能抓到「静默失败」的地方**。
          # 2026-09-23 实证（desktop-v1.6.0 三次重跑）：三个 installer job 全绿、
          # release 也建出来了，但 `gh release upload` 在数秒内静默返回 0，
          # **一个资产都没落地**（assets=0），而历史版本 1.5.4~1.5.10 每个都有 14 个。
          # 也就是说「job 绿」根本不能证明发布成功——必须回读 release 的资产数。
          # 断言口径取「≥ 本 job 计划上传的文件数」：三平台并行各传各的，
          # 全局计数只会更大，故下界是安全的。
          count="$(gh release view "$tag" --repo "${{ github.repository }}" \
            --json assets --jq '.assets | length')"
          # 变量必须写成 ${count} 花括号形态：紧跟其后的全角「（」是多字节字符
          # （U+FF08 = EF BC 88），而 macOS runner 的 `shell: bash` 走的是系统
          # /bin/bash（3.2，非 UTF-8 locale），它会把 0xEF 当作标识符的一部分吞进去
          # → 变量名变成 `count\xEF` → set -u 下直接 `count�: unbound variable`。
          # 2026-09-23 实证（desktop-v1.6.0 补发 run 35864019734）：macOS job 的
          # `gh release upload` **已经成功上传全部 6 个资产**，随后死在这条 echo 上
          # ——于是「发布成功」被渲染成 job 红。同一行在 ubuntu（bash 5.x + UTF-8
          # locale）正常打印，故只有 macOS 单点复现。花括号界定变量名边界即修。
          echo "release 现有资产数 = ${count}（本 job 上传 ${#files[@]} 个）"
          if [ "$count" -lt "${#files[@]}" ]; then
            echo "::error::gh release upload 静默未生效：本 job 应上传 ${#files[@]} 个资产，但 $tag 只有 $count 个。job 绿 ≠ 发布成功，请检查上传链路。"
            exit 1
          fi