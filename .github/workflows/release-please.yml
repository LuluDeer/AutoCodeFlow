name: Release Please

# ── DOC-05：CHANGELOG 自动化（release-please）──────────────────────────
# 选型裁定（vs changesets）：
#   1) 本仓 commit 纪律是「中文 conventional commits」（feat:/fix:/docs:/chore:…，
#      见 docs/development.md「Commit 规范」节）——release-please 对 conventional
#      commits 原生解析，零迁移成本；changesets 依赖 PR 里手写 .changeset/*.md
#      增量文件，与既有纪律并行多一套仪式，收益主要是 JS monorepo 手动管理场景。
#   2) 本仓三包（@autocodeflow/sdk / autocodeflow-mcp-server / autoflow-sdk）
#      实际走 **lockstep 单版本线**（当前均 1.0.1，version-guard 四处一致性
#      强制同版本），无需 changesets 的「按包独立版本 + private 包提升」能力。
#   3) release-please 对 python（pyproject.toml）与 node（package.json）混合仓
#      原生支持，changesets 只管 npm 包。
#
# 与既有 release.yml 的衔接（**不改动 release.yml 本体**）：
#   ┌ push main ──→ 本 workflow：汇总 conventional commits →
#   │   若有可发布变更：开/更新 Release PR（bump 三包 version + 生成/追加
#   │   CHANGELOG.md）——注意 Release PR 的 merge 不会直接触发发布；
#   │   release-please 创建 GitHub Release 时才打 tag v(X.Y.Z)。
#   └ tag v* push ──→ 既有 release.yml：version-guard（tag == 三包四处
#       version 一致性）→ environment 审批闸 → npm + PyPI 发布。
#   即：**Release PR 合并 → release-please 打 tag → tag 恰好触发 release.yml**
#   ——发布管道、审批闸、幂等语义全部复用既有实现。
#
# lockstep 对齐（关键配置，2026-10 根治后）：
#   release-please-config.json 用**单一 root 条目（"."）**承担整条 1.x 版本线：
#     * `include-component-in-tag: false` → tag 形态为裸 `vX.Y.Z`，与 release.yml
#       的 tag 触发模式 `v*` 与 version-guard 的 `v(\d+\.\d+\.\d+…)` 正则精确匹配；
#     * 其余版本承载文件（三 npm 包的 package.json + package-lock.json 两个
#       version 槽位、pyproject.toml、py SDK `__init__.py`、docs-site 五页、
#       docs/sdk-guide.md）全部由该条目的 `extra-files` **广播**更新
#       ——版本号只有一个来源，不再可能出现「包之间版本漂移」。
#   py-libs 四包（autocodeflow-http/ai/db/notify）保留独立的 linked-versions 组，
#   但**逐包打开 `include-component-in-tag: true`**，tag 形态为
#   `autocodeflow-http-v0.2.2`——这样它们退出 `v*` 命名空间，不再误触发
#   release.yml（历史实证：PR #29 同时产出 `v1.7.0` 与 `v0.2.2`，后者触发
#   release.yml 并在 version-guard 上失败）。
#
# 为什么不是「每包一个条目 + 顶层 linked-versions」（2026-10 实测的三条硬事实）：
#   1) `linked-versions` 是 plugin，只能写在 `plugins` 数组里。写成顶层键会被
#      **静默丢弃**（schema 根 additionalProperties:false 且不含该键；
#      manifest.js 只读 config['plugins']）——实测加载到的 plugins 数为 0。
#   2) 即便写对位置，本仓也修不好：linked-versions 的 preconfigure() 用
#      `strategy.getComponent()` 匹配组员，而 `include-component-in-tag: false`
#      时该方法恒返回 `''`（base.js），组员匹配全部 continue 跳过 → 版本统一
#      **永不执行**（实测日志「Found 0 group components」）；而同一个开关又控制
#      tag 命名，打开它 tag 就变成 `pkg-vX.Y.Z`，与 `v*` 触发器不再匹配。
#      ⇒ 裸 tag 与 linked-versions 在本仓**不可兼得**。上游 issue #1750
#      （2022-11 报，2024-08 关闭且无修复提交）即此问题。
#   3) 每包 component 都是 `''` 时，manifest.js 的 getPathsByComponent() 会把
#      **全部包塌缩成同一个 `''` 键**（后者覆盖前者），基线解析因此找不到
#      对应 release，每个版本都靠 backfillReleasesFromTag 兜底。
#
# 已知限制（现行）：
#   a) 1.x 单版本线的 CHANGELOG 落在**根** CHANGELOG.md（root 条目的 changelog
#      路径），不再逐包生成。各包 package.json 的 `files` 均不含 CHANGELOG，
#      不影响发布物内容。
#   b) root 条目用 release-type `simple` + `version-file: version.txt`，因此
#      根 package.json（private，无消费者）的版本号**不**参与 lockstep；版本
#      事实源是 version.txt 与各包清单，由 version-guard 强校验。
#   c) py-libs 的 tag 带 component 前缀（`<pkg>-vX.Y.Z`），与 1.x 的裸
#      `vX.Y.Z` 分属两个命名空间；两者互不干扰，且都不需要人工补 tag。
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # ── Step 0：fail-fast 前置闸（E-35）──────────────────────────────
      # 旧形态用 `secrets.RELEASE_PLEASE_TOKEN || github.token` 回落：未配 secret
      # 时 Release PR/Release 照建，但 tag 不级联 release.yml（npm/PyPI 发布）
      # 且无任何工作流级报错——发布链路静默断开（v1.1.1 已实爆）。发布链的缺省
      # 必须是显式失败，不是静默降级。这里在调用 action 前先判定 secret 存在性。
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN secret 未配置——release-please 用 github.token 生成的 tag 不会级联触发 release.yml（GitHub 抑制 GITHUB_TOKEN 产生的事件），npm/PyPI 发布会静默不发生。"
            echo "::error::修复：在仓库 Settings → Secrets and variables → Actions 配置 RELEASE_PLEASE_TOKEN（PAT，需 contents:write + pull-requests:write），或改用人工 tag 兜底流程（见 docs/release-checklist.md「包发布」段）。"
            exit 1
          fi
          echo "RELEASE_PLEASE_TOKEN 已配置，继续。"
      # ── Step 1：release-pr（开/更新 Release PR）─────────────────────
      # NETOPT-4：SHA 钉死（v4 = 5c625bf）。本 action 持 RELEASE_PLEASE_TOKEN
      # （PAT contents:write + pull-requests:write），tag 漂移即权限面漂移；
      # 升级走 dependabot（github-actions 生态，weekly）受控 PR。
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-pr
        with:
          # token：**必须用 PAT**（仓库 secret `RELEASE_PLEASE_TOKEN`），否则
          # release-please 用 GITHUB_TOKEN 创建的 tag 不会级联触发 release.yml
          # ——GitHub 抑制所有由 GITHUB_TOKEN 产生的事件（含 on:push:tags）以防
          # 递归，本仓 2026-09-11 v1.1.1 实测：tag 已生成、release.yml 零 run。
          # E-35：不再回落 `github.token`（fail-unsafe）——缺失时由上方 Step 0
          # 显式失败；人工 tag 兜底流程见 docs/release-checklist.md「包发布」段。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          # 显式指向 manifest 文件（缺省同为 release-please-manifest.json，
          # 写明以减少隐式约定）
          manifest-file: release-please-manifest.json
      # **v1.3.0 发布轮实测结论（2026-09-13，修正 R19 的错误假设）**：
      # 曾尝试在此补 `command: github-release` 第二 step，实测被 action 拒绝
      # （v4 合法 inputs 不含 command——run 34755386601 的 warning 列出了全集），
      # 该方案无效；且状态机另有三层阻断：① v1.2.0 缺 GitHub Release 对象
      # （已补建，release-please 以 GitHub Releases 为「已发布」事实源）；
      # ② 非规范 merge 标题触发 conventional 解析错误吞掉 feat 遍历；
      # ③ 非 bot 形态（head 分支）的 Release PR 不被状态机接纳。
      # **当前发布形态：Release PR（人工/状态机）合并 + 人工 tag 兜底**，
      # 详见 docs/release-checklist.md「包发布」段与 docs/AGENT_HANDOFF.md v1.3.0 段。
