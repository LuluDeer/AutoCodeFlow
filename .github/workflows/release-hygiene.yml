# Release Hygiene 审计（每周自动 + 手动 dispatch）。
# 三条判据见 scripts/check-release-hygiene.md：Draft 遗留 / 同 tag 重复 /
# Latest 竞争（非 prerelease 的 v* 对象）。违规即红，处置速查同文档。
name: Release Hygiene Audit

on:
  schedule:
    - cron: '23 21 * * 1' # 每周二 05:23 UTC+8，错开整点拥堵
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      # T4：先跑 --selftest（离线、--fixture 灌入 Release 数组，不碰网络），再跑真审计。
      # 反证「0 个对象 = 0 处违规 = OK / 响应形状变了静默跳过 / draft 超龄边界 /
      # desktop-v* 例外被误红」等 12 条用例，见 scripts/check-release-hygiene.mjs --selftest。
      - name: Audit releases (drafts / tag duplicates / latest competition)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/check-release-hygiene.mjs --selftest
          node scripts/check-release-hygiene.mjs
