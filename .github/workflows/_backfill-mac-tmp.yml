name: Backfill macOS Installer (temporary)

# 一次性补传：v1.4.0 的 mac dmg 因 mapfile/BSD bug 失败，此 workflow 手动构建
# mac dmg 并上传到 v1.4.0 Release assets。用完即删（见 release.yml 的
# DESKTOP-PUBLISH-01 真发布逻辑已永久修复，此文件仅临时追补产物）。

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/executor-desktop/package-lock.json
            apps/executor-node/package-lock.json

      - name: Install desktop deps
        working-directory: apps/executor-desktop
        run: npm ci

      - name: Install executor-node deps (ncc 类型检查前置)
        working-directory: apps/executor-node
        run: npm ci

      - name: Build macOS dmg
        working-directory: apps/executor-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --publish never

      - name: Verify bundle + dmg present
        shell: bash
        working-directory: apps/executor-desktop
        run: |
          set -euo pipefail
          test -f resources/executor-node/index.js
          test -f dist-electron/*.dmg

      - name: Upload dmg to v1.4.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          files: |
            apps/executor-desktop/dist-electron/*.dmg
            apps/executor-desktop/dist-electron/*.zip
            apps/executor-desktop/dist-electron/latest-mac.yml
          fail_on_unmatched_files: true