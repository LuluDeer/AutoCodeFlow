name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # W-28：windows-latest e2e 较重（PG 服务启动 + portable redis 下载 + 真实浏览器），
  # 不在每次 develop push 跑，仅 PR / 手动触发，避免拖慢主干与引入 windows 侧偶发。
  workflow_dispatch:
  # QA-08：每月 1 日 03:20 UTC 跑一次跨版本迁移演练（迁移链空库全量 + 二次幂等 +
  # 实体同步漂移检查 + revert 单步回滚）；主 jobs 由 `if: github.event_name != 'schedule'`
  # 旁路，仅迁移演练与冒烟套件运行。
  schedule:
    - cron: '20 3 1 * *'

# 同一分支的旧跑自动取消（group 含 ref，不同分支互不影响）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NETOPT-4：最小权限缺省——顶层只读兜底（其余 4 个 workflow 均已声明，此前
# ci.yml 漏配，默认拿到 write-all token）。个别 job 需要更多权限时在 job 级
# 单独声明（目前仅 secret-scan 需 security-events: write 上报 code scanning）。
permissions:
  contents: read

jobs:
  # ── BUG-20：ARM64 / multi-arch 镜像构建闸（只 build，不 push，不跑 e2e）────
  docker-multiarch-build:
    # R22 根治（2026-09-13）：QEMU 模拟 arm64 是本 job 反复卡死/45min 超时的
    # 根源（admin-api 依赖树最大，QEMU 下 npm ci 慢到像挂死，已发生 5+ 次）。
    # 改用 GitHub **原生 arm64 runner**（ubuntu-24.04-arm，public repo 免费）
    # 双 job 并行各构建单平台——无模拟层，每个 job ~2-4min，无 QEMU 偶发挂死。
    # 验证语义不变：双架构各自真实构建（本 job push:false，仅验证 Dockerfile
    # 双架构可构建，发布形态见 release/部署文档）。
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: admin-api
            context: apps/admin-api
          - name: executor-node
            context: apps/executor-node
          - name: executor-python
            context: apps/executor-python
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        platform:
          - linux/amd64
          - linux/arm64
        exclude:
          - runner: ubuntu-latest
            platform: linux/arm64
          - runner: ubuntu-24.04-arm
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7
      # 不用 setup-buildx-action（docker-container driver）：它要拉
      # moby/buildkit:buildx-stable-1 镜像，Docker Hub 偶发 connection reset
      # 会直接打红 CI（run 34761485353 实测）。单平台原生构建用 runner 自带
      # 的 docker driver 即可，buildkit 容器镜像拉取点彻底消失；代价是
      # type=gha 层缓存不可用——原生构建本来就快（~86s），冷构建可接受。
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: autocodeflow/${{ matrix.image.name }}:ci-${{ matrix.runner }}

  # ── Node.js services & packages ──────────────────────────
  # U-2（审计修复）：2961 例单 runner 串行已逼近 30min 上限。拆成三个职责：
  #   * admin-api-test       —— 单元测试 4 片并行（jest --shard 1/4..4/4）
  #   * admin-api-coverage   —— 全量覆盖率门（coverageThreshold 是**全局**口径，
  #                            分片下各片覆盖率必然部分，不能随片跑，否则必红；
  #                            NETOPT-1⑪: 仅 develop push 与 schedule 触发，
  #                            PR 只跑分片门，避免全量套件每 push 实跑 5 遍）
  #   * admin-api-e2e        —— 迁移链 + 三套 e2e（原属同一 job，串行消除
  #                            users_email_key 竞态）
  # 三者并行启动；总墙钟 = max(单片 ~8min, 覆盖率 ~20min, e2e ~5min)。
  admin-api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: autoflow
      DB_PASSWORD: test
      DB_DATABASE: autoflow_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-32chars-long-here
      JWT_REFRESH_SECRET: test-refresh-secret-32chars-long
      EXECUTOR_SECRET: test-executor-secret
      # e2e 依赖：UsersService.onModuleInit 仅当 INITIAL_ADMIN_PASSWORD 存在
      # 且 users 表为空时 seed 用户名 "admin"（loginAsAdmin 默认 admin/admin123）
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: admin123
      AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/admin-api/package-lock.json
      - run: npm ci
        working-directory: apps/admin-api
      - run: npm run typecheck
        working-directory: apps/admin-api
      - run: npm run lint
        working-directory: apps/admin-api
      # U-2：jest 按文件哈希分片，4 片并行。覆盖率门不在此（见 admin-api-coverage）。
      # U-3：--retryTimes=2（jest-circus）给偶发时序/资源抖动用例两次重试机会，
      # 重试后仍红才红（playwright e2e 已有 retries:1，单元侧此前无重试机制）。
      # ESM-1：@nestjs/common 等依赖已是 ESM-only（"type":"module"），jest 的
      # require(esm) 路径由 vm.SourceTextModule 门控，必须带 --experimental-vm-modules
      # 才置位（否则 39 个 suite 在 import 处直接 ERR_REQUIRE_ESM 全红）。
      # 原先此处裸调 `npx jest` 绕过了 package.json 脚本里已有的该 flag，故显式带上。
      - name: Unit tests (shard ${{ matrix.shard }}/4)
        run: npx --node-options=--experimental-vm-modules jest --shard=${{ matrix.shard }}/4 --retryTimes=2
        working-directory: apps/admin-api

  # 覆盖率门：全量跑一遍 + coverageThreshold（这是分片化之后唯一不变的全局口径）。
  # NETOPT-1⑪: 该 job 无分片无重试，是 CI 最长尾且唯一 flake 暴露点——每次 push
  # 全量套件已在 admin-api-test 实跑 4 遍（分片），coverage 再跑第 5 遍纯属重复。
  # 收窄触发：PR 只跑分片门；develop push 与 schedule（月度迁移演练）跑 coverage。
  admin-api-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/develop'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: autoflow
      DB_PASSWORD: test
      DB_DATABASE: autoflow_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-32chars-long-here
      JWT_REFRESH_SECRET: test-refresh-secret-32chars-long
      EXECUTOR_SECRET: test-executor-secret
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: admin123
      AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/admin-api/package-lock.json
      - run: npm ci
        working-directory: apps/admin-api
      # coverageThreshold 已按第七轮实测水位取地板（stmts 68 / branch 58 /
      # funcs 56 / lines 69），防倒退用；覆盖率抬升后应同步上调。
      - run: npm test -- --coverage
        working-directory: apps/admin-api

  # 迁移链 + e2e 保持单一串行 job（并行时 admin seed 存在 users_email_key 竞态）。
  admin-api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: autoflow
      DB_PASSWORD: test
      DB_DATABASE: autoflow_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-32chars-long-here
      JWT_REFRESH_SECRET: test-refresh-secret-32chars-long
      EXECUTOR_SECRET: test-executor-secret
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: admin123
      AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/admin-api/package-lock.json
      - run: npm ci
        working-directory: apps/admin-api
      # e2e 前置：全新库跑完整迁移链建表（NODE_ENV 非显式 production 时
      # migrationsRun=false，app 不自动跑迁移）
      - name: Apply migrations for e2e
        run: npm run migration:run
        working-directory: apps/admin-api
      # --runInBand：三个 e2e suite 各自 bootstrap 完整 AppModule，并行时
      # admin seed 存在 users_email_key 竞态；串行执行消除竞态。
      - name: E2E (auth / executors / tasks)
        run: npm run test:e2e -- --runInBand
        working-directory: apps/admin-api

  # ── 迁移链验证：空库全链 + 幂等二跑守卫 ────────────────────
  # 第五轮教训：全新 DB 迁移链曾断裂 3 处，迁移类改动必须有 CI 兜底。
  admin-api-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: autoflow
      DB_PASSWORD: test
      DB_DATABASE: autoflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/admin-api/package-lock.json
      - run: npm ci
        working-directory: apps/admin-api
      - name: Migration chain on empty DB (full chain, currently 25)
        run: npm run migration:run
        working-directory: apps/admin-api
      - name: Idempotency guard — second run must be a no-op
        working-directory: apps/admin-api
        run: |
          out=$(npm run migration:run 2>&1)
          echo "$out"
          echo "$out" | grep -q "No migrations are pending" \
            || { echo "::error::second migration:run was not a no-op"; exit 1; }
      - run: npm run typecheck
        working-directory: apps/admin-api
      # ── QA-08：跨版本迁移演练月度增强步（仅 schedule 触发时执行）──────
      # 在 PR/push 轮，上面三步已覆盖「空库全量 + 二次幂等」；月度轮追加：
      # ① 迁移链 ↔ 实体定义漂移检查（migration:generate 必须产出空迁移，
      #    否则说明实体与迁移链脱节——历史真机轮抓过迁移链断裂，此为防复发闸）；
      # ② 最新迁移单步 revert → 重跑（演练 down 路径可达，部署回滚依赖它）。
      # 两种形态共用本 job：schedule 触发时主套件已被 if 旁路，本 job 独跑。
      - name: QA-08 drill — entity/migration drift check (schedule only)
        if: github.event_name == 'schedule'
        working-directory: apps/admin-api
        # typeorm 原生 check 模式：实体与迁移链一致时 exit 0（"No changes in
        # database schema were found"），有漂移时 exit 1 并打印差异迁移。
        run: npm run migration:generate -- --check ./src/migrations/Qa08DriftCheck
      - name: QA-08 drill — revert latest then re-run (schedule only)
        if: github.event_name == 'schedule'
        working-directory: apps/admin-api
        run: |
          npm run migration:revert
          npm run migration:run
          echo "revert + re-run OK：down 路径可达"

  # ── 依赖安全审计：prod 依赖链 moderate 及以上红灯（SEC-06）────────
  # ① 门槛从 high 升到 moderate：moderate 已是可利用 DoS 级（如
  #    stream-json O(depth²) 事件循环阻塞），不应长期容忍；known 豁免走
  #    下方 AWK 豁免清单机制（命中即打印复查日期并通过，未命中仍红）。
  # ② 豁免机制（SEC-06）：当前唯一豁免 = admin-api 的
  #    minio→query-string→{decode-uri-component, stream-json} 链 4 处
  #    moderate——上游 minio 8.0.7（2026-02-27 最新）仍钉
  #    query-string ^7.1.3 / stream-json ^1.8.0，修复版需 minio 大版本
  #    变更（npm audit fix --force 会装 minio@7.1.3 降级，不可取）。
  #    ⏰ 复查日期 2026-10-01：届时若 minio 未发新版，评估 overrides
  #    强制 query-string@9 / stream-json@3（需本地回归 S3 日志链）。
  # ③ 矩阵补 executor-desktop（此前漏审——本轮侦察发现其
  #    electron-builder→ajv→fast-uri 链 1 high + xmldom 1 moderate，
  #    已以 non-breaking audit fix 清偿并入库）。
  # npm audit 仅需 lockfile 解析依赖树，无需 npm ci。
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/admin-api
          - apps/executor-node
          - apps/executor-desktop
          - packages/acf-cli
          - packages/mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      # npm registry 的 audit endpoint 偶发 503/瞬时不可用（非真实漏洞），
      # 退避重试三次；真实漏洞在重试后仍会稳定红灯。
      # 输出同时落 /tmp/audit.json（--json）供豁免清单比对。
      - name: npm audit (with retry)
        working-directory: ${{ matrix.project }}
        run: |
          status=0
          for attempt in 1 2 3; do
            if npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=moderate --json > /tmp/audit.json 2>/tmp/audit.err; then
              cat /tmp/audit.err >&2 || true
              exit 0
            fi
            status=$?
            cat /tmp/audit.err >&2 || true
            echo "audit attempt $attempt failed (exit $status), backing off..."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          # 重试后仍红 → 与豁免清单比对：全部命中已知豁免则放行并提示复查，
          # 任何未登记的新漏洞保持红灯（fail-closed）。
          # 豁免判定键 = advisory 的 GHSA 编号（模块名会随链路变化，
          # GHSA 是稳定身份）；新增豁免必须在下方注释登记模块链+原因+复查日期。
          #
          # ── 豁免清单（append-only，逐条注明链路/原因/复查日期）──
          # GHSA-vcc3-ghjq-m6fr  decode-uri-component ≤0.2.2 DoS
          #   链：admin-api minio@8.0.7→query-string@7.1.3→decode-uri-component@0.2.2
          #   原因：上游 minio 8.x 钉 query-string ^7，修复需其大版本变更
          #   复查：2026-10-01（届时评估 npm overrides 强升 query-string@9）
          # GHSA-528h-pc64-c93x  stream-json ≤3.4.0 O(depth²) DoS
          #   链：admin-api minio@8.0.7→stream-json@1.9.1
          #   原因：同上（minio 8.x 钉 stream-json ^1.8）
          #   复查：2026-10-01（同上）
          #
          echo "Still failing after retries — matching against exemption list (SEC-06)..."
          known='GHSA-vcc3-ghjq-m6fr
          GHSA-528h-pc64-c93x'
          # 提取 JSON 中所有 moderate 及以上 advisory 的 GHSA id（去重排序）
          found=$(node -e '
            const a = require("/tmp/audit.json");
            const vulns = a.vulnerabilities ? Object.values(a.vulnerabilities) : [];
            const ids = new Set();
            for (const v of vulns) {
              for (const via of v.via || []) {
                if (typeof via === "object" && via.url) {
                  const m = via.url.match(/GHSA-[A-Za-z0-9-]+/);
                  if (m) ids.add(m[0]);
                }
              }
            }
            console.log([...ids].sort().join("\n"));
          ')
          echo "Known exemptions:"; echo "$known" | sed 's/^ *//'
          echo "Found in this audit:"; echo "$found"
          unmatched=$(comm -23 <(echo "$found" | grep -v '^$' | sort) <(echo "$known" | sed 's/^ *//' | grep -v '^$' | sort))
          if [ -n "$unmatched" ]; then
            echo "::error::New vulnerability (moderate+) not on the exemption list — must fix or review explicitly:"
            echo "$unmatched"
            exit 1
          fi
          echo "::notice::All findings are known exemptions (SEC-06). Next review date: 2026-10-01."
          exit 0

  # ── Python 依赖漏洞审计（E-2，SEC-NEW）───────────────────────────
  # executor-python / registry-pypi 用 == 精确锁定（可复现），但此前 CI 无
  # 任何 Python 侧漏洞扫描（npm-audit 只覆盖 Node 包）。pip-audit 以锁定的
  # requirements.txt 为输入解析依赖树并比对 OSV 数据库；发现已知漏洞即红。
  # 不加 --no-deps：直接钉锁外的传递依赖（anyio/pydantic 等）同样在审计面内。
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        project: [apps/executor-python, apps/registry-pypi]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit locked dependency tree
        working-directory: ${{ matrix.project }}
        run: |
          pip-audit -r requirements.txt \
            || { echo "::error::${{ matrix.project }}: 依赖树存在已知漏洞（pip-audit）— 升级钉锁版本并同步 requirements.txt"; exit 1; }

  executor-node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/executor-node/package-lock.json
      - run: npm ci
        working-directory: apps/executor-node
      # E-41 残差（本轮实测发现）：executor-node 补了 .eslintrc.js 与根
      # `lint:node`，交接文档记为已收口——但**没有任何 CI job 调用它**，
      # 它的 lint 只在「有人记得本地跑 lint:all」时存在。后果已经真实发生：
      # `src/process-rlimits.spec.ts` 有一个 no-unused-vars 错误让
      # `npm run lint:node` 直接红，而 CI 全绿（同类漏网还有 admin-api 两个
      # spec 的 14 处 prettier 错误）。这里补上本 job 自己的 lint；「是否每个
      # 子项目都被某个 job 覆盖」由 scripts/check-lint-gates.mjs 常设守卫。
      - run: npm run lint
        working-directory: apps/executor-node
      # executor-node 无独立 typecheck 脚本，build 即 tsc 全量类型检查
      - run: npm run build
        working-directory: apps/executor-node
      # L-3（审计修复）：jest coverageThreshold 只在 --coverage 下生效，CI 必须
      # 显式传 --coverage 才让覆盖率门真正跑起来（package.json jest 配置已加
      # collectCoverageFrom + coverageThreshold，阈值为实测水位地板）。
      - run: npm test -- --coverage
        working-directory: apps/executor-node

  acf-cli-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/acf-cli/package-lock.json
      - run: npm ci
        working-directory: packages/acf-cli
      - run: npm run typecheck
        working-directory: packages/acf-cli
      # 构建必须先于测试：release-metadata.test.ts 的版本号守卫**执行构建产物**
      # （`node dist/index.js --version`）来比对 package.json——源码里写了什么
      # 不代表打出来的包是什么，而"包自称的版本号"恰恰是发布物最不该骗人的
      # 一个输出。该守卫在产物缺失时会显式失败而非静默跳过；故这里必须先 build，
      # 否则守卫在 CI 里等于不存在（同 admin-web 的 PERF-01 守卫约定）。
      - run: npm run build
        working-directory: packages/acf-cli
      - run: npm test
        working-directory: packages/acf-cli

  mcp-server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/mcp-server/package-lock.json
      - run: npm ci
        working-directory: packages/mcp-server
      - run: npm run typecheck
        working-directory: packages/mcp-server
      - run: npm test
        working-directory: packages/mcp-server

  autocodeflow-node-sdk-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/autocodeflow-node-sdk/package-lock.json
      - run: npm ci
        working-directory: packages/autocodeflow-node-sdk
      - run: npm test -- --coverage
        working-directory: packages/autocodeflow-node-sdk

  admin-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
        working-directory: apps/admin-web
      # 基线：0 errors / 5 warnings（warnings 不阻塞）
      - run: npm run lint
        working-directory: apps/admin-web
      # ── i18n 硬编码守卫 ────────────────────────────────────────────
      # 界面支持中/英切换，但新页面若把中文写死在 JSX 里，英文界面下就会
      # 中英混排——而 tsc/lint/vitest 都看不见这种回归（串本身合法、测试也
      # 多半只断言中文文案）。故单列一道源码级闸。
      # 走 TS AST 而非 grep：本仓中文注释占比极高，grep 口径把 TaskFormPage
      # 的 0 处真实硬编码数成 350 处，会直接误导迁移排期（详见
      # scripts/README-i18n-guard.md）。基线按「文件+串内容」计数比对，只拦
      # 新增项，故存量 105 处合法串（标签映射 fallback、内部不变量错误信息等）
      # 不会让这道闸一上来就红。放在 lint 之后、build 之前（快失败，零额外成本）。
      - run: npm run lint:i18n
        working-directory: apps/admin-web
      # ── 构建必须先于测试（PERF-01 的产物守卫依赖它）────────────────
      # PERF-01 的回归守卫（src/__tests__/monaco-first-paint.perf01.test.ts）
      # 读的是 **dist/index.html**——只有真跑过 build 才有得读。该守卫在产物
      # 缺失时 skip 而非 fail（本地未构建不该阻塞单测），所以若 build 排在
      # test 之后，这个闸在 CI 里会**静默变成空转**：永远 skip、永远绿，
      # 而它要防的正是「monaco 被重新拉进首屏」这种只在产物里才看得见的回归
      # ——那类缺陷连 build 成功都拦不住（构建一直"成功"，只是产物错了）。
      # 故把 build 提到 test 之前；lint 仍在最前（最快失败）。
      - run: npm run build
        working-directory: apps/admin-web
        env:
          VITE_API_URL: http://localhost:3105
      # ── 覆盖度盲区补齐（本轮审计发现）──────────────────────────────
      # 此前本 job 只跑 lint + build：admin-web 的 **vitest 用例（现 900+）
      # 从未在 CI 里跑过**。而本仓前端的正确性纪律几乎全压在这些用例上
      # ——PATCH 显式 null 纪律、runtimeVersion 归一、代码来源互斥、
      # 亲和/反亲和清空、fixedRate 秒/分钟换算等都只有用例钉着，build
      # 全绿不代表它们仍然成立（tsc 查不出"清空控件却没发 null"这类
      # 语义回归）。后果是这些红线只在有人**本地手跑 vitest** 时才可能
      # 被发现有回归，属于"写了但没接上"的闸。
      # 与 lint/build 同 job 顺序执行（同一份 npm ci 产物，不额外付费）。
      # L-1（测试体系审计）：vitest 覆盖率此前从不收集/门控；vite.config.ts
      # test.coverage 已配置（v8 provider + 实测水位阈值），CI 显式 --coverage
      # 让覆盖率门真正生效。O-2 配套：重型用例逐个放宽见 test 文件内注释。
      - run: npm test -- --coverage
        working-directory: apps/admin-web

  # ── lockfile 完整性校验（SEC-06 ②）────────────────────────────
  # 各包独立 lockfile 的多包仓（无 workspace 统一锁）最易出的漂移是：
  # 改了 package.json 忘了同步 lockfile——npm install 时 lock 会被静默
  # 重写（依赖树与审计面从此与提交记录脱钩）。npm ci 天然拒绝这种漂移
  # （本地实测：package.json 引入 lock 外依赖版本时 dry-run 即失败），
  # 但主测试 job 们可能因缓存/局部路径绕过感知。此处集中对所有 npm 包
  # 一次性 dry-run 守卫：零安装产物、秒级、任何 lock↔manifest 失配即红。
  lockfile-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/admin-api
          - apps/admin-web
          - apps/executor-node
          - apps/executor-desktop
          - packages/acf-cli
          - packages/mcp-server
          - packages/autocodeflow-node-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
        # 不配 npm 缓存——dry-run 不写 node_modules，缓存无收益
      - name: Verify lockfile matches package.json (npm ci --dry-run)
        working-directory: ${{ matrix.project }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::${{ matrix.project }}/package-lock.json missing — every npm package must commit its lockfile"
            exit 1
          fi
          # --ignore-scripts：dry-run 校验的是 lock↔manifest 一致性，不装
          # 依赖也就没有 .bin 可执行文件——executor-desktop 的 postinstall
          # （electron-builder install-app-deps）在裸 runner 上必挂，误报
          # 「lockfile 漂移」（2026-09-08 CI 实证）。
          npm ci --dry-run --ignore-scripts --silent \
            || { echo "::error::${{ matrix.project }}: package.json 与 package-lock.json 漂移 — 运行 npm install 同步后提交两文件"; exit 1; }

  # ── Secret 泄漏扫描（SEC-06 ③）────────────────────────────────
  # 双保险的 CI 侧：pre-commit gitleaks hook 拦本地提交，本 job 拦直推
  # 与历史面（gitleaks-action 自动扫描全量 commit 历史并上报 code scanning）。
  # 配置 = 仓库根 .gitleaks.toml（默认规则集 + 测试样例 allowlist）。
  # 全量历史扫描放 PR/push：增量面由 --pre-commit 风格的 hook 保证，
  # 历史一次性红可接受（若有红即真实历史泄漏，应当处理而非静默）。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NETOPT-4：job 级提权——gitleaks-action 需上报 code scanning alerts，
    # 顶层只读兜底下本 job 单独声明（全文件唯一非 contents:read 的 job）。
    permissions:
      contents: read
      security-events: write
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks 需要完整历史才能扫全部 commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ARCH-29：迁移时间戳唯一性 + 认领板分配表注册校验（撞号/漏登拦截）
  check-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Migration allocation check
        run: |
          node scripts/check-migrations.mjs
          node scripts/check-migrations.selftest.mjs
      # PK-26（A8）：TS 枚举 ⊆ PG 枚举 静态守卫——防 scheduler 写路径枚举漂移
      # （N2 教训第三次重演兜底）。零依赖 node 脚本，秒级。
      - name: Enum drift guard (PK-26/A8)
        run: |
          node scripts/check-enum-drift.mjs --selftest
          node scripts/check-enum-drift.mjs
      # NETOPT-3（第二轮深潜）：实体显式命名 @Index ⊆ 迁移 DDL 静态守卫——
      # task_executions 两个声明索引从未落进迁移的 PK-10 同型漂移兜底。
      - name: Index drift guard (NETOPT-3)
        run: |
          node scripts/check-index-drift.mjs --selftest
          node scripts/check-index-drift.mjs
      # python_task_multiversion（FR-08/D15）：failureReason 的**四方**清单对齐守卫。
      # 同一枚举同时存在于 protocol.json（事实源）、admin TS 枚举、autoflow-sdk
      # 的 Python 校验集、executor-node 可上报集。任何一处漏改都是**静默**故障：
      # 最严重的是 admin 回调 DTO 的 @IsIn——执行器上报未登记值会让整批回调 400
      # 被拒（不是单条失败），任务永远停在运行中。零依赖，秒级。
      - name: Failure-reason enum alignment guard (FR-08/D15)
        run: |
          node scripts/check-failure-reasons.mjs
      # 发布配置一致性守卫（改名发布 @autocodeflow/cli 时新增）。
      # 本仓发版链路跨四份互不校验的配置：release-please-config.json 的
      # packages / linked-versions，与 release.yml 的 version-guard /
      # publish-npm 矩阵。任一处漏配都不报错，只会让某个包**静默地**永远发不
      # 出去或永远不 bump 版本。真实缺陷：packages/acf-cli 早在 a4dad9b 就进了
      # release-please 的 packages，却漏了 linked-versions，于是被管理却永远
      # 卡在 1.0.0；同时因包名被 npm 第三方占用而从未发布，仓库里没有任何东西
      # 会为此报警。零依赖，秒级。
      - name: Release config consistency guard
        run: |
          node scripts/check-release-config.mjs --selftest
          node scripts/check-release-config.mjs
      # E-38（DEEP_REVIEW 0ef3bbe）：install.sh 单一事实源守卫——content.ts 由
      # scripts/install.sh 构建期生成。这里重跑生成器后用 git diff --exit-code 校验
      # 已提交产物与源同步：只改了 install.sh 忘了重生 content.ts（或反之）即红。
      - name: install.sh <-> install-script.content.ts sync guard (E-38)
        run: |
          node scripts/gen-install-script-content.mjs
          git diff --exit-code -- apps/admin-api/src/modules/executor/install-script.content.ts
      # E-41 残差：lint 入口「存在」不等于「在门禁里跑」。判据 = 每个定义了
      # lint script 的 TS 子项目都必须被某个 CI job 覆盖（目录级 lint step，
      # 或根级 npm run lint:all），且根 lint:all 必须串联到它们。零依赖脚本，
      # 秒级；新增子项目忘记接门禁即红。
      - name: Lint gate coverage guard (E-41)
        run: |
          node scripts/check-lint-gates.mjs --selftest
          node scripts/check-lint-gates.mjs
      # shell「变量名吞掉多字节字符」守卫（desktop-v1.6.0 补发实证）。
      # 裸 `$count` 紧跟全角「（」时，macOS runner 的 /bin/bash 3.2 在非 UTF-8
      # locale 下会把 0xEF 并进变量名 → set -u 下 `count�: unbound variable`
      # 直接中止 step。真实后果：macOS 安装包**已经上传成功**（6 个资产全在），
      # 却因为这条 echo 死在最后一步，把「发布成功」渲染成 job 红——假红会诱导
      # 人去重跑或改发布流程，而真正该做的是加花括号。ubuntu（bash 5.x + UTF-8
      # locale）完全正常，故只在 macOS 单点复现，最易被当成环境抖动糊过去。
      # 零依赖，秒级；含反证自测。
      - name: Shell multibyte variable-name guard
        run: |
          node scripts/check-shell-multibyte-var.mjs --selftest
          node scripts/check-shell-multibyte-var.mjs

  # ── A4（DEEP_REVIEW §七）：消费方路由面快照守卫（零依赖 node 脚本）──────
  # mcp-server 与 acf-cli 各自硬编码 70+ 条 admin-api 路由字符串，与 openapi
  # 之间没有任何编译期耦合（它们不用生成的 api-types）。admin-api 改路由在
  # admin-web 侧会红（api-types-drift 闸），在 mcp/CLI 侧却完全静默——只有
  # 用户真调用那个工具/子命令时才 404，且 404 会被信封拆包层吞成空错误体。
  # 本闸把「用到的每条路由都必须存在于 openapi.json」变成 CI 判据。
  # openapi.json 是已提交产物，故无需 npm ci / PG / Redis。
  consumer-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Consumer route snapshot guard (A4)
        run: |
          node scripts/check-consumer-routes.mjs --selftest
          node scripts/check-consumer-routes.mjs

  # ── A3：executor-protocol 的 zod / pydantic 双生成产物漂移闸 ──────────
  # packages/executor-protocol/protocol.json 的 schemas 段是单一事实源，两侧
  # 生成物随源码同 commit（与 ADR-005 bundle 产物同款纪律）。本 job 重跑生成器
  # 并 git diff 兜底：改了 protocol.json 却没重跑生成 → 红。
  executor-protocol-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate zod + pydantic from protocol.json
        run: npm run gen:protocol
      - name: Fail on generated-artifact drift
        run: git diff --exit-code -- apps/executor-node/src/generated apps/executor-python/generated

  # ── BUG-18：私服 npm/PyPI 契约闸（零依赖 node 脚本，无需 npm ci）──────
  # live 模式（临时 PyPI uvicorn + 一次性 Verdaccio 容器）需 docker 与镜像，
  # 只在本地/真机轮跑；CI 跑 --dry-run 的源码契约断言，防私服链路回归。
  private-registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Private registry contract checks
        run: node scripts/bug18-private-registry-selftest.mjs --dry-run

  # ── E-13：行为自检脚本进 CI（此前 10 个自检脚本只靠本地手跑）──────
  # HA compose（docker-compose.ha.yml）、ARCH-31 多实例/outbox、pull 派发、
  # 回调分层（QA-05）、OIDC SSO、nginx SSE、npm registry 配置——这些行为
  # 保证此前从未在任何 workflow 中运行。脚本自带环境分级：runner 有 docker
  # 时真跑全链（admin-api/executor-node 由脚本内部 npx tsc 自建、PG 用脚本
  # 自拉容器），无 docker/psql 时显式 skip 退出 0（不虚报）。
  # 依赖注记：arch31-outbox 自检从 apps/admin-api require('pg')，docker 路径
  # 会自建 admin-api/executor-node——故先装两处依赖。
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/admin-api/package-lock.json
            apps/executor-node/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/admin-api
      - run: npm ci --no-audit --no-fund
        working-directory: apps/executor-node
      # 串跑（任一失败即红）：脚本名与根 package.json scripts 一一对应
      - name: Behavior selftests (serial)
        run: |
          npm run test:arch31-multi-instance
          npm run test:arch31-outbox
          npm run test:arch31-outbox-dup
          npm run test:arch31-rollout
          npm run test:pull-dispatch
          npm run test:qa05-callback-tier
          npm run test:oidc-sso
          npm run test:nginx-sse
          npm run test:ha-compose
          npm run test:registry-npm

  # ── Python services & packages ────────────────────────────
  executor-python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/executor-python/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov httpx pytest-asyncio pytest-xdist pytest-rerunfailures
        working-directory: apps/executor-python
      # U-2/U-3（审计修复）：并行 + 时序敏感用例重试——`-n 2 --dist=loadscope`
      # 按测试文件分片（模块级状态重的套件不跨文件混跑）；`--reruns=2
      # --reruns-delay=1` 给 F-2/F-3/F-4 类宽窗时序用例两次重试机会，避免
      # 高负载 runner 的偶发调度抖动直接红 PR（重试后仍红才红）。
      - run: python -m pytest --tb=short -n 2 --dist=loadscope --reruns=2 --reruns-delay=1
        working-directory: apps/executor-python

  # U-1（审计修复）：CI 矩阵此前只有 ubuntu-latest / ubuntu-24.04-arm /
  # windows-latest，没有 macOS。`interpreters._current_platform_token()` 在
  # macOS 上返回 macos-<arch>-none，平台过滤逻辑从未在 macOS 被验证；
  # test_zip_safety.py 的符号链接测试在 macOS 上权限语义与 Linux 不同。
  # 全量 585 例在 ubuntu 已覆盖，这里跑平台敏感面（解释器探测 + zip 安全
  # + zip 通道 + 版本化 venv），避免重复花费昂贵的 macOS runner 分钟。
  executor-python-test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/executor-python/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov httpx pytest-asyncio
        working-directory: apps/executor-python
      # 平台敏感面跑子集（非全量）→ 显式 --no-cov 关闭 pytest.ini 的
      # --cov-fail-under=85 全量闸门（子集覆盖率必然 <85%，不关必红）；
      # 全量覆盖率门由 ubuntu 的 executor-python-test 承担。
      - run: python -m pytest tests/test_interpreters.py tests/test_zip_safety.py tests/test_zip_channel.py tests/test_venv_versioning.py --tb=short --no-cov
        working-directory: apps/executor-python

  autoflow-sdk-python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/autoflow-sdk/pyproject.toml
      - run: pip install -e '.[dev]'
        working-directory: packages/autoflow-sdk
      - run: python -m pytest --tb=short
        working-directory: packages/autoflow-sdk

  python-packages-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        package: [autocodeflow-http, autocodeflow-notify, autocodeflow-db, autocodeflow-ai]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-asyncio httpx respx
      # PK-04/E-14：安装失败必须红——此前 continue-on-error: true 会掩盖打包
      # 回归（pyproject 语法/依赖声明错误时测试步骤空跑仍绿）
      - run: pip install -e .
        working-directory: packages/${{ matrix.package }}
      - run: python -m pytest tests/ --tb=short
        working-directory: packages/${{ matrix.package }}

  registry-pypi-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/registry-pypi/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
        working-directory: apps/registry-pypi
      - run: python -m pytest tests/ --tb=short
        working-directory: apps/registry-pypi

  # ── W-18 / F-19 drift guard：executor-node 源码 ↔ desktop 内嵌 bundle 一致性 ──
  # F-19（DEEP_REVIEW 0ef3bbe）：resources/executor-node/index.js（约 2.1MB ncc 产物）
  # 已出库不再入库（.gitignore），仓库只跟踪期望哈希清单
  # apps/executor-desktop/executor-node-bundle.sha256。本 job 离线 ncc 重打一次，
  # 把重打产物的 sha256 与清单比对：一致说明源码与内嵌产物同步；不一致即红，提示
  # 在 apps/executor-desktop 跑 `npm run build:executor` 并回填清单（遵 ADR-005 同 commit）。
  # ncc 0.44 字节确定性已验证（禁网可跑、输出目录/OS 不影响产物），故跨 OS 可比对。
  # npm ci --ignore-scripts 跳过 electron 二进制下载，只取 @vercel/ncc。
  desktop-bundle-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/executor-desktop/package-lock.json
            apps/executor-node/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/executor-desktop
      - run: npm ci --ignore-scripts
        working-directory: apps/executor-node
      - name: Rebuild bundle (same command as scripts/bundle-executor.sh)
        working-directory: apps/executor-node
        run: |
          ../executor-desktop/node_modules/.bin/ncc build src/main.ts \
            -o ../executor-desktop/resources/executor-node --source-map --no-cache
      - name: Semantic drift guard — executor-node/src digest must match manifest (F-19 / ADR-005)
        # 本地即可复现的语义闸（与构建路径/ncc 版本无关），先跑——它红了就是真漂移，
        # 且失败信息直接给出回填命令，不必等下面的字节闸。
        run: |
          cd "$GITHUB_WORKSPACE"
          node scripts/check-desktop-bundle-drift.mjs --selftest
          node scripts/check-desktop-bundle-drift.mjs
      - name: Drift guard — rebuilt bundle sha256 must match committed manifest (F-19)
        run: |
          cd "$GITHUB_WORKSPACE"
          BUNDLE="apps/executor-desktop/resources/executor-node/index.js"
          MANIFEST="apps/executor-desktop/executor-node-bundle.sha256"
          ACTUAL="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          # 只取**末行**字节哈希：清单里还有 `source-digest:` 行（语义闸用），
          # 不能再用 grep -v '^#' | awk '{print $1}' —— 那会把两行拼成一个多行
          # 字符串，与 ACTUAL 永不相等，让本闸恒红。
          EXPECTED="$(grep -v '^#' "$MANIFEST" | grep -oE '^[0-9a-f]{64}' | tail -n1)"
          echo "actual=$ACTUAL expected=$EXPECTED"
          if [ -z "$EXPECTED" ]; then
            echo "::error::$MANIFEST 里取不到末行字节哈希（应形如 '<64位hex>  index.js'）"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::executor-node bundle drift — run 'npm run build:executor' in apps/executor-desktop and commit refreshed apps/executor-desktop/executor-node-bundle.sha256 (F-19 / ADR-005)."
            exit 1
          fi
          echo "::notice::bundle sha256 matches manifest — executor-node source ↔ desktop embedded bundle in sync."

  # ── Windows 兼容基线（R15-3.5 / windows-findings）──────────────
  # R13 全轮在 Windows 复跑并逐条平台化断言后固化的绿灯集合：
  # executor-node jest 158、acf-cli vitest 48、mcp-server vitest 61、
  # admin-web lint+build。只跑无需 PG/Redis 的单元/构建步骤（admin-api
  # 单测与 executor-python 依赖服务，仍由上方 ubuntu job 覆盖）。
  # 这些用例正是本轮修复的对象（POSIX 假设、taskkill 树杀、SIGBREAK、
  # glue .cmd、行尾守卫），此 job 防止兼容修复在后续迭代中回退。
  windows-node-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/executor-node
          - packages/acf-cli
          - packages/mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.project }}
      # executor-node 无独立 typecheck，build 即 tsc；acf-cli/mcp-server 有 typecheck。
      #
      # acf-cli 除 typecheck 外**还要 build**：release-metadata.test.ts 的版本号
      # 守卫会**执行构建产物**（`node dist/index.js --version`）比对 package.json
      # ——源码里写了什么不代表打出来的包是什么，而"包自称的版本号"恰恰是发布物
      # 最不该骗人的一个输出。该守卫在产物缺失时显式失败而非静默跳过，故这里必须
      # 先 build（同 job `acf-cli-test` 的约定；两处都要，漏一处就是本 job 红）。
      - name: Build / typecheck
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          if [ "${{ matrix.project }}" = "apps/executor-node" ]; then
            npm run build
          elif [ "${{ matrix.project }}" = "packages/acf-cli" ]; then
            npm run typecheck && npm run build
          else
            npm run typecheck
          fi
      - name: Unit tests (jest / vitest)
        working-directory: ${{ matrix.project }}
        run: npm test
      # BUG-07：detached/信号进程级深验（P-7 树杀 / P-9 windowsHide / P-10
      # SIGBREAK 优雅链）——真实进程树断言，非 win32 runner 上 skip 退 0；
      # 本 job（windows-latest）每次 push 自动真跑，替代 R14 一次性真机窗口。
      - name: BUG-07 detached/signal process-level selftest
        if: matrix.project == 'apps/executor-node'
        run: node scripts/bug07-windows-selftest.mjs

  windows-admin-web:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
        working-directory: apps/admin-web
      - run: npm run lint
        working-directory: apps/admin-web
      - run: npm run build
        working-directory: apps/admin-web
        env:
          VITE_API_URL: http://localhost:3105

  # ── 根级 43 例 Playwright e2e（全链真环境）──────────────────
  # admin-api(3105) + executor-node(8002 注册在线) + admin-web vite(5176)
  # + 空库迁移链，跑根级 e2e-full.spec.js（登录/任务向导/pinned 全链/RBAC/
  # 并发/中断/指标等 29 例 + 安全红线 14 例：SSRF 六出站点/RBAC 全端点/
  # DEP-04 审批第二人规则）。编排收敛在 scripts/e2e-full.sh（CI 与本地
  # 同一入口）；PG/Redis 由 services 提供后走 SKIP_DOCKER=1 分支复用。
  # 防抖要点（详见脚本头注）：每次全新库消除种子残留、登录/全局节流放大
  # 防级联 429（W-22 同根）、回调密钥两端显式同值、执行器注册 online 显式等待。
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoflow_test
        ports: ['15432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SKIP_DOCKER: '1'
      E2E_DB_PORT: '15432'
      E2E_REDIS_PORT: '16379'
      # 时间戳库名在 job 内唯一；显式指定便于失败后 service 容器取证
      E2E_DB_NAME: autoflow_e2e_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/admin-api/package-lock.json
            apps/admin-web/package-lock.json
            apps/executor-node/package-lock.json
      # E-18（DEEP_REVIEW 0ef3bbe）：executor-python 全链 e2e——CI 需 setup-python
      # + fastapi/uvicorn/httpx 依赖，否则 e2e-full.sh 的 python 启动分支走 skip。
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r apps/executor-python/requirements.txt
      - run: npm ci
        working-directory: apps/admin-api
      - run: npm ci
        working-directory: apps/executor-node
      - run: npm ci
        working-directory: apps/admin-web
      # runner 镜像自带的 google-chrome apt 源（dl.google.com）偶发 Hash Sum
      # mismatch，会让 --with-deps 的 apt-get update 整体失败（2026-09-10
      # 连续三轮实爆）。安装前禁用该源——playwright 系统依赖不含 chrome 本体。
      # 源文件在新镜像上是 deb822 格式的 google-chrome.sources（非 .list），
      # 通配删除两种命名。
      - name: Install chromium (+ system deps)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
        working-directory: apps/admin-web
      - name: Run 48-case full-chain e2e
        run: bash scripts/e2e-full.sh
      - name: Upload e2e logs & failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            /tmp/acf-e2e-logs*/
            /tmp/e2e-*.png
          if-no-files-found: ignore
          retention-days: 7

  # ── W-28：Windows 全栈 e2e（29 例）— PR / 手动触发 ──────────────
  # ubuntu e2e 全绿的盲区恰是 Windows：本轮 W-22/W-26 都是 Windows runner
  # 抓出 Linux 漏掉的 bug，但全栈 UI e2e 此前只在 ubuntu 跑。此 job 把同一份
  # 根级 29 例 spec 在 windows-latest 上跑通，复用 scripts/e2e-full.sh
  # （SKIP_DOCKER=1）——编排不重复，只是依赖服务改由 Windows 原生方式提供：
  #   · PG：runner 预装 postgresql-x64-* 服务（Stopped，postgres/root，见 image 文档），
  #     启动即可，E2E_WORK_DIR 指到 C:/tmp（win32 node 把 /tmp 解析到当前盘根）。
  #   · Redis：镜像不含 → 下载 redis-windows portable zip（无服务版，前台起进程）。
  # 门控 pull_request / workflow_dispatch：拖慢 + windows 服务/下载 flaky 面
  # 不进每次 develop push（拍板选项 A）。
  e2e-full-windows:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SKIP_DOCKER: '1'
      E2E_DB_HOST: localhost
      E2E_DB_PORT: '5432'          # 原生服务，非 docker 映射口
      E2E_DB_USER: postgres
      E2E_DB_PASS: root
      E2E_DB_NAME: autoflow_e2e_ci_win
      E2E_REDIS_HOST: localhost
      E2E_REDIS_PORT: '16379'       # 与脚本默认一致
      E2E_WORK_DIR: C:/tmp/acf-e2e-tasks
      # 注意：LOG_DIR 不指 C:/tmp——它只被 bash 侧（mktemp/curl/tail）读写，
      # 留在 MSYS /tmp 最稳（mktemp 对带盘符模板解析有坑）；node 需要的是
      # WORK_DIR=C:/tmp。失败时日志由脚本内联 tail，不依赖 artifact 采集。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/admin-api/package-lock.json
            apps/admin-web/package-lock.json
            apps/executor-node/package-lock.json
      - run: npm ci
        working-directory: apps/admin-api
      - run: npm ci
        working-directory: apps/executor-node
      - run: npm ci
        working-directory: apps/admin-web
      # L-5（审计修复）：ubuntu e2e 早在 E-18 就 setup-python + pip install
      # （见 e2e-full job 注释），Windows job 却从未装 Python 3.12 / 
      # executor-python 依赖——e2e-full.sh 的 python 启动分支在 Windows 上
      # 走 skip，Python 执行器全链在 Windows e2e 中完全未覆盖。现按脚本的
      # Windows 检测分支（apps/executor-python/.venv/Scripts/python.exe，见
      # e2e-full.sh 的 exec_python_launcher）显式建 venv 并装依赖，与 ubuntu
      # 侧依赖集合一致（requirements.txt）。
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare executor-python venv for e2e (L-5)
        shell: pwsh
        run: |
          python -m venv apps/executor-python/.venv
          apps/executor-python/.venv/Scripts/python.exe -m pip install -r apps/executor-python/requirements.txt
      - name: Install chromium
        run: npx playwright install chromium
        working-directory: apps/admin-web
      - name: Start preinstalled PostgreSQL + portable Redis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # (1) PG：镜像预装 postgresql-x64-* 服务（Stopped/Disabled），启之并等 5432
          $pg = Get-Service -Name 'postgresql-x64-*' | Select-Object -First 1
          if (-not $pg) { throw "PostgreSQL 服务未找到" }
          Set-Service -Name $pg.Name -StartupType Automatic
          Start-Service -Name $pg.Name
          # e2e-full.sh 的 SKIP_DOCKER 分支依赖 psql 客户端 + C:/tmp 存在。
          # PGBIN 理论上由镜像注入；缺失时从服务的二进制路径推导，双保险。
          $pgbin = $env:PGBIN
          if (-not $pgbin -or -not (Test-Path (Join-Path $pgbin 'psql.exe'))) {
            $svcPath = (Get-CimInstance Win32_Service -Filter "Name='$($pg.Name)'").PathName
            $pgbin = Split-Path ($svcPath -replace '^"','' -replace '"$','')
          }
          "$pgbin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path 'C:\tmp' | Out-Null
          # (2) Redis：portable cygwin 构建（无需服务/管理员），起前台进程 --daemonize no
          $rd = Join-Path $env:RUNNER_TEMP 'redis'
          New-Item -ItemType Directory -Force -Path $rd | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'redis.zip'
          # NETOPT-4：portable redis zip 此前零校验——被投毒/半写 zip 会直接进
          # e2e。下载后比对 SHA256（维护者 2026-09-19 对 8.10.1 官方 release
          # 资产实测；升级 redis 版本时必须同步更新此值），不一致即 fail。
          $zipSha256 = '5532f2cc38a0185556b648d25a0c2ff1cc58029f37fd76eceb38736976dcb056'
          Invoke-WebRequest `
            -Uri 'https://github.com/redis-windows/redis-windows/releases/download/8.10.1/Redis-8.10.1-Windows-x64-cygwin.zip' `
            -OutFile $zip
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actualSha256 -ne $zipSha256) {
            throw "redis zip checksum mismatch: expected $zipSha256, got $actualSha256"
          }
          Expand-Archive -Path $zip -DestinationPath $rd -Force
          $redisServer = (Get-ChildItem -Path $rd -Recurse -Filter 'redis-server.exe' | Select-Object -First 1).FullName
          Start-Process -FilePath $redisServer -ArgumentList '--port','16379','--save','' -WindowStyle Hidden
          # (3) 等两个端口就绪（PG 服务 Running != 端口可连）
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            $pgOk = (Test-NetConnection -ComputerName localhost -Port 5432 -WarningAction SilentlyContinue).TcpTestSucceeded
            $rdOk = (Test-NetConnection -ComputerName localhost -Port 16379 -WarningAction SilentlyContinue).TcpTestSucceeded
            if ($pgOk -and $rdOk) { Write-Host "PG+Redis 就绪"; break }
            Start-Sleep -Seconds 2
          }
          if (-not ($pgOk -and $rdOk)) { throw "PG/Redis 60s 内未就绪" }
      - name: Run 48-case full-chain e2e (Windows)
        shell: bash
        run: bash scripts/e2e-full.sh
      - name: Upload e2e logs & failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows-artifacts
          path: |
            C:/tmp/acf-e2e-tasks/
            test-results/
            apps/admin-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── DSK-02：Linux 桌面端打包闸（AppImage x64 + deb x64）──────────────
  # 只构建出包并上传 artifact，不发布（publish 由 tag 触发的 release.yml /
  # electron-builder publish 配置承接）。触发形态对齐 e2e-full-windows 等
  # 重型 job：仅 PR / workflow_dispatch（build:executor 会重打 ncc bundle
  # + electron 下载 + 三段构建，秒级 push 轮不值得每次付这个成本）。
  # PUBLISH_FOR_PULL_REQUEST 未设 → electron-builder 在 PR 构建里跳过
  # publish 步骤，无需 GH_TOKEN（electron-builder.yml publish 段只影响
  # 打包生成的 app-update.yml 与发布上传，不阻塞出包）。
  desktop-linux-bundle:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          # F4（本轮审计）：本 job 分别在 executor-desktop 与 executor-node 跑
          # npm ci，而本仓库不 hoist（ARCH-20，每个 app 自带 lockfile）——只列一个
          # lockfile 会让 executor-node 的安装永远无法命中缓存、且它单独变更时
          # 不会使缓存失效。与本文件既有写法（807/880/1148）保持一致。
          cache-dependency-path: |
            apps/executor-desktop/package-lock.json
            apps/executor-node/package-lock.json
      - run: npm ci
        working-directory: apps/executor-desktop
      # bundle-executor.sh 的 ncc 会对 executor-node 全项目（tsconfig include）
      # 类型检查——必须先装其依赖（axios/@types/jest 等），否则 373 错全灭
      # （desktop-linux-bundle 自 v1.3.0 起的「既有红」真实根因）。
      - run: npm ci
        working-directory: apps/executor-node
      - name: Main-process selftests (incl. updater)
        working-directory: apps/executor-desktop
        run: npm run test:main
      # ── 覆盖度盲区补齐（本轮审计发现）──────────────────────────────
      # `test:renderer`（设计令牌/无障碍/对比度/IPC 接线/安全姿态/渲染层
      # 数值解析守卫）此前**只在本机手跑**——CI 里 `test:main` 被三个桌面
      # job 反复调用，唯独 renderer 这一半没有任何 workflow 覆盖。它拦的
      # 正是本轮修掉的那些渲染层缺陷（number input 的 NaN、uv 诊断谎报），
      # 没有 CI 兜底等于修完还能悄悄回退。零额外依赖（纯 node 跑
      # renderer.selftest.mjs），与 test:main 同 job 顺序执行。
      - name: Renderer selftests (design tokens, a11y, IPC anchors, security posture)
        working-directory: apps/executor-desktop
        run: npm run test:renderer
      - name: Build AppImage + deb (x64)
        working-directory: apps/executor-desktop
        env:
          # electron 二进制官方源被墙/慢时的镜像兜底；runner 上通常无需生效
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        # 同 mac：CI 只产构件不发布（repository 字段触发的默认 publisher）
        run: npm run dist:linux -- --publish never
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-bundles
          path: |
            apps/executor-desktop/dist-electron/*.AppImage
            apps/executor-desktop/dist-electron/*.deb
            apps/executor-desktop/dist-electron/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  # ── uv 打包闸：发布包必须自带 uv（desktop-v1.5.1 实爆）────────────────────
  # 背景：客户端执行器的 Python 多版本能力依赖 uv，而安装包**默认不打 uv**
  # （ACF_BUNDLE_UV 默认 0）。release-desktop.yml 此前也没设该开关，导致正式
  # 安装包全部不含 uv：全新设备装完只上报 `runtimes: shell, node`，声明
  # runtimeVersion 的任务全部失败，用户侧仅一条 WARN。
  # 本 job 在每次 PR / 手动触发时实际跑一次"带 uv 的打包"，把三类回归一次性
  # 钉死：① 开关路径本身可用；② 各平台归档格式正确（Windows 官方包是 .zip，
  # 旧脚本一律按 .tar.gz 下载，**必然 404**）；③ 产物落点与
  # src/main/uv-paths.ts、executor-node/interpreters.ts 的解析约定一致。
  # 只跑 PR / 手动：需要联网下载 uv（约 20MB），不适合每次 push。
  desktop-uv-bundle-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/executor-desktop/package-lock.json
            apps/executor-node/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: apps/executor-desktop
      # bundle-executor.sh 的 ncc 会对 executor-node 全项目类型检查，需先装依赖
      - run: npm ci --ignore-scripts
        working-directory: apps/executor-node

      # 真实下载 uv 并强制要求成功（ACF_UV_REQUIRED=1 → 缺 uv 即失败）。
      # 这一步同时验证了 release-desktop.yml 所用的同一组环境变量。
      - name: Bundle uv (strict)
        shell: bash
        working-directory: apps/executor-desktop
        env:
          ACF_BUNDLE_UV: '1'
          ACF_UV_REQUIRED: '1'
          ACF_UV_VERSION: '0.8.17'
        run: bash scripts/bundle-executor.sh

      # 落点断言：必须正好是 <resources>/uv/<bin>，因为 uv-paths.resolveBundledUvPath
      # 与 interpreters.bundledUvCandidates 都按这个路径查（两处硬约定，写错
      # 就是"文件在但找不到"的静默降级）。
      - name: Assert uv landed at the exact path the runtime resolves
        shell: bash
        working-directory: apps/executor-desktop
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            windows-*) exe=uv.exe ;;
            *)         exe=uv ;;
          esac
          test -f "resources/uv/${exe}" \
            || { echo "::error::expected apps/executor-desktop/resources/uv/${exe} — 与 uv-paths.ts 的解析落点不一致"; exit 1; }
          echo "uv present at resources/uv/${exe}: $(wc -c < "resources/uv/${exe}") bytes"

      # 真正跑一次自带 uv，确认它在本平台**可执行**（不只是文件存在）。
      # Windows 上 chmod 无效，权限/损坏只有实跑才知道。
      - name: Smoke-run the bundled uv
        shell: bash
        working-directory: apps/executor-desktop
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            windows-*) exe=uv.exe ;;
            *)         exe=uv ;;
          esac
          "resources/uv/${exe}" --version

      # 反向断言：发布闸必须真的能拦住残包。删掉已打好的 uv 后，仅设
      # ACF_UV_REQUIRED=1（不设 ACF_BUNDLE_UV，模拟"发布流水线忘开开关"）
      # 必须失败——这正是 v1.5.1 出事的形状。防止未来有人把闸改成永远为真。
      - name: Strict gate must fail when uv is absent
        shell: bash
        working-directory: apps/executor-desktop
        run: |
          set -euo pipefail
          rm -rf resources/uv
          if ACF_UV_REQUIRED=1 bash scripts/bundle-executor.sh >/dev/null 2>&1; then
            echo "::error::ACF_UV_REQUIRED=1 且无 uv 时脚本竟然成功——发布闸失效，残包可被发布"
            exit 1
          fi
          echo "::notice::发布闸有效：无 uv + ACF_UV_REQUIRED=1 → 构建失败（残包拦得住）"

  # ── DSK-01：desktop macOS 打包（GitHub 托管 macos runner 即真机环境）──
  # electron-builder.yml mac 段（dmg x64+arm64 + icns）与 dist:mac script 已
  # 就绪，本 job 补「真实 macOS 打包执行 + 产物落 artifact」——此前缺的只是
  # 运行环境。无 Apple 开发者签名的公共验证形态：CSC_IDENTITY_AUTO_DISCOVERY
  # =false 跳过 codesign（正式分发签名属产品发布流程，另行拍板）；产物冒烟 =
  # electron-builder 打包成功即 dmg/zip 结构完整（builder 自身校验）。
  # 只跑 PR / 手动（与 desktop-linux-bundle 同姿态，GUI 无关、打包重）。
  desktop-macos-bundle:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          # F4（本轮审计）：本 job 分别在 executor-desktop 与 executor-node 跑
          # npm ci，而本仓库不 hoist（ARCH-20，每个 app 自带 lockfile）——只列一个
          # lockfile 会让 executor-node 的安装永远无法命中缓存、且它单独变更时
          # 不会使缓存失效。与本文件既有写法（807/880/1148）保持一致。
          cache-dependency-path: |
            apps/executor-desktop/package-lock.json
            apps/executor-node/package-lock.json
      - run: npm ci
        working-directory: apps/executor-desktop
      # 同 linux bundle：ncc 全项目类型检查需要 executor-node 依赖在位
      - run: npm ci
        working-directory: apps/executor-node
      - name: Main-process selftests
        working-directory: apps/executor-desktop
        run: npm run test:main
      - name: Build macOS dmg + zip (x64 + arm64)
        working-directory: apps/executor-desktop
        env:
          # 无 Apple Developer ID 的 CI 形态：显式跳过 codesign/notarize
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # CI 只产构件不发布：electron-builder 检测到 package.json repository
        # 会默认走 GitHub publisher（缺 GH_TOKEN 即炸）——显式 never。
        run: npm run dist:mac -- --publish never
      - name: Upload macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-bundles
          path: |
            apps/executor-desktop/dist-electron/*.dmg
            apps/executor-desktop/dist-electron/*.zip
            apps/executor-desktop/dist-electron/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  # ── QA-12：desktop Electron 冒烟（Playwright _electron，3 例）─────────
  # windows-latest：QA-12 的既定触发面即是 Windows（托盘/Linux 无托盘语义
  # 差异大，Linux 侧已由 desktop-linux-bundle 的 test:main + 本机冒烟覆盖）。
  # 只跑 PR / 手动：Electron GUI 启动在 runner 上有偶发显示层 flake，不进
  # 每次 develop push（desktop-linux-bundle 同姿态）。
  desktop-e2e-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          # F4（本轮审计）：本 job 分别在 executor-desktop 与 executor-node 跑
          # npm ci，而本仓库不 hoist（ARCH-20，每个 app 自带 lockfile）——只列一个
          # lockfile 会让 executor-node 的安装永远无法命中缓存、且它单独变更时
          # 不会使缓存失效。与本文件既有写法（807/880/1148）保持一致。
          cache-dependency-path: |
            apps/executor-desktop/package-lock.json
            apps/executor-node/package-lock.json
      - run: npm ci
        working-directory: apps/executor-desktop
      # build:executor 的 ncc 全项目类型检查需要 executor-node 依赖在位
      - run: npm ci
        working-directory: apps/executor-node
      - name: Build main + renderer + executor bundle
        working-directory: apps/executor-desktop
        run: npm run build
      - name: Playwright _electron smoke (QA-12, 4 cases incl 黑屏回归)
        working-directory: apps/executor-desktop
        env:
          # Windows runner 无 X/显示抽象，electron 需要软件渲染兜底
          ELECTRON_DISABLE_GPU: '1'
        run: npm run test:e2e

  # ── SDK 文档站构建验证（ECO-05）+ 源头文档同步校验（DOC-09）──────
  # ① DOC-09 sync-check：packages/docs-site 是仓库文档的镜像视图（版本号/
  #    截断常量/failureReason 枚举/CallbackItemDto 字段/env 注入表/能力矩阵/
  #    契约面七面机检），源头改了站点没同步时这里变红，人工按差异清单同步
  #    （不做自动覆盖——站点侧的导航/链接重组痕迹会被覆盖破坏）。
  # ② VitePress build：死链会 fail build（ignoreDeadLinks: false），build 绿
  #    即站点无死链、无白屏级错误。
  # 部署在独立 workflow docs-site-deploy.yml（仅 main push / 手动，P0-3），
  # 本 job 只做验证，所有分支形态都跑。
  docs-site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/docs-site/package-lock.json
      # 零依赖 node 脚本，无需 npm ci 即可运行；selftest 用 tmp 沙箱验证判据本身
      - name: Sync check (DOC-09)
        run: |
          node packages/docs-site/scripts/sync-check.mjs
          node packages/docs-site/scripts/sync-check.selftest.mjs
      - run: npm ci
        working-directory: packages/docs-site
      - run: npm run build
        working-directory: packages/docs-site

  # ── ARCH-23：API 契约 → 前端类型 drift 拦截 ─────────────────────
  # openapi.json（admin-api swagger:export 产物）与
  # admin-web/src/types/generated/api-types.ts（openapi-typescript 产物）
  # 都是「生成物入库」：改了 DTO/控制器装饰器而没重新导出+生成时，这里变红。
  # 生成链需要 DB+Redis（export e2e 走完整 AppModule bootstrap），故挂
  # service 容器，形态对齐 admin-api-test。
  api-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # QA-08：月度迁移演练轮旁路主套件（schedule 触发时仅跑迁移演练相关 job）
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: autoflow
      DB_PASSWORD: test
      DB_DATABASE: autoflow_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-32chars-long-here
      JWT_REFRESH_SECRET: test-refresh-secret-32chars-long
      EXECUTOR_SECRET: test-executor-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/admin-api/package-lock.json
            apps/admin-web/package-lock.json
      - run: npm ci
        working-directory: apps/admin-api
      - run: npm ci
        working-directory: apps/admin-web
      # ① 重新导出 openapi.json → 与库内版本 diff（契约面 drift）
      - name: Export OpenAPI and diff against committed openapi.json
        run: |
          npm run swagger:export
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json 与装饰器元数据漂移——改了 API 契约请重跑 npm run swagger:export 并提交产物"
            exit 1
          }
        working-directory: apps/admin-api
      # ② 重新生成前端类型 → 与库内版本 diff（生成面 drift）
      - name: Generate api-types and diff against committed api-types.ts
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/types/generated/api-types.ts || {
            echo "::error::api-types.ts 与 openapi.json 漂移——请重跑 npm run gen:api-types 并提交产物"
            exit 1
          }
        working-directory: apps/admin-web
      # ③ PK-15 部分：空 schema 盲区守卫——重生成永远确定性地复现空 schema
      # （"生成物↔生成物" diff 拦不住 DTO 漏装饰器），故对 components.schemas
      # 中 type:object 且 properties 为空的具名 schema 做白名单守卫：超出
      # scripts/openapi-empty-schema-whitelist.json 即红。
      # PK-02（空 schema DTO 补 @ApiProperty 装饰器）落地后清空白名单，
      # 守卫即升级为"零空 schema"。
      - name: Empty-schema guard against whitelist (PK-15)
        run: |
          node -e "const fs=require('fs');const doc=JSON.parse(fs.readFileSync('apps/admin-api/openapi.json','utf8'));const wl=JSON.parse(fs.readFileSync('scripts/openapi-empty-schema-whitelist.json','utf8')).whitelist;const empty=Object.entries(doc.components?.schemas??{}).filter(([n,s])=>s&&s.type==='object'&&s.properties&&Object.keys(s.properties).length===0&&!s.allOf&&!s.anyOf&&!s.oneOf).map(([n])=>n);const extra=empty.filter(n=>!wl.includes(n));if(extra.length){console.error('::error:: openapi.json 出现白名单外的空 object schema（PK-02 未落地前禁止新增）: '+extra.join(', ')+' —— 补 DTO @ApiProperty 装饰器，或（PK-02 落地后）清空 scripts/openapi-empty-schema-whitelist.json');process.exit(1);}console.log('empty-schema guard ok: '+empty.length+' empty / '+Object.keys(doc.components?.schemas??{}).length+' schemas, all whitelisted');"
