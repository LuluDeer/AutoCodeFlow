name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  admin-api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin-api/package-lock.json
      - run: npm ci
        working-directory: apps/admin-api
      - run: npm run typecheck
        working-directory: apps/admin-api
      - run: npm run lint
        working-directory: apps/admin-api
      - run: npm test -- --coverage
        working-directory: apps/admin-api

  executor-python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/executor-python/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/executor-python
      - run: pip install pytest pytest-cov httpx
        working-directory: apps/executor-python
      - run: pytest
        working-directory: apps/executor-python