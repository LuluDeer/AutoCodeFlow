# P0-3：SDK 文档站（packages/docs-site，VitePress）发布到 GitHub Pages。
#
# ── host 裁定（ADR 简记，全文见 packages/docs-site/README.md）──────────
# 三候选：GitHub Pages / admin-web /docs/ 独立容器 / 静态托管。裁定 Pages：
#   · 零服务器成本（admin-web 容器方案要占部署资源 + 挂反向代理路由）；
#   · CI 已有 docs-site-build job 验证构建（死链 fail build），产物可信；
#   · 仓库公开，Pages 无鉴权需求；文档站是纯静态 VitePress 产物。
# base 路径：项目页 = https://<owner>.github.io/AutoCodeFlow/ 子路径，
# .vitepress/config.mts 的 base: '/AutoCodeFlow/' 与之对齐（勿改两处之一）。
#
# ── 触发条件（与 ci.yml 的 push 面有意不同）────────────────────────────
# 仅 main push 或手动 workflow_dispatch 触发部署；develop push 不部署——
# 文档站非发布物，每次 develop push 都上 Pages 只会制造无意义噪音与
# 部署历史污染。PR/push 的构建与死链验证仍由 ci.yml 的 docs-site-build 承担，
# 本 workflow 不重复构建验证（部署前置信任 CI 绿）。
#
# ── 双 job 架构（消除同 job artifact 索引竞态）─────────────────────────
# 曾把 upload-pages-artifact 与 deploy-pages 串在同一 job 内：即使具备
# actions: read，finalize 后约 232ms 即调用 deploy-pages 仍会触发
# "Found 0 artifact(s)" 竞态失败（run 45043421818）。按 GitHub Pages 官方
# 架构拆分为 build（contents: read）与 deploy（needs: build + pages: write /
# id-token: write / actions: read），同时收紧构建期权限面。
#
# 前置一次性配置（仓库管理员）：Settings → Pages → Source 选
# 「GitHub Actions」（否则 deploy-pages 步骤会报 Pages not enabled）。
name: Deploy Docs Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 顶层默认只读兜底；deploy job 单独声明 Pages 部署所需最小权限
permissions:
  contents: read

# 同一分支部署并发组互斥，排队而非中途取消正在进行的 Pages 部署
concurrency:
  group: docs-site-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/docs-site/package-lock.json
      # drift 校验前置：站点内容与仓库源头文档（版本号/端点/契约面）漂移时
      # 拦截部署（DOC-09，判据与 ci.yml docs-site-build 共用同一脚本）
      - name: Docs site sync check (DOC-09)
        run: |
          node packages/docs-site/scripts/sync-check.mjs
          node packages/docs-site/scripts/sync-check.selftest.mjs
      - run: npm ci
        working-directory: packages/docs-site
      - run: npm run build
        working-directory: packages/docs-site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: packages/docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      # deploy-pages 查询本次 run 的 github-pages artifact metadata 需要 actions: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
