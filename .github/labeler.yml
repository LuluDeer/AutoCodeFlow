# 自动为 PR 添加标签的配置文件

# 文档相关
'documentation':
  - changed-files:
    - any-glob-to-any-file: ['docs/**/*', 'packages/docs-site/**/*', '*.md', '**/*.md', 'README*']

# CI/CD 相关
'ci/cd':
  - changed-files:
    - any-glob-to-any-file: ['.github/**/*', 'deploy.sh', 'Makefile']

# 前端相关
'frontend':
  - changed-files:
    - any-glob-to-any-file: ['apps/admin-web/**/*']

# 后端相关
'backend':
  - changed-files:
    - any-glob-to-any-file: ['apps/admin-api/**/*', 'apps/registry-npm/**/*', 'apps/registry-pypi/**/*']

# 执行器相关
'executor':
  - changed-files:
    - any-glob-to-any-file: ['apps/executor-*/**/*']

# SDK 相关
'sdk':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*-sdk/**/*'
      - 'packages/autoflow-sdk/**/*'
      - 'packages/autocodeflow-ai/**/*'
      - 'packages/autocodeflow-db/**/*'
      - 'packages/autocodeflow-http/**/*'
      - 'packages/autocodeflow-notify/**/*'

# CLI 相关
'cli':
  - changed-files:
    - any-glob-to-any-file: ['packages/acf-cli/**/*']

# MCP 相关
'mcp':
  - changed-files:
    - any-glob-to-any-file: ['packages/mcp-server/**/*']

# 依赖更新
'dependencies':
  - changed-files:
    - any-glob-to-any-file: ['**/package.json', '**/package-lock.json', '**/requirements.txt', '**/pyproject.toml']

# 测试相关
'testing':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.spec.ts'
      - '**/*.test.ts'
      - '**/*.spec.tsx'
      - '**/*.test.tsx'
      - '**/*.selftest.*'
      - '**/*-selftest.*'
      - '**/e2e/**/*'
      - '**/tests/**/*'
      - '**/test_*.py'
      - '**/*_test.py'

# 安全相关
'security':
  - changed-files:
    - any-glob-to-any-file: ['**/auth/**/*', '**/security/**/*', '.gitleaks.toml']

# 性能优化
'performance':
  - changed-files:
    - any-glob-to-any-file: ['**/cache/**/*', '**/optimization/**/*']

# 数据库相关
'database':
  - changed-files:
    - any-glob-to-any-file: ['**/migrations/**/*', '**/entities/**/*']

# Docker 与基础设施相关
'docker':
  - changed-files:
    - any-glob-to-any-file: ['**/Dockerfile*', 'docker-compose*.yml', '.dockerignore', 'infra/**/*']
