name: 功能需求
description: 提议新能力或现有能力的改进
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提需求前请先确认它不是**已规划**的内容：
        - 开发计划：https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/DEVELOPMENT-PLAN-2026-10.md
        - 任务认领板：https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/PLAN-CLAIMS.md
        - 架构决策记录：https://github.com/LuluDeer/AutoCodeFlow/tree/develop/docs/adr

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索现有 Issue 与 Discussions，确认这不是重复提议
          required: true
        - label: 我已确认该能力不在当前开发计划中
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述**问题**而不是直接给方案。当前你是怎么绕过它的？
      placeholder: |
        我们有 30 台执行器，每次发版都要逐台确认版本，
        目前只能一个个点进详情页看，没有任何汇总视图。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？如果有多种方案，列出来并说明取舍。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么现有能力或替代方案不够用？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及领域
      multiple: true
      options:
        - 调度与执行
        - 执行器管理
        - 应用与部署
        - 权限与安全
        - 可观测性与告警
        - AI / Agent / SOP
        - CLI / MCP / SDK
        - 桌面端体验
        - 部署与运维
        - 文档
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: 是否涉及破坏性变更
      description: 删字段 / 改语义 / 改状态码 / 收紧鉴权都算破坏性变更，需要同步四个客户端包。
      options:
        - 不涉及（纯新增）
        - 涉及（需要同批适配 CLI / MCP / 双 SDK）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、竞品做法、相关 Issue 编号等。
    validations:
      required: false
