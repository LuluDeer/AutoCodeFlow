name: Bug 报告
description: 报告可复现的功能缺陷或异常行为
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认这不是**已知问题**或**用法问题**：
        - 已知问题：https://github.com/LuluDeer/AutoCodeFlow/blob/develop/docs/atlas/08-workflows/troubleshooting/known-issues.md
        - 用法问题请走 [Discussions](https://github.com/LuluDeer/AutoCodeFlow/discussions)

        ⚠️ **安全漏洞请不要走这里**，见 [SECURITY.md](https://github.com/LuluDeer/AutoCodeFlow/blob/main/SECURITY.md)。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索现有 Issue，确认这不是重复报告
          required: true
        - label: 我已按文档排查过（快速上手 / 部署指南 / 故障排查）
          required: true
        - label: 我贴出的日志已脱敏（无 JWT / 令牌 / 口令 / 内网地址）
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 实际发生了什么？期望发生什么？
      placeholder: |
        实际：任务执行完成后，执行器状态仍显示「运行中」。
        期望：执行完成后 30s 内变为「空闲」。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量给最小可复现路径。涉及并发/时序的请注明。
      placeholder: |
        1. 用 admin 账号登录
        2. 创建 cron 任务 `* * * * *`，脚本 `console.log(1)`
        3. 等待执行完成后查看执行器详情页
        4. 状态卡在「运行中」
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 影响程度
      options:
        - 阻断（核心功能不可用 / 数据错误）
        - 严重（主要功能受损，有绕行方案）
        - 一般（体验或次要功能）
        - 轻微（文案 / 样式 / 边缘场景）
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      multiple: true
      options:
        - admin-api（后端）
        - admin-web（管理前端）
        - executor-node（Node 执行器）
        - executor-python（Python 执行器）
        - executor-desktop（桌面端）
        - registry-npm / registry-pypi（私有仓库）
        - acf-cli（命令行）
        - mcp-server（MCP 服务）
        - SDK（Node / Python）
        - 部署与基础设施（compose / 脚本 / nginx）
        - 文档
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署形态
      options:
        - Docker Compose
        - 源码模式（deploy.sh --mode source）
        - 本地开发（dev.sh / npm run dev）
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 平台版本（version.txt 或镜像 tag）+ 执行器版本
      placeholder: "平台 v1.12.0 · 执行器 1.9.1 · 桌面端 1.9.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: "Ubuntu 24.04 · Node 24 · PostgreSQL 16 · Redis 7 · Docker 26.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与报错
      description: 完整错误信息与相关堆栈（已脱敏）。请用代码块包裹。
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、相关配置（脱敏）、是否可稳定复现、首次出现的时间点等。
    validations:
      required: false
