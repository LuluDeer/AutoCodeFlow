[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow-sdk"
# 发布版本与 git tag（vX.Y.Z）及 @autocodeflow/sdk 保持 lockstep，
# 由 .github/workflows/release.yml 的版本一致性守卫强制校验。
version = "1.0.0"
description = "AutoFlow Python SDK — base utilities for task execution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["autoflow_sdk*"]
