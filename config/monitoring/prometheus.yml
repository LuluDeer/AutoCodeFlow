# Prometheus 配置（M-3，compose monitoring profile）
# 抓取：postgres_exporter(9187) / redis_exporter(9121) / admin-api 应用指标(/api/metrics)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis

  - job_name: 'admin-api'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['admin-api:3105']
        labels:
          service: admin-api
