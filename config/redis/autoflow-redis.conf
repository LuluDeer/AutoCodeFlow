# Redis 隔离配置 - 供 AutoCodeFlow 使用
# 使用端口 6380，与本机 Redis (6379) 隔离

# 绑定地址
bind 127.0.0.1

# 使用独立端口
port 6380

# 使用项目目录下的数据目录（避免权限问题）
dir /home/yongsheng/project/AutoCodeFlow/data/redis

# 独立的日志文件
logfile /home/yongsheng/project/AutoCodeFlow/data/redis/redis.log

# 进程文件
pidfile /home/yongsheng/project/AutoCodeFlow/data/redis/redis.pid

# 禁用保护模式（仅限本地访问）
protected-mode yes

# 设置密码（可选）
# requirepass autoflow-redis-password

# 内存限制
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化配置
save 900 1
save 300 10
save 60 10000

# 禁用 TCP 保活
tcp-keepalive 300