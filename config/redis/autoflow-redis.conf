# Redis 隔离配置 - 供 AutoCodeFlow 使用
# ⚠ 作用域（F-6 澄清）：本文件**仅供隔离本地开发**——由 scripts/start-isolated.sh
#   在项目根启动时解析（端口 6380，与本机 Redis 6379 隔离）。
#   容器部署（docker-compose.yml 的 redis 服务）**不消费本文件**，其内存上限与
#   鉴权在 compose 内联（--maxmemory 256mb + --requirepass ${REDIS_PASSWORD}），
#   两处参数保持同参，修改请同步。
# 使用端口 6380，与本机 Redis (6379) 隔离

# 绑定地址
bind 127.0.0.1

# 使用独立端口
port 6380

# 使用项目目录下的数据目录（避免权限问题）
# E-16（DEEP_REVIEW 0ef3bbe）：相对路径，由 scripts/start-isolated.sh 在项目根启动 redis 时解析
dir ./data/redis

# 独立的日志文件（相对项目根）
logfile ./data/redis/redis.log

# 进程文件（相对项目根）
pidfile ./data/redis/redis.pid

# 禁用保护模式（仅限本地访问）
protected-mode yes

# 设置密码（可选）
# requirepass autoflow-redis-password

# 内存限制
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化配置
save 900 1
save 300 10
save 60 10000

# 禁用 TCP 保活
tcp-keepalive 300