[pytest]
testpaths = tests
python_files = test_*.py
# O-1（审计修复）：去掉 -v——585 例 + parametrize 展开后每例一行，CI 日志截断
# 会把失败 traceback 冲出截断线；-q 只输出进度点 + 失败明细。需要详单时
# `pytest -v` 临时覆盖即可。
# L-2（审计修复）：启用 pytest-cov（依赖已装但从未配置）。基线：本轮实测
# 源码侧 92.6%（含 tests 全量 92.6%，见 .sessions 审计记录 cov-executor-python.json；
# sandbox.py 44.6% 为最低文件）。fail-under 取 85 作防倒退地板（93→85 留
# ~7.6pt 余量吸收模块增删噪声），覆盖率抬升后应同步上调。
#
# COV-DENOMINATOR（2026-10-27 审计轮 #7，实测取证）：此前 `--cov=.` 把
# **测试代码本身**算进分母，而 tests/ 比源码还多（测试 20648 行 vs 源码 13094 行），
# 于是 ".coverage 里 72 个被测文件有 45 个在 tests/"。这会让地板名不副实——
# 全量 15853 stmts/95% 对应的**源码侧实际水位只有 87.3%（5273 stmts）**，
# 85% 地板折算成源码侧约 59%，可放行 28pt 的源码退化（测试写得越多、覆盖率
# 数字越好看，与源码质量脱钩）。
# 修法：omit 只能配在 coverage 侧（pytest-cov **没有** --omit 开关，实测
# `unrecognized arguments: --omit=tests/*`）→ 新建 .coveragerc 的
# `[run] omit = tests/*`（tests/ 无子目录，单层 glob 足够）。分母只剩产品代码，
# 地板维持 85 即对源码真实 85%（当前实测 87.3%）。
# 反证：临时删掉 .coveragerc 的 omit → TOTAL 由 5273 → 15853 stmts，
# 同一份代码的"覆盖率"凭空 +7pt（94.52% ↔ 87.3%）。
# 地板：新口径（只算源码）实测 87.31%，取 86 作防倒退地板（余量 1.3pt，
# 吸收模块增删噪声）；旧口径 85 对应源码侧约 59%，已无意义。
addopts = -q --cov=. --cov-report=term-missing --cov-fail-under=86
# QA-11（strict warnings 裁定，2026-09-09）：
#   * `error` 全量 strict——自身代码的 datetime.now() 弃用点已修（auth.py 用
#     timezone-aware now）；三方库噪声逐条精确豁免（见下），不一刀切 ignore。
#   * ResourceWarning strict 化由 tests/conftest.py 的 autouse fixture
#     _close_asyncio_loops 支撑：pytest-asyncio 0.23.8 每用例的 event loop
#     靠 GC 回收，跨用例 __del__ 产生的 unraisable 会甩给无关用例（86bf0ef
#     同类问题）。fixture 在用例结束当场 close loop + gc.collect，把回收
#     责任关回创建它的用例。
#   * 唯一豁免（三方库，升级后应复核回收）：
#     - starlette.testclient：import 期发 StarletteDeprecationWarning
#       （"Using `httpx` with `starlette.testclient` is deprecated; install
#       `httpx2` instead"）——测试基建依赖，py 侧无代码可修，等生态落地。
#     - starlette.testclient 1.3.0 import 期还引用 anyio.abc.BlockingPortal，
#       anyio≥4.15 对该别名发 DeprecationWarning（CI Python 3.12 抓到，
#       local anyio 4.12 不发）——同属测试基建链，按消息精确豁免，
#       starlette/anyio 任一升级后应复核回收。
# pytest-asyncio ≥1.4.1：未显式设置 fixture loop scope 时会在 configure 阶段发
# PytestDeprecationWarning；本仓 `filterwarnings = error` 把它升级成 INTERNALERROR
# （CI 实测：pytest-asyncio 1.4.1 + pytest 9.2.0 → exit 3，用例一个都没跑）。
# 显式声明 function 作用域既消警告、也钉住未来默认值（1.x 通告的变更方向）。
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
