[pytest]
testpaths = tests
python_files = test_*.py
# O-1（审计修复）：去掉 -v——585 例 + parametrize 展开后每例一行，CI 日志截断
# 会把失败 traceback 冲出截断线；-q 只输出进度点 + 失败明细。需要详单时
# `pytest -v` 临时覆盖即可。
# L-2（审计修复）：启用 pytest-cov（依赖已装但从未配置）。基线：本轮实测
# 源码侧 92.6%（含 tests 全量 92.6%，见 .sessions 审计记录 cov-executor-python.json；
# sandbox.py 44.6% 为最低文件）。fail-under 取 85 作防倒退地板（93→85 留
# ~7.6pt 余量吸收模块增删噪声），覆盖率抬升后应同步上调。
addopts = -q --cov=. --cov-report=term-missing --cov-fail-under=85
# QA-11（strict warnings 裁定，2026-09-09）：
#   * `error` 全量 strict——自身代码的 datetime.now() 弃用点已修（auth.py 用
#     timezone-aware now）；三方库噪声逐条精确豁免（见下），不一刀切 ignore。
#   * ResourceWarning strict 化由 tests/conftest.py 的 autouse fixture
#     _close_asyncio_loops 支撑：pytest-asyncio 0.23.8 每用例的 event loop
#     靠 GC 回收，跨用例 __del__ 产生的 unraisable 会甩给无关用例（86bf0ef
#     同类问题）。fixture 在用例结束当场 close loop + gc.collect，把回收
#     责任关回创建它的用例。
#   * 唯一豁免（三方库，升级后应复核回收）：
#     - starlette.testclient：import 期发 StarletteDeprecationWarning
#       （"Using `httpx` with `starlette.testclient` is deprecated; install
#       `httpx2` instead"）——测试基建依赖，py 侧无代码可修，等生态落地。
#     - starlette.testclient 1.3.0 import 期还引用 anyio.abc.BlockingPortal，
#       anyio≥4.15 对该别名发 DeprecationWarning（CI Python 3.12 抓到，
#       local anyio 4.12 不发）——同属测试基建链，按消息精确豁免，
#       starlette/anyio 任一升级后应复核回收。
filterwarnings =
    error
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
