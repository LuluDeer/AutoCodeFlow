appId: com.autocodeflow.executor-desktop
productName: AutoCodeFlow Executor
copyright: "Copyright 2024 AutoCodeFlow"

directories:
  buildResources: assets
  output: dist-electron

files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - "!**/*.ts"
  - "!**/*.map"

extraResources:
  - from: resources/executor-node/
    to: executor-node/
    filter:
      - "**/*"
  # Python 多版本支持所需的 uv。**发布包必须非空**（release-desktop.yml 用
  # ACF_BUNDLE_UV=1 + ACF_UV_REQUIRED=1 产出；desktop-v1.5.1 曾因漏打 uv，
  # 导致全新设备只注册 runtimes: shell,node）。
  # 落点必须与 src/main/uv-paths.ts 及 executor-node/interpreters.ts 的解析
  # 约定一致：**打包态查 `<process.resourcesPath>/uv/<bin>`**。
  # 本地不开启 uv 打包时此目录为空，filter 匹配不到文件即静默跳过，不影响出包。
  - from: resources/uv/
    to: uv/
    filter:
      - "**/*"
  - from: assets/
    to: assets/
    filter:
      - "tray-*.png"

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: assets/icon.ico
  # 显式 artifactName（desktop-v1.5.0 实爆教训）：productName 含空格时，
  # electron-builder 对「磁盘产物名」与「latest.yml 更新清单里的 url」走两套
  # 净化规则（空格→点号 vs 空格→连字符），导致自动更新按清单拼出的下载 URL
  # 404。字面量连字符名让两侧天然一致；${version} 由 builder 填充。
  artifactName: AutoCodeFlow-Executor-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.utilities
  # 同 win：连字符字面量名，与 latest-mac.yml 的 url 对齐（见上方注释）。
  artifactName: AutoCodeFlow-Executor-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icon.png
  category: Utility
  # 同 win：连字符字面量名，与 latest-linux.yml 的 url 对齐。v26.15.3 本地
  # scheme.json 核实：LinuxConfiguration 顶层 artifactName 合法，非法的是
  # 嵌套 `AppImage:` 键（desktop-v1.5.1 首次 tag 实爆，三平台同校验全挂）。
  # deb 若需下划线名，用 deb.artifactName 单独覆写（DebOptions.artifactName）。
  artifactName: AutoCodeFlow-Executor-${version}.${ext}
  # DSK-02: maintainer/vendor 必填面——deb 的 control 字段缺省会回落 author，
  # 显式写死避免依赖 package.json author 形态。
  maintainer: AutoCodeFlow <dev@autocodeflow.io>
  vendor: AutoCodeFlow
  # DSK-02: .desktop 由 electron-builder 自动生成（Name=productName，
  # Exec=/opt/<name>/<executableName>，图标走 hicolor），desktop.entry 显式
  # 固定 StartupWMClass 便于窗口关联；可按需追加键值。
  desktop:
    entry:
      StartupWMClass: AutoCodeFlow Executor
  synopsis: AutoCodeFlow Executor Desktop Client
  description: Desktop executor client for AutoCodeFlow. Registers with an
    admin-api instance, runs ncc-bundled executor-node in-process, and reports
    heartbeat/status via system tray.

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
    - libgbm1
  # 上面 linux.artifactName 会作用于全部 linux 目标；deb 不参与自动更新
  # （DSK-03），保持历史下划线命名，显式覆写回来（DebOptions.artifactName）。
  artifactName: ${name}_${version}_${arch}.${ext}

# DSK-03: GitHub Releases 更新源。repo 与 git remote (LuluDeer/AutoCodeFlow)
# 对齐，electron-updater 检测 latest-linux.yml → AppImage 增量更新；deb 走
# 手动升级（见 docs/deployment.md「桌面端自动更新」段）。
# publish 行为（已核对 electron-builder 26 源码 PublishManager.js）：
#   本地 dist（无 GH_TOKEN 且非 git tag CI）：isPublish=false，仅生成
#   app-update.yml 资源文件，不上传不要求 token，构建照常出包；
#   CI push tag：publish 隐式 onTag → 产物随 release.yml 发布到 Releases。
publish:
  provider: github
  owner: LuluDeer
  repo: AutoCodeFlow

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: AutoCodeFlow Executor

dmg:
  window:
    width: 540
    height: 380
