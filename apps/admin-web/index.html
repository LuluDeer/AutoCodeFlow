<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- BRAND（2026-10-27）：此前用的 public/vite.svg 是 Vite 默认 logo，
         生产控制台的标签页/书签上显示的是构建工具的图标。改为自有标记。
         BRAND（2026-11-02）：中台形象换成狐狸（public/acf-fox.svg，
         内嵌位图，与 src/theme/tokens.ts 同色板）；六边形标志留在
         design-system/brand/svg/acf-mark.svg，仍是托盘与执行器状态的语汇。 -->
    <link rel="icon" type="image/svg+xml" href="/acf-fox.svg" />
    <!-- LHCI-LCP（2026-11-09）：把首屏 LCP 图片**放进初始文档**并提示高优先级。
         背景：Lighthouse 的 `lcp-discovery-insight`（"LCP request discovery"）与
         `prioritize-lcp-image` 两条审计在 SPA 上恒为 0 分 —— 因为它们要求
         **LCP 请求能从初始 HTML 被发现**，而本仓的 LCP 元素是 React 渲染的
         `<img src="/acf-fox.svg">`（登录页 96px / 侧边栏 32px），初始文档里没有它。
         这不是误报：客户端渲染确实推迟了 LCP 的发现时刻。
         在初始 HTML 里 preload 同一 URL 即可让请求提前开始（浏览器随后命中缓存复用），
         两条审计的判据因此被真正满足，而不是把断言关掉。
         `fetchpriority="high"` 对应 `lcp-discovery-insight` 的 `priorityHinted` 检查项。 -->
    <link
      rel="preload"
      as="image"
      href="/acf-fox.svg"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- LIGHTHOUSE-SEO（本轮）：此前无 meta description，Lighthouse SEO
         审计 meta-description 直接判 0 分并失败。管理台虽主要面向内网登录
         用户，缺失描述仍会让搜索结果页与被分享的链接退化成裸标题。 -->
    <meta
      name="description"
      content="AutoCodeFlow 管理与运维控制台：任务编排、执行器管理、执行记录与审计。"
    />
    <!-- 标题此前是裸产品名「AutoCodeFlow」，多标签/书签里与其他页面无法区分。
         带上岗位语义，同时保留可搜索的产品名。 -->
    <title>AutoCodeFlow 控制台 · 任务编排与执行器管理</title>
    <!-- UI-02：DOM 解析前注入 data-theme，防首帧闪白（FOUC）。
         F-30（DEEP_REVIEW 0ef3bbe）：脚本正文收敛为单一来源 src/theme/tokens.ts 的
         THEME_INIT_SCRIPT，由 vite.config.ts 的 themeInitPlugin 在构建/开发期注入本位置
         （原先此处的手写副本已删除，避免双事实源漂移）。键名与 src/theme/store.ts 一致。 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
