server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # S-08: security response headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src allows both same-origin and proxied API calls
    # connect-src: 'self' covers same-origin API proxy; add explicit external API domains via NGINX_CSP_EXTRA_ORIGINS env if needed
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # O-21（运行时预压缩）+ 网络性能审计（2026-09-18）：
    # - gzip_static on：构建期预压缩产物（dist 内 .gz，vite.config.ts 的
    #   precompress-assets 内联插件生成）存在时直接发送，零实时压缩 CPU。
    #   NETOPT-2③：曾同时生成 .br 并声称支持 brotli——部署镜像
    #   nginx:1.27-alpine 官方版无 ngx_brotli 模块，.br 无任何消费路径，
    #   已停生成（见 vite.config.ts 头注）。
    # - gzip on 作为无预压缩文件时的实时压缩兜底；gzip_vary 保证 CDN/浏览器
    #   协商缓存正确（同一资源按编码区分缓存）；
    # - application/json 覆盖 API 响应（任务/执行列表体积大）；image/svg+xml
    #   覆盖内联 SVG；gzip_min_length 1024 跳过过小资源（不划算）。
    # - SSE（text/event-stream）刻意不在 gzip_types 内——流式增量不压缩。
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm font/woff2;

    # SPA routing — all paths fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NETOPT-2⑤: index.html 禁缓存。hash 资产已 immutable 1y，而 index.html
    # 此前无 Cache-Control——浏览器按启发式缓存（≈Last-Modified 时长的 10%），
    # 发版后老用户可持旧 index.html 指向已删除的 chunk → 白屏。精确 location
    # 会命中 try_files 回退到 /index.html 的内部重定向，语义正确。
    # 继承陷阱：location 内一旦声明 add_header，server 级的 add_header **整体
    # 失效**（nginx 的 add_header 是「覆盖继承」而非叠加）——上方 S-08 的 6 条
    # 安全响应头必须在此逐条重复，否则 index.html 丢安全头。
    location = /index.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # connect-src allows both same-origin and proxied API calls
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to admin-api service
    location /api/ {
        # S1: proxy_pass WITHOUT a URI keeps the original /api prefix —
        # admin-api serves everything under its global prefix "api"
        # (main.ts setGlobalPrefix). A trailing slash would strip /api and
        # every proxied call would 404 (aligned with infra/nginx/default.conf).
        proxy_pass http://admin-api:3105;
        # S7/QA2: nginx defaults to 1m — executor packages up to 500MB, app
        # packages up to 200MB and the pypi proxy up to 50MB.
        client_max_body_size 510m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # R12-fix（与 infra/nginx/default.conf 同步）：通用 /api/ 位置承载
        # executions/stream 与 metrics/stream SSE 长流，60s read timeout 在
        # 极端负载下会误断合法流（应用侧 ping 兜底 15s/30s 正常，仅事件循环
        # 短暂饥饿时 60s 不够）。放宽到 300s，普通 API 有 Nest 30s 超时兜底。
        proxy_read_timeout 300s;
    }

    # QA3: dedicated SSE location for execution log streams. A regex location
    # takes priority over the /api/ prefix location, but only URLs shaped
    # /api/tasks/<id>/executions/<execId>/logs/stream land here (task.controller
    # @Get(":id/executions/:execId/logs/stream") + global prefix "api"); every
    # other /api/ request still hits the prefix block above and keeps its 510m
    # upload limit. Regex locations do NOT inherit directives from sibling
    # locations, so proxy_set_header / client_max_body_size are repeated here.
    location ~ ^/api/tasks/[^/]+/executions/[^/]+/logs/stream$ {
        proxy_pass http://admin-api:3105;
        # The SSE request is a body-less GET; repeating 510m only keeps this
        # location self-contained (otherwise nginx falls back to the 1m default).
        client_max_body_size 510m;
        proxy_http_version 1.1;
        # Empty Connection header keeps the upstream HTTP/1.1 connection
        # persistent — required for a long-lived SSE stream.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Log streams may stay silent far longer than the generic 60s. The app
        # also sends 15s ": ping" frames and sets X-Accel-Buffering: no, which
        # nginx respects by default (no proxy_ignore_headers is set here).
        proxy_read_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
    }

    # APP-002 收口（生产故障根因）：/uploads **不在 /api 前缀下**。
    #
    # admin-api 的 `app.use("/uploads", …)` 注册在 `setGlobalPrefix("api")`
    # **之前**（main.ts:199 vs 209），故真实路径是 `/uploads/packages/*.zip`。
    # 本文件此前只代理 `/api/`，该请求于是落进上方 SPA 回退
    # （`try_files $uri $uri/ /index.html`），回退成 **HTTP 200 + index.html**。
    # 执行器把 HTML 当 zip 落盘 → zip-guard 找不到 EOCD 签名 → 报
    # `Unsafe package rejected by zip-guard [unparseable]`：错误指向执行器，
    # 根因却在代理层，且 HTTP 200 让整条链路毫无线索。
    #
    # 为什么现在才暴露：API_BASE_URL 缺失时上传直接 500，走不到下载；
    # 接线后上传首次成功，下载路径才第一次被真正执行。
    #
    # 本块必须与 infra/nginx/default.conf 的对应块保持同步（deployment.md
    # 明文要求两份配置一致）；差异仅在上游形态：本文件用静态
    # `http://admin-api:3105`（单副本镜像内解析），default.conf 用 resolver
    # 变量形态以支持 --scale 多副本轮询。
    #
    # `^~` 前缀修饰符：命中后不再检查正则 location——下方静态资产正则含
    # js/css/png 等，否则 /uploads 下同名扩展名文件会被抢走并 404。
    # proxy_pass **不带 URI**：保留原 `/uploads` 前缀（与 /api/ 块同理，
    # 带尾斜杠会剥掉前缀导致 404）。
    # Authorization 头默认透传——/uploads 的鉴权中间件要求 JWT 或执行器
    # 共享 token，缺了它必然 401。
    location ^~ /uploads/ {
        # 应用包最大 200MB，下载可能远超默认 60s read timeout。
        proxy_read_timeout 300s;
        client_max_body_size 510m;
        proxy_pass http://admin-api:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # L-5（下载速率限流 P2）：执行器包下载单连接带宽上限（与
    # infra/nginx/default.conf 同步；本文件用静态上游，不引入变量/HA 形式）。
    # 用 limit_rate 而非 limit_req：包下载是单请求大 body（最大 500MB），
    # 按请求频率限流会误杀合法大包；limit_rate 限单连接吐字节速率，500MB≈50s。
    # 可调：内网改 20m/50m，窄带改 2m。正则 location 不继承兄弟 location，
    # proxy 头与 /api/ 前缀块一致地重复一遍（同 SSE location 的做法）。
    location ~ ^/api/executor-packages/[^/]+/download$ {
        proxy_pass http://admin-api:3105;
        client_max_body_size 510m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # L-5: 单连接下载速率上限（m=MB/s）。10m ≈ 80Mbps/连接。
        limit_rate 10m;
    }

    # Static asset caching
    # NETOPT-4：继承陷阱补口——本 location 内声明了 add_header（Cache-Control
    # immutable），server 级 S-08 的 6 条安全响应头在此**整体失效**（add_header
    # 是「覆盖继承」而非叠加），hash 资产会裸奔在无安全头的响应上。与
    # location = /index.html 同款逐条重复声明。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # connect-src allows both same-origin and proxied API calls
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Health check endpoint for docker healthcheck
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
