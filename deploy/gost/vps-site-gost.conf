# VPS nginx 站点配置 —— gost 版（与 deploy/frp/vps-site.conf 的唯一差别在 proxy_pass）
#
# 用法：宝塔 → 网站 → 配置文件，整份替换；或裸 nginx：
#   cp deploy/gost/vps-site-gost.conf /etc/nginx/conf.d/<ACF_DOMAIN>.conf
#   nginx -t && nginx -s reload
#
# ── 与 frp 版的差异 ────────────────────────────────────────────────
#   frp : proxy_pass http://127.0.0.1:40800;   # frps 的 vhostHTTPPort
#   gost: proxy_pass http://127.0.0.1:40801;   # gost relay 动态绑定的端点
#
# 其余参数逐条与 frp 版相同，理由不重复（见 deploy/frp/vps-site.conf 的逐项说明）：
#   client_max_body_size 510m   执行器包 500MB / 应用包 200MB / PyPI 50MB
#   proxy_buffering off         执行日志 SSE 必须逐帧下发
#   proxy_cache off             API 响应含鉴权头与执行状态，绝不能缓存
#   proxy_request_buffering off 大包边收边转
#   Connection ""               置空保持 upstream 长连接，SSE 与 25s 长轮询都依赖
#   ssl_early_data off          0-RTT 重放会让 POST 回调/触发/拉取重复执行
#   proxy_read_timeout 600s     长轮询 25s、SSE 每 15~30s 心跳
#
# 注意：不要给这个站点开 proxy_cache。

# ── upstream keepalive：**不是优化项，是必需项** ──────────────────────
# 2026-11-03 生产实测：不用 upstream keepalive 时，nginx 每次请求都新建
# 一条到 40801 的连接，而 gost 每条新连接 = 建一个 mux stream + 内网建连，
# 多付约 1 个 RTT。实测 P50 从 0.93s 退化到 1.40s（+50%）。
# 加上 keepalive 后 10 次请求产生 0 条新连接，P50 回到 0.93s —— 与 frp 持平。
#
# 对比背景：frp 时代无此问题，因为 frps 有 200 条预热 work conn 池，
# nginx 连上来时直接从池里取现成连接；gost 没有连接池，必须靠这里补。
#
# 注意 upstream 块必须写在 http 上下文中（站点配置文件的开头即可）。
upstream acf_gost_backend {
    server 127.0.0.1:40801;
    keepalive 32;          # 空闲长连接池大小；60 并发执行器场景 32 足够
    keepalive_timeout 65s;
}

server {
    listen 80;
    server_name <ACF_DOMAIN>;

    location ^~ /.well-known/ {
        root <WEB_ROOT>;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;

    server_name <ACF_DOMAIN>;

    # 宝塔路径形如 /www/server/panel/vhost/cert/<ACF_DOMAIN>/fullchain.pem
    ssl_certificate     <SSL_CERT_PATH>;
    ssl_certificate_key <SSL_KEY_PATH>;

    client_max_body_size 510m;

    location ^~ / {
        # ── 唯一改动点：frps 的 40800 → gost 的 40801 ──────────────
        proxy_pass http://127.0.0.1:40801;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        ssl_early_data off;
    }
}
