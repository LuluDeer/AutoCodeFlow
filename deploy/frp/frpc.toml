# frpc 配置 — AutoCodeFlow 跨网接入（本机 → 公网 VPS 上的 frps）
#
# 链路：执行器 → https://<ACF_DOMAIN> → VPS nginx :443
#        → 127.0.0.1:40800（frps vhostHTTPPort）
#        → frp 隧道 → 本机 frpc → admin-web:80（容器内，已代理 /api、/uploads、SSE）
#
# ── 为什么用 vhost（type = "http"）而不是 tcp + remotePort ─────────────
#   vhost 由 frps 按 HTTP Host 头路由，不需要 remotePort，不占 frps 端口资源，
#   与「nginx → 127.0.0.1:40800」这条反代链语义一致。
#   前置：VPS 的 frps.toml 必须开 vhostHTTPPort（本实例 40800）。
#
# ── 为什么 tcpMux = false ─────────────────────────────────────────
#   tcpMux=true 时所有 work connection 挤在一条 TCP 上走 yamux 多路复用，窗口
#   硬编码 6MB（client/connector.go 与 server/service.go 同值，不可配）。实测
#   60 执行器并发长轮询：tcpMux=true 12.24s / tcpMux=false 6.04s，而局域网直连
#   基线也是 6.04s —— 关掉后与直连零差异。
#   代价：每条 work connection 是真实 TCP，需确认 VPS 的 ulimit -n 足够。
#
# ── poolCount 与服务端 maxPoolCount ───────────────────────────────
#   frps 实际池容量 = min(本文件 poolCount, frps.toml maxPoolCount) + 10
#   （server/control.go NewControl：effectivePoolCount = min(LoginMsg.PoolCount,
#     ServerCfg.Transport.MaxPoolCount)，workConnCh 容量 = 该值 + 10）。
#   客户端设再大也被服务端钳制。本实例两边都取 200。
#
#   ⚠ 这个值**同时决定重试次数**：server/proxy/proxy.go GetWorkConnFromPool 的
#   循环条件是 `i < pxy.poolCount + 1`，而 pxy.poolCount 就是这里的值。
#   取 200 → 拿到失效连接时可重试 201 次、换到活连接；取 1 → 只试 2 次，
#   碰到僵尸连接很容易就直接 404。2026-11-02 曾误改成 0，复盘见下方池参数处。
#
#   ⚠⚠ **poolCount 写 0 是无效的**，会被静默改写成 1：
#     pkg/util/util/types.go 的 EmptyOr 用**零值判断**（`if zero == v`），
#     pkg/config/v1/client.go:153 `c.PoolCount = util.EmptyOr(c.PoolCount, 1)`
#     → 写 0 等于写 1，写 200 才真的生效 200。想最小化只能写 1。
#     （本文件当前值 200 非零，EmptyOr 原样保留，已实测生效：到 frps 的
#       ESTABLISHED = 201 条 = 1 control + 200 work conn。）
#
# 变量来自根 .env（compose 以 env_file 注入本容器），由 frp 的 Go template
# 在启动期展开。frp >= 0.52 只支持 TOML/YAML/JSON，旧版 INI 已移除。
serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
serverPort = {{ .Envs.FRP_SERVER_PORT }}

auth.method = "token"
auth.token = "{{ .Envs.FRP_TOKEN }}"

# 日志走容器 stdout，交给 docker logs / 宝塔日志采集
log.to = "console"
log.level = "info"

# ── loginFailExit = false：**最关键的一行** ────────────────────────
# frp 的默认值是 true：首次登录失败即**退出进程**，不重试
# （pkg/config/v1/client.go: LoginFailExit *bool, Complete() 默认 new(true)；
#   client/service.go: loopLoginUntilSuccess(…, lo.FromPtr(LoginFailExit))
#   在 firstLoginExit=true 时直接 svr.cancel()）。
#
# 后果（生产实证 2026-10-30）：frps 重启 → 客户端撞上那 1 秒窗口 → frpc 直接
# 退出 → **永远不回来**。VPS 侧日志显示 acf 客户端 12h 内出现过 6 个不同
# hostname（容器被反复重建），以及「客户端 09:13:23 掉线、09:21:46 才回来」
# 之间 8 分钟的整段 404——那段时间 frps 在正常应答，只是没有已注册的 acf-web
# 代理（frps 对未注册域名返回内置 "powered by frp" 404 页）。
# 同一机制还把另一台 Windows 客户端（音频克隆服务）在 17:14 那次 frps 重启后
# **永久打死**，至今 502。
#
# 设为 false 后：登录失败不再退出，而是按 backoff（1s→2s→…→20s 上限）持续重试，
# 服务端恢复后自动接上。这是本配置里唯一必须显式设置、不能依赖默认值的项。
loginFailExit = false

# 应用层心跳。注意 frp 的语义：tcpMux=true 时这两个默认被置为 -1（关闭），
# 只靠 yamux keepalive；tcpMux=false 时默认 30/90。这里显式写死，避免随
# tcpMux 开关漂移。
# 取 10/30（比默认 30/90 更敏感）：链路被 RST 时更快发现并重连。
# VPS 侧日志实测有 `read: connection reset by peer`（出口 NAT 侧重置），
# 默认 90s 的判定窗口偏长。
transport.heartbeatInterval = 10
transport.heartbeatTimeout = 30

# 关闭 yamux 多路复用。两个理由：
#   ① 性能：实测 60 执行器并发长轮询 tcpMux=true 12.24s / false 6.04s
#      （局域网直连基线 6.04s）；
#   ② 韧性：mux 模式下所有代理共享一条 TCP，断一次全带走；且应用层心跳被
#      默认关闭（见上），故障发现更慢。
transport.tcpMux = false
# ── dialServerKeepalive = 30：**真正止血的一行**（2026-11-03）──────────
# 这是「随机 404」的根因解，不是缓解项。链路（frpc 0.71.1 / frps 0.71.0 实证）：
#
#   ① tcpMux=false 时每条 work connection 是**独立 TCP**，平时完全空闲挂在 frps
#      的 workConnCh 里，而 frp 对 work connection **没有应用层心跳**
#      （confirm：client/control.go 的 heartbeatWorker 只挂在 control 连接上，
#        work conn 走 handleReqWorkConn → connectServer，没有任何 PING）→
#      池子哑掉时客户端日志一行都不会有，只能靠 frps 侧日志看见。
#   ② 于是「这条空闲 TCP 会不会被 NAT 回收」完全取决于 **TCP keepalive 探测够不够密**。
#      frp 的 dialServerKeepalive 上游默认 **7200 秒**
#      （pkg/config/v1/client.go ClientTransportConfig.Complete 里
#        c.DialServerKeepAlive = util.EmptyOr(..., 7200)），
#      而本机 `sysctl net.ipv4.tcp_keepalive_time` 实测也是 7200 —— 两者叠加，
#      意味着一条空闲连接要**静默 2 小时**才会发出第一个 keepalive 探针。
#      典型 NAT/防火墙的 TCP 空闲超时是 5~30 分钟 → 探针永远来不及发，
#      映射先被回收，连接变僵尸。这就是「每隔 2~4 小时烂一轮」的节律来源。
#   ③ frps 取连接只做一次 write(StartWorkConn) 探活（server/proxy/proxy.go
#      GetWorkConnFromPool → WorkConn.Start 只是 WriteMsg）。对刚被 RST、本端
#      尚未感知的僵尸连接，这次 write 会**成功** → 僵尸被当作好连接交给反代 →
#      真正收发时才炸，报 `read tcp ...: read: connection reset by peer`。
#   ④ pkg/util/vhost/http.go 的 ErrorHandler 对**任何非超时错误**一律
#      WriteHeader(404) + 写那 489 字节的 "powered by frp" 页。所以
#      `no route found`（路由真没了）与 `connection reset by peer`（路由在、
#      数据面死了）**吐出来是同一个页面**，从响应完全无法区分。
#      **别看到 404 就断定域名掉了**——区分只能看 frps 日志里 err 的文案。
#   ⑤ frpc 的 healthCheck 探的是本地 admin-web（恒 200），发现不了数据面已死；
#      frps 也无法通知客户端重建池子 → **永不自愈**，只能人工重启 frpc。
#
# 为什么是 30 秒：Go 的 net.Dialer.KeepAlive 会落成 TCP_KEEPIDLE/TCP_KEEPINTVL
# （libnet.WithKeepAlive → newTCPDialer{KeepAlive: op.keepAlive}），
# 30s 的探针远小于任何常见 NAT 空闲超时，足以把映射一直续上。
# 该值作用于 **frpc 到 frps 的全部连接**，含每一条 work connection：
#   handleReqWorkConn → ctl.connectServer() → Connector.Connect()
#   → libnet.WithKeepAlive(cfg.Transport.DialServerKeepAlive)（client/connector.go:241）
# 对照组：control 连接本来就有 heartbeatInterval=10s 在续命，所以它从不老化；
#         只有 work connection 没人管——这正是为什么「控制面永远健康、数据面在烂」。
transport.dialServerKeepalive = 30

# ── poolCount = 200：**撤销 2026-11-02 那次误改**（原值就是 200）────────
# 2026-11-02 曾把这里改成 0，理由是「池为空就不会有空闲连接被 NAT 回收」。
# 那个推断是错的，而且引入了**两个新的故障面**，必须撤销：
#
#   ✗ ① 重试被压到 2 次。GetWorkConnFromPool 的循环是 `i < pxy.poolCount+1`，
#        而 pxy.poolCount 来自 ctl.poolCount = min(客户端, 服务端)。
#        注意 **写 0 实际生效 1**（EmptyOr 零值判断，见上方说明），
#        所以 pxy.poolCount=1 → 只试 2 次。原来取到僵尸连接能一路试到活连接
#        （frps 日志里 times:0..198 就是这个），改小后碰到僵尸很快就直接 404
#        —— 反而**更频繁**报错。
#   ✗ ② 通道容量从 210 掉到 11（workConnCh = poolCount + 10）。突发并发时
#        RegisterWorkConn 走 default 分支（非阻塞 select，满了立即丢），
#        客户端刷出
#        `StartWorkConn contains error: work connection pool is full, discarding`
#        —— 该日志**全历史首次出现于 2026-11-02 07:47:15**（即本次改动生效后），
#        此前 3 天 0 次。这是改动引入的新错误，不是原有问题。
#        完整链路（子 agent 实证）：并发请求 → GetWorkConn 池空 → ReqWorkConn
#        → frps 注册时 channel 满 → StartWorkConn{Error:...} → frpc 打印该错误
#        → GetWorkConnFromPool 重试耗尽 → GetRealConn 返回 error
#        → vhost ErrorHandler → **489 字节 404**。所以 489 字节页与
#        "pool is full" 是**同一根因的两个症状**，不是两个独立问题。
#   ✗ ③ 而且它压根没消除空闲连接：server/control.go GetWorkConn 在**每次取用后**
#        都 `Send(&msg.ReqWorkConn{})` 补一条回来（源码注释 "replace it with a
#        new one"），所以池子照样会被填满到容量上限，只是从 200 条缩到 11 条。
#        「空闲池」没有被消灭，只是变小了 —— 假设不成立。
#
# 所以恢复 200，改由上面的 dialServerKeepalive 从**源头**消灭僵尸连接
# （让连接根本不被 NAT 回收），而不是靠缩池子绕开症状。
# 保留 200 的额外好处：重试 201 次的自愈余量、通道 210 的突发容量都回来了。
# 注：effective = min(客户端, 服务端)，这里与 VPS 的 maxPoolCount 保持一致(200)。
transport.poolCount = 200

[[proxies]]
# 名称在同一 frps 上必须唯一（多套 ACF 共用一个 frps 时改这里）
name = "acf-web"
type = "http"
# 同 compose 网络内的服务名——不要改成 127.0.0.1，那是 frpc 容器自己
localIP = "admin-web"
localPort = 80
# frps 按 HTTP Host 头路由到本代理；nginx 已按 server_name 收敛域名。
# 换域名时这里与 nginx 的 server_name 同步改。
# 真实域名由 .env 的 FRP_DOMAIN 注入（见 docker-compose.frp.yml），
# 仓库里不落具体值。
customDomains = ["{{ .Envs.FRP_DOMAIN }}"]

# ── 健康检查（2026-10-30 生产故障后新增）──────────────────────────
# 故障现象：frps 重启（改配置/面板重启/崩溃）后路由表清空，但 frpc 侧 proxy
# 仍停在 Phase=Running（client/control.go 只在收到 NewProxyResp 时才置
# Running，重连后不会主动重发 NewProxy），于是域名访问落到 frps 的
# "The page you requested was not found ... powered by frp" 404 页，
# 而 frpc 日志一切正常。本次实测：重启 frpc 立即恢复。
#
# healthCheck 让 frpc 周期性探测本地服务，失败即把 proxy 置 CheckFailed 并
# 重新走 NewProxy 注册流程，无需人工介入。
healthCheck.type = "http"
healthCheck.path = "/health"
healthCheck.intervalSeconds = 30
healthCheck.timeoutSeconds = 5
healthCheck.maxFailed = 3
