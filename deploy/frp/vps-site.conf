# VPS 侧 nginx 反代站点模板（宝塔 / 原生 nginx 均可）
#
# 这是**模板**：所有 <> 占位符替换成你自己的值后再启用。
# 真实值不要提交进仓库——本地副本放 deploy/local/（已 gitignore）。
#
# 链路：执行器/浏览器 → https://<ACF_DOMAIN> → VPS nginx :443
#        → 127.0.0.1:<FRP_VHOST_HTTP_PORT>（frps vhostHTTPPort）
#        → frp 隧道 → 内网 frpc → admin-web:80（内部再代理 /api、/uploads、SSE）
#
# ── 逐项说明（每条都对应一个真实故障形态，别删）────────────────────
#   client_max_body_size 510m   执行器包 500MB / 应用包 200MB / PyPI 50MB，
#                               宝塔默认 1m~50m，会让上传直接 413
#   proxy_buffering off         执行日志 SSE 必须逐帧下发，否则"卡住不刷新"
#   proxy_cache off             API 响应含鉴权头与执行状态，绝不能缓存
#   proxy_request_buffering off 大包边收边转，不先落 nginx 临时盘（双写磁盘）
#   Connection ""               ACF 不用 WebSocket；置空保持 upstream 长连接，
#                               SSE 与 25s 长轮询都依赖它
#   ssl_early_data off          0-RTT 重放会让 POST 回调/触发/拉取重复执行
#   proxy_read_timeout 600s     长轮询 25s、SSE 每 15~30s 心跳，600s 足够
#
# 注意：不要给这个站点开 proxy_cache；宝塔自动生成的 proxy_cache_path 行可删。

# ── HTTP：只做跳转与证书验证 ──────────────────────────────────────
server {
    listen 80;
    server_name <ACF_DOMAIN>;

    # 宝塔 SSL 续期/申请走这里，必须放行
    location ^~ /.well-known/ {
        root <WEB_ROOT>;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：全部流量转给 frp 隧道 ─────────────────────────────────
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;

    server_name <ACF_DOMAIN>;

    # 宝塔路径形如 /www/server/panel/vhost/cert/<ACF_DOMAIN>/fullchain.pem
    ssl_certificate     <SSL_CERT_PATH>;
    ssl_certificate_key <SSL_KEY_PATH>;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ACF 的 POST 面（执行回调 / 触发任务 / pull 取件）不能被 0-RTT 重放
    ssl_early_data off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # 全站统一入口：路径原样透传，不做任何 rewrite
    location ^~ / {
        proxy_pass http://127.0.0.1:<FRP_VHOST_HTTP_PORT>;
        proxy_http_version 1.1;

        # vhost 模式靠 Host 头路由到 frpc 的 proxy —— 这行不能少、不能改错
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Connection "";

        client_max_body_size 510m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_socket_keepalive on;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 用 http 访问 https 端口时给出跳转而不是 400
    error_page 497 https://$host$request_uri;

    access_log /www/wwwlogs/<ACF_DOMAIN>.log;
    error_log  /www/wwwlogs/<ACF_DOMAIN>.error.log;
}
