# docker-compose.yml  —  完整部署（生产 / staging / CI）
# 所有机密信息通过环境变量注入，请先复制 .env.example 为 .env 并填写。
# 本地开发仅启动基础设施请改用 infra/docker-compose.yml。
#
# E-34（DEEP_REVIEW 0ef3bbe）：删除 `version:` 字段——Compose V2 已弃用它并告警，
# 文件本身即 compose 规范（V2 不再需要 version 声明）。

networks:
  # 内部网络，服务间通信
  autoflow-internal:
    internal: true
  # 对外暴露网络
  autoflow-public:

services:
  # ── Infrastructure ──────────────────────────────────────
  # X-1（可扩展性审查）：postgres 为单实例，本 compose 不含流复制——主库故障
  # 即整个系统不可用。生产建议：云 RDS（主从 + 自动故障切换）或自建 PG 流复制
  # + Patroni；本文件保持单实例形态，不伪造不可运行的复制配置。
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      # F-2: :? 语法强制显式注入——未设置/为空时 compose 解析即报错（fail-fast），
      # 不再带空口令启动到容器层才暴露（postgres-replica 为 profile 服务且与
      # 本服务同源变量，此处守卫即覆盖）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-autoflow}
    # 512M was tight for the scheduled workload (audit log aggregation,
    # index builds during migrations)
    mem_limit: 1g
    # O-8: 资源限制统一用 compose 原生顶层字段（deploy.resources 是 swarm 字段，
    # 纯 compose up 下不生效且与 mem_limit 混用造成语义混乱，已删除）
    cpus: '0.5'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres uses /dev/shm for parallel sorts/hashes; the 64MB default
    # causes spilling to disk under load
    shm_size: 256mb
    # M-5: 1G 容器下的稳妥调优（PG 建议 shared_buffers ≈ 25% 内存；
    # max_connections 兼顾多副本 admin-api 连接池（每实例 DB_POOL_SIZE=20）与
    # 迁移/后台聚合任务；work_mem/effective_cache_size 按 1G 内存折算）
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=150", "-c", "work_mem=8MB", "-c", "effective_cache_size=768MB"]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autoflow}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autoflow-internal

  # ── 只读副本 (可选，profile: replica) — ARCH-24 ──────────────
  # 启用: docker compose --profile replica up -d postgres-replica
  # ⚠ 演示形态：此容器不真正做流复制——只起一个可连的空 PG 实例，供本地
  #   联调 DB_READ_REPLICA_URL 的连接与查询路由（SELECT 走副本、写面走主库
  #   的行为验证）；它不会自动同步主库数据。真实部署的读副本请用云 RDS
  #   read replica 或 PG 流复制（primary_conninfo + standby.signal），
  #   复制延迟/只读语义等注意点见 docs/deployment.md「读写分离（可选）」段。
  # 联调方式：启动后把 admin-api 的 DB_READ_REPLICA_URL 设为
  #   postgres://<POSTGRES_USER>@postgres-replica:5432/<DB_DATABASE>
  postgres-replica:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    profiles: ['replica']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-autoflow}
    mem_limit: 512m
    # M-6: 与主库对称，避免副本在排序/哈希时 spill to disk
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autoflow}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autoflow-internal

  # X-2（可扩展性审查）：Leader 选举 / 分布式锁 / BullMQ / pull 派发队列均依赖
  # Redis，单实例为单点（应用侧已有 fail-open 降级：Redis 不可用退化为 DB
  # 条件 UPDATE claim 兜底）。生产建议 Redis Sentinel 或 Cluster。
  # 本文件的可运行改进：开启 AOF 持久化（appendonly yes），重启不丢队列/锁
  # 语义外的必要状态；数据落 redis_data 卷。
  # F-1/O-8: 资源限制用 compose 原生顶层字段（与 postgres 对齐；deploy.resources
  # 是 swarm 字段，纯 docker compose up 下不生效）。M-2: 启用密码认证（admin-api
  # 侧已支持 REDIS_PASSWORD，见 configuration.ts）。F-6: maxmemory 内联等效
  # config/redis/autoflow-redis.conf 的同名参数——该 conf 为隔离本地开发专用
  # （scripts/start-isolated.sh 消费，端口 6380），不挂载到此容器。
  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
    # BullMQ 硬性要求 noeviction：allkeys-lru 会在内存压力下静默驱逐队列任务/
    # 分布式锁/去重键（jobs 完成事件、锁、stalled 检测全依赖 Redis 键存活），
    # 表现为任务凭空消失且无报错。到达 maxmemory 后写入报错（OOM command not
    # allowed）而非丢数据——应通过监控告警（redis-exporter 的
    # redis_memory_used_bytes / redis_maxmemory 比值）及时扩容，而不是靠驱逐。
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      # exec 形态（无 shell 层），密码作为独立 argv 传入，避免引号/元字符问题
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - autoflow-internal

  # ── Core Services ──────────────────────────────────────
  admin-api:
    # DEP-HA-1 多副本：本服务可 --scale admin-api=N 水平扩展（多实例行为一致
    # 性由 ARCH-31 保证）。扩容必须配合 docker-compose.ha.yml override 使用
    # （清空宿主端口防冲突 + 共享 uploads 卷）：
    #   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d --scale admin-api=2
    # 入口流量统一走 admin-web 内置 nginx（infra/nginx/default.conf 为运行时
    # 再解析，自动轮询多副本）。约束见 docs/deployment.md「多副本（HA）部署」。
    build:
      context: ./apps/admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    cpus: '1.0'
    ports:
      # E-03: loopback-only——admin-api 宿主面仅本机可路由（其余端口同款写法）；
      # 执行器回程走内网 ADMIN_API_URL=http://admin-api:3105，不依赖宿主映射
      - '127.0.0.1:3105:3105'
    # .env 全量注入容器环境（configuration.ts 消费约 120 键，下方白名单只覆盖
    # 少数关键键，此前约 90 键如 SEC_SECRETS_KEY / THROTTLE_* / OIDC_* /
    # AGENT_* / 通知渠道等永不进容器）。合并优先级：本段 environment 显式键 >
    # env_file > 镜像 ENV——即 DB_HOST/REDIS_HOST 等拓扑键仍以 environment 的
    # postgres/redis 为准（.env 里面向本机部署的 localhost 值不会破坏容器拓扑），
    # staging override 的 LOG_LEVEL: debug 也继续压过 env_file 的同键值。
    # 注意区分：compose 的 ${VAR} 插值仍从宿主 shell + 项目 .env 读取（用于
    # 解析本文件与 :? 守卫），env_file 只负责把键注入容器环境，两者共存无冲突。
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-autoflow}
      # F-2: 敏感变量统一 :? 强制注入（未设置/为空时 compose 解析即报错，
      # fail-fast，不再带空口令/空密钥静默启动）
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-autoflow}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      # M-2: redis 服务已强制 --requirepass，admin-api 侧必须携带同源密码
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # OBS-02: Alertmanager webhook 入站 HMAC secret（可选；未配置时
      # POST /api/alerts/webhook 503 安全缺省拒绝，见 alerts.controller.ts）
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET in .env}
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5176}
      # F-1（2026-10-27 审计轮 #7）：本机试跑的关键开关——缺了它整栈起不来。
      # admin-api 的生产守卫拒绝「NODE_ENV=production 且 CORS 含 localhost/127.0.0.1」
      # （configuration.ts:1004-1015），而本文件默认 NODE_ENV=production、上面的
      # CORS_ORIGINS 默认值恰恰是 localhost ⇒ 「照 README 灌 .env 后
      # docker compose up」的默认组合会被 fail-fast 打死，而报错发生在容器日志里，
      # 用户看到的是页面打不开。
      # 语义边界（写清楚，避免被误读成"默认放开"）：默认留空 = 行为完全不变
      # （仍是生产 fail-fast）；只有显式 true 才放行回环来源。
      # 为什么显式列出而不是依赖 env_file：env_file 本已会把 .env 里的同名键注入
      # 容器，但 compose 的 environment 块对本文件的所有键都是**逐个声明**的，
      # 该键此前在本块缺席，导致"本机试跑必需"这件事在部署面完全不可见
      # （.env.example:72 是注释状态，quickstart/README 也没提）。显式列出后
      # 它与 CORS_ORIGINS / ADMIN_WEB_ORIGIN 同构，读 compose 即知依赖。
      ALLOW_LOOPBACK_CORS: ${ALLOW_LOOPBACK_CORS:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 显式堆上限（比依赖容器 mem_limit 兜底更早、更可控地 OOM）：500 并发
      # 实测峰值 RSS 394MB，512MB 堆 + 容器 768m 余量充裕；堆到 mem_limit 才
      # 被 cgroup 杀掉会连带同一容器的其它进程一起阵亡。
      NODE_OPTIONS: '--max-old-space-size=512'
      APP_PROTOCOL: ${APP_PROTOCOL:-http}
      # APP-002: 上传应用包时用它拼 executor 可下载的 packageUrl
      # （{API_BASE_URL}/uploads/packages/...）；未配置时上传接口直接 500。
      # 缺省 http://admin-api:3105 仅对**同 compose 网络内**的 executor-python /
      # executor-node 可达；宿主上的桌面执行器或跨机执行器必须在根 .env 覆盖为
      # 它们能访问的地址（私网地址还需 EXECUTOR_ALLOW_PRIVATE_NETWORK=true，
      # 否则执行器自己的 ssrf-guard 会拒掉下载）。
      API_BASE_URL: ${API_BASE_URL:-http://admin-api:3105}
      # LOG-02: execution log storage (db | s3); s3 needs the rustfs profile
      # 客户端不变：apps/admin-api 仍用 npm `minio` 包（通用 S3 SDK）。服务端
      # 换 RustFS 后端点/凭证默认值同步指向 rustfs 服务与 RUSTFS_* 凭证，
      # 显式设置 LOG_STORAGE_* 时仍以显式值为准（兼容云 S3/OSS）。
      LOG_STORAGE_DRIVER: ${LOG_STORAGE_DRIVER:-db}
      LOG_STORAGE_ENDPOINT: ${LOG_STORAGE_ENDPOINT:-rustfs:9000}
      LOG_STORAGE_BUCKET: ${LOG_STORAGE_BUCKET:-autoflow-logs}
      LOG_STORAGE_ACCESS_KEY: ${LOG_STORAGE_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-autoflow}}
      # 未显式配置时跟随 rustfs 的 secret（两者必须是同一套凭证，否则 s3 驱动
      # 401 → 回调路径自动回退 db）
      LOG_STORAGE_SECRET_KEY: ${LOG_STORAGE_SECRET_KEY:-${RUSTFS_SECRET_KEY:-}}
      LOG_STORAGE_USE_SSL: ${LOG_STORAGE_USE_SSL:-false}
      # E-03: 无缺省值——:? 语法强制 .env 显式注入（未设置/为空时 compose
      # 解析即报错，不再带缺省口令起服务）；弱口令/短口令由 configuration.ts
      # 生产 fail-fast 拒启。非 compose 部署未设置该变量时跳过初始管理员
      # 种子（users.service 既有行为）
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@autoflow.local}
      # python_task_multiversion：可声明的 Python 版本区间（写面校验）。
      # 与 executor-python 侧同名变量**同源注入**——两侧必须一致，否则会出现
      # "能保存但跑不了"（admin 放宽而执行器收紧）或"能跑但存不了"（反向）。
      # 读取点：src/modules/task/runtime-version.util.ts（getEnvVar，调用时读）。
      # 非法值静默回退契约缺省（3.7/3.14），不会让写面 500。
      PYTHON_RUNTIME_VERSION_MIN: ${PYTHON_RUNTIME_VERSION_MIN:-3.7}
      PYTHON_RUNTIME_VERSION_MAX: ${PYTHON_RUNTIME_VERSION_MAX:-3.14}
      # 2026-10-23 真机缺陷：「包注册中心」页面的 PyPI/npm 列表**在所有 Docker
      # 部署下必然 502**。两个根因，缺一不可：
      #   ① 本服务块从未注入 registry 基址 → 容器内回落 localhost:8003/4873，
      #      那是容器自己（registry-pypi / registry-npm 是**别的**容器）；
      #   ② 从未注入 REGISTRY_USER/PASS → 私有仓要求 Basic 认证，匿名必 401
      #      （列表代理把它透出为 502）。
      # 单测一直绿，因为 spec 显式注入了 env（"mock 不等于能跑"）。
      #
      # ⚠️ 为什么 PyPI 侧走派生键而不是直接复用 PYPI_REGISTRY_URL：
      # 执行器侧的 `PYPI_REGISTRY_URL` 是 pip --index-url 语义（值带 `/simple/`），
      # 而 admin 的 controller 自己拼 `${base}/simple/` → 直接共用会拼出
      # `/simple//simple/`（实测上游 404）。故这里显式给**基址**
      # `ADMIN_PYPI_REGISTRY_URL`（不带 /simple/），与执行器变量并存不冲突。
      ADMIN_PYPI_REGISTRY_URL: ${ADMIN_PYPI_REGISTRY_URL-http://registry-pypi:8003}
      NPM_REGISTRY_URL: ${NPM_REGISTRY_URL-http://registry-npm:4873}
      # 生产环境 registry 出站强制 https（B-3），但 compose 内网是 http 服务名。
      # 显式 opt-in 声明「这些是桥接网内的服务名，流量不出宿主」——与
      # NOTIF_ALLOW_PRIVATE_NETWORK / EXECUTOR_ALLOW_PRIVATE_NETWORK 同族先例。
      # 不设或设 false ⇒ 容器外/公网部署的既有 fail-fast 姿态逐字节不变。
      REGISTRY_ALLOW_PRIVATE_NETWORK: ${REGISTRY_ALLOW_PRIVATE_NETWORK:-true}
      # registry 的 Basic 凭据（与 registry-pypi 服务同源；npm 侧匿名 401 时
      # 也用它换 Verdaccio token，见 registry.controller.resolveNpmAuthHeader）。
      REGISTRY_USER: ${REGISTRY_USER:-admin}
      REGISTRY_PASS: ${REGISTRY_PASS:?set REGISTRY_PASS in .env}
      NPM_REGISTRY_USER: ${NPM_REGISTRY_USER:-}
      NPM_REGISTRY_PASS: ${NPM_REGISTRY_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3105/api/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - autoflow-internal
      - autoflow-public
    # P3·运维（2026-10-25 审计）：/uploads 落命名卷——此前无 volumes，应用包
    # （uploads/packages/<appId>/<sha256>/...，部署行 packageUrl 指向它）与执行
    # 器包（uploads/executor-packages/，UPLOAD_DIR=process.cwd()/uploads/
    # executor-packages，见 application.controller.ts / executor-package.service.ts）
    # 全部存容器可写层，容器重建/升级即悬空：存量行的 packageUrl 404（部署/
    # 回滚链失效）、执行器包要重新上传才能用。挂载点与 Dockerfile 的
    # WORKDIR=/app 对齐，也与 docker-compose.ha.yml 的共享卷形态
    # （admin_uploads:/app/uploads）同源——HA override 在此基础上把同一卷挂给
    # 多副本。
    # 注意：本改动只让**新**建容器持久化；对已在容器层写过数据的存量容器，
    # 首次 up -d 重建前需手动迁移（docker cp 出旧目录内容再灌回卷），由运维
    # 收口执行。
    volumes:
      - admin_uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      admin-api:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3105}
      VITE_API_URL_INTERNAL: ${VITE_API_URL_INTERNAL:-http://localhost:3105}
      VITE_API_URL_EXTERNAL: ${VITE_API_URL_EXTERNAL:-}
    healthcheck:
      # 同 verdaccio（R8）：nginx:alpine 的 busybox wget 把 localhost 解析到
      # ::1，而 nginx 只监听 IPv4 → healthcheck 恒 connection refused。
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ── RustFS (可选，profile: rustfs) ─────────────────────
  # 启用: docker compose --profile rustfs up -d
  # 再将 admin-api 的 LOG_STORAGE_DRIVER 设为 s3，执行日志将以 gzip
  # 对象存放在此，主库 execution_log_lines 不再增长（优化笔记 2.6）
  # 服务端是 RustFS（Apache-2.0，S3 兼容）；admin-api 侧的 S3 客户端**不变**
  # ——仍是 npm `minio` 包（通用 S3 SDK，对 RustFS 同样可用）。
  # X-3（可扩展性审查）：本单实例 rustfs 为文件存储单点；生产建议云 S3/OSS，
  # 或 rustfs 多节点模式。
  # 注意：admin 侧对象回收由 WIKI-LOG-S3GC（S3LogObjectRetentionService，每日
  # 03:35）承担——按过期 s3 指针批量 remove execution-logs/ 前缀对象并清空指针
  # （单轮上限、余量次轮续收），admin 正常运行时 rustfs_data 卷不会随日志对象
  # 无限增长。bucket lifecycle 仅为可选兜底（admin 长期停机等场景），步骤见
  # docs/operations.md「S3/RustFS 日志对象生命周期」。
  #
  # ⚠ 迁移（MinIO → RustFS，2026-10-29）：**数据不可原地复用**。RustFS 的
  #   「MinIO 磁盘格式兼容」是 preview/非默认构建，且官方明确「MinIO 加密的
  #   对象 RustFS 读不了」——旧 `minio_data` 卷**不能**挂给 rustfs。历史执行
  #   日志二选一：① 新旧并存，用 `mc mirror` 走 S3 侧复制（步骤见
  #   docs/operations.md「MinIO → RustFS 迁移」）；② 接受历史日志随 30/90 天
  #   保留期自然过期（日志非业务数据；task_executions 行不受影响）。旧卷
  #   `minio_data` 保留到保留期结束再 `docker volume rm`（别在切换当天删）。
  rustfs:
    # CIR-05：固定到 manifest list digest（tag 保留便于人读），升级走显式 bump。
    # 与 E-34 同源——日志存储组件的升级必须可复现。
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    profiles: ['rustfs']
    restart: unless-stopped
    # 镜像内不需要提权（单一进程，无 setuid 二进制）
    security_opt: ['no-new-privileges:true']
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # Console
    environment:
      # 单节点单盘：卷挂载点必须与 RUSTFS_VOLUMES 一致
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-autoflow}
      # 无默认值（与旧 MinIO 的 root 口令同款纪律）：启用 profile 前必须在
      # .env 里设置，否则 rustfs 以空凭证启动即失败。
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_OBS_LOGGER_LEVEL:-info}
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    volumes:
      - rustfs_data:/data/rustfs0
      - rustfs_logs:/app/logs
    healthcheck:
      # 官方 compose 同款：镜像内含 curl；/health 是 RustFS 的健康端点
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 命名卷首次创建时属主是 root，而 rustfs 以非 root 10001:10001 运行 ⇒
    # 必须先 chown，否则启动即 permission denied（见 volume-permission-helper）
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # RustFS 的卷属主修复（官方 compose 的 volume-permission-helper 同一手法）：
  # rustfs 以**非 root 10001:10001** 运行，而 docker 创建的命名卷属主是 root。
  # 一次性 alpine 容器把两个卷 chown 给 10001，跑完即 exit 0；rustfs 通过
  # depends_on: condition: service_completed_successfully 等它成功后才启动。
  # restart: "no" 是必须的——它是一次性任务，不是常驻服务。
  volume-permission-helper:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    profiles: ['rustfs']
    restart: 'no'
    command: ['sh', '-c', 'chown -R 10001:10001 /data/rustfs0 /app/logs']
    security_opt: ['no-new-privileges:true']
    volumes:
      - rustfs_data:/data/rustfs0
      - rustfs_logs:/app/logs
    networks:
      - autoflow-internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

  # ── Executors ──────────────────────────────────────
  executor-python:
    build:
      context: ./apps/executor-python
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1G
    cpus: '1.0'
    # S9: /api/execute is a code-execution surface — host access is
    # loopback-only (same precedent as registry-pypi/registry-npm below);
    # admin-api reaches executors over the internal network, so this mapping
    # only affects host-side access. Override deliberately for external use.
    ports:
      - '127.0.0.1:8001:8001'
    environment:
      APP_NAME: executor-python-1
      PORT: 8001
      # E-25（DEEP_REVIEW 0ef3bbe）：容器内必须监听 0.0.0.0 才能被其他容器
      # 通过 Docker 网络访问；裸机默认已收为 127.0.0.1。
      BIND_ADDRESS: 0.0.0.0
      # S9: fail closed (503) instead of dev-mode allow-all when no token is
      # configured; admin-api holds the same EXECUTOR_SECRET below.
      REQUIRE_TOKEN: 'true'
      EXECUTOR_ADDRESS: executor-python:8001
      # P1-1（生产报告 2026-10-22 §3.1）：同 executor-node，**必填**——旧缺省值
      # 让「没设变量」的每个副本都上报同一个字面地址，多副本时即「多份安装
      # 共享一个地址」。单副本 dev 栈在 .env 里填服务名即可。
      EXECUTOR_ADDRESS_PUBLIC: ${EXECUTOR_PYTHON_PUBLIC_ADDRESS:?set EXECUTOR_PYTHON_PUBLIC_ADDRESS (per-replica public address, e.g. 192.168.1.51:8001)}
      # N-15：同 executor-node——包 URL 为内网 admin-api，放行拉取
      EXECUTOR_ALLOW_PRIVATE_NETWORK: "true"
      ADMIN_API_URL: http://admin-api:3105
      ADMIN_API_URL_INTERNAL: ${ADMIN_API_URL_INTERNAL:-http://admin-api:3105}
      ADMIN_API_URL_EXTERNAL: ${ADMIN_API_URL_EXTERNAL:-}
      # F-2: 与 admin-api 侧同源强制注入（未设置即 compose 解析报错）
      EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET in .env}
      WORK_DIR: /data/tasks
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # DEEP-AUDIT D2-P1-1（2026-09-22，2026-10 修正）：任务沙箱默认**关闭**。
      # 历史实现硬编码 TASK_SANDBOX=bwrap，但 executor-python 镜像不含
      # bubblewrap，且 compose 的 cap_drop/no-new-privileges 与多数宿主的
      # seccomp 策略不允许非特权 user namespaces——结果是开箱即用的默认部署里
      # **每个 Python 任务都 fail-closed**（sandbox_unavailable）。
      # 现在默认直跑（仍在 non-root + cap_drop + rlimit 的容器内），需要最强隔离
      # 时显式叠加 docker-compose.secure.yml（TASK_SANDBOX=bwrap），并先按
      # docs/deployment.md「容器安全（SEC-07）」验证 userns/bwrap 前置。
      TASK_SANDBOX: ${TASK_SANDBOX:-}
      # DEEP-AUDIT B·2.2：PYPI_REGISTRY_URL 是 **--index-url 语义（替换默认
      # 索引）**，而非附加；registry-pypi 是纯文件仓、**无上游代理**——默认
      # 值下任何未手动上传到私有源的包（含 PyPI 官方包）安装都会失败。若需
      # 同时可见官方源，设 PYPI_EXTRA_INDEX_URL（以 --extra-index-url 追加），
      # 或把本值显式置空（uv 回落默认 PyPI）。node 执行器的 PYTHON_REGISTRY_URL
      # 同语义。
      # B-2（私有包仓库域审计）：显式置空回落官方源的契约必须真的成立——
      # 旧写法 `${VAR:-default}` 对「未设置」与「空串」都取默认值，README
      # 与 .env.example 承诺的「留空使用官方源」从不生效。改用 `${VAR-default}`
      # （bash 去 default 语义）：**仅未设置**才落到私有源默认，显式置空
      # （空串）原样传给执行器——执行器侧 `process.env.X || ''` 把空串当
      # 「未配置」，回落官方源。三键同族同语义，须一起改。
      PYPI_REGISTRY_URL: ${PYPI_REGISTRY_URL-http://registry-pypi:8003/simple/}
      # 可选：追加官方索引（--extra-index-url 语义），缓解「私有源无上游、
      # 公共包必失败」；不设则行为不变。
      PYPI_EXTRA_INDEX_URL: ${PYPI_EXTRA_INDEX_URL:-}
      # P1（契约断裂修复，2026-10-25）：registry-pypi Basic 凭据对。与
      # REGISTRY_USER/REGISTRY_PASS 同值即可——执行器把它写成 0600 netrc
      # （uv cache 旁 .uv-netrc），仅以 NETRC env 键注入 uv install 子进程；
      # 凭据不进 argv/日志/URL，也不进执行器主进程环境。留空（默认）= 无凭据
      # 通道，私有源匿名 401 姿态与历史一致。
      PYPI_REGISTRY_USERNAME: ${PYPI_REGISTRY_USERNAME:-}
      PYPI_REGISTRY_PASSWORD: ${PYPI_REGISTRY_PASSWORD:-}
      # ── python_task_multiversion：解释器缓存池与多版本 ──────────────
      # 任务可声明 runtimeVersion（Python 主.次版本）按需获取解释器；不声明
      # 则沿用宿主解释器（存量语义逐字节不变）。
      # 池根目录：独立命名卷，**刻意与 WORK_DIR(/data/tasks) 分离**——WORK_DIR
      # 受磁盘 TTL 清扫（DISK_CLEANUP_TTL_DAYS）管理，解释器是可复用资产，
      # 被 TTL 误删就要重新下载（离线环境下永久不可恢复）。
      UV_PYTHON_INSTALL_DIR: /data/interpreters
      # 可选内网镜像（私有化模式 A）；留空 = 走 uv 默认源（Astral CDN /
      # GitHub Releases，在线主路径）。仅 http(s)，无 userinfo/query/fragment。
      UV_PYTHON_INSTALL_MIRROR: ${UV_PYTHON_INSTALL_MIRROR:-}
      # 单次下载独立超时预算（秒，D11）；实测单版本约 13~17s，300s 余量充裕。
      INTERPRETER_DOWNLOAD_TIMEOUT_SECONDS: ${INTERPRETER_DOWNLOAD_TIMEOUT_SECONDS:-300}
      # 下载全局有界并发（D13，默认 2；1 = 全局单队列）。不同版本并行下载、
      # 同版本共享一次；弱网/低磁盘部署可收紧。
      INTERPRETER_DOWNLOAD_CONCURRENCY: ${INTERPRETER_DOWNLOAD_CONCURRENCY:-2}
      # 体积红线（D12）：解释器层豁免 TTL，改由红线治理（超限告警 + LRU 回收）。
      INTERPRETER_SINGLE_VERSION_MB: ${INTERPRETER_SINGLE_VERSION_MB:-250}
      INTERPRETER_TOTAL_GB: ${INTERPRETER_TOTAL_GB:-4}
      # 可声明版本区间（主.次）；与 admin-api 侧同名变量须保持一致。
      # 注意：3.7 在线不可下载（uv 清单只到 3.8~3.14），需离线预填缓存卷，
      # 见 docs/design/python-task-upload-and-multiversion/OFFLINE-PROVISIONING.md
      PYTHON_RUNTIME_VERSION_MIN: ${PYTHON_RUNTIME_VERSION_MIN:-3.7}
      PYTHON_RUNTIME_VERSION_MAX: ${PYTHON_RUNTIME_VERSION_MAX:-3.14}
    # SEC-07: 最小权限双闸（镜像层已 non-root，见 apps/executor-python/Dockerfile
    # Q-08 —— adduser appuser + USER）。cap_drop 移除全部 Linux capabilities
    # （代码执行面不需要任何特权操作）；no-new-privileges 阻断 setuid 提权路径。
    # 真机验收（容器内非 root 且任务可跑）见 docs/deployment.md「容器安全」段。
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    # 资源硬限制：任务子进程继承容器限制——nofile 上限防 fd 泄漏，
    # pids_limit 防 fork 炸弹（代码执行面是 fork 大户）；CPU 时间上限由
    # cpus='1.0' + 任务超时 kill 兜底（代码层另设 RLIMIT_CPU，见 execute.py
    # _spawn_kwargs_for_platform）。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 512
    volumes:
      - executor_python_data:/data/tasks
      # python_task_multiversion：解释器缓存池独立命名卷（与 /data/tasks 分离，
      # 豁免 TTL 清扫）。离线预填 3.7 即预置到此卷，步骤见
      # docs/design/python-task-upload-and-multiversion/OFFLINE-PROVISIONING.md
      - interpreter_cache:/data/interpreters
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8001/health")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  executor-node:
    build:
      context: ./apps/executor-node
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1G
    cpus: '1.0'
    # S9: loopback-only host mapping — see executor-python above.
    ports:
      - '127.0.0.1:8002:8002'
    environment:
      APP_NAME: executor-node-1
      PORT: 8002
      # E-25（DEEP_REVIEW 0ef3bbe）：容器内必须监听 0.0.0.0 才能被其他容器
      # 通过 Docker 网络访问；裸机默认已收为 127.0.0.1。
      BIND_ADDRESS: 0.0.0.0
      # S9: fail closed (503) instead of dev-mode allow-all when no token is
      # configured; admin-api holds the same EXECUTOR_SECRET below.
      REQUIRE_TOKEN: 'true'
      EXECUTOR_ADDRESS: executor-node:8002
      # P1-1（生产报告 2026-10-22 §3.1）：**必填，不再给缺省字面量**。
      # 旧写法 ${EXECUTOR_NODE_PUBLIC_ADDRESS:-executor-node:8002} 会让「没设变量」
      # 的每个 compose 副本都上报**同一个** address（executor-node:8002）——
      # 多副本部署时那正是「多份安装共享一个地址」的制造机（与 install.sh 里
      # hostname -I 取到 198.18.0.1 同型）。compose 语法 ${VAR:?msg} 在未设置时
      # 直接报错退出，比「静默上报一个必然碰撞的字面量」诚实得多。
      EXECUTOR_ADDRESS_PUBLIC: ${EXECUTOR_NODE_PUBLIC_ADDRESS:?set EXECUTOR_NODE_PUBLIC_ADDRESS (per-replica public address, e.g. 192.168.1.50:8002)}
      # N-15 实跑发现：应用包 packageUrl 缺省拼的就是内网 admin-api 地址（见
      # admin-api API_BASE_URL 注释），执行器拉包会被自己的 ssrf-guard 以私网
      # 地址拒掉 -> compose 形态应用包任务全军覆没。同网络内拉 admin-api 是设
      # 计主路径（跨机执行器仍由根 .env 显式控制），此处显式放行。
      EXECUTOR_ALLOW_PRIVATE_NETWORK: "true"
      ADMIN_API_URL: http://admin-api:3105
      ADMIN_API_URL_INTERNAL: ${ADMIN_API_URL_INTERNAL:-http://admin-api:3105}
      ADMIN_API_URL_EXTERNAL: ${ADMIN_API_URL_EXTERNAL:-}
      # F-2: 与 admin-api 侧同源强制注入（未设置即 compose 解析报错）
      EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET in .env}
      WORK_DIR: /data/tasks
      MAX_CONCURRENT_TASKS: 10
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 显式堆上限：执行器承载任务子进程，BoundedLogBuffer 已防日志 OOM，但
      # 解释器池清单/心跳/回调聚合等仍有内存峰值；1024MB 堆给任务子进程与
      # 解释器池留足余量，比堆膨胀到 mem_limit 被 cgroup 杀掉更早、更可控。
      NODE_OPTIONS: '--max-old-space-size=1024'
      # B-2：同 PYPI_REGISTRY_URL 的 `${VAR-default}` 语义——显式置空回落
      # npmjs.com 官方源（执行器侧空串=未配置），仅未设置才取私有源默认。
      NPM_REGISTRY_URL: ${NPM_REGISTRY_URL-http://registry-npm:4873}
      # N-1（2026-10-26 registry-npm 审计）：registry-npm 的 '**' 与
      # '@autoflow/*' 均 access: $authenticated（apps/registry-npm/config.yaml），
      # 执行器任务 npm install 私包必 401——与上方 PyPI netrc 凭据注入完全
      # 对称的缺口，PyPI 修了 npm 漏了。
      # 形态选型（2026-10-26 对 5.31.1 实测）：Basic 认证通过；
      # `Bearer <base64(user:pass)>` 被 401 拒绝 → .npmrc 的 `_authToken`
      # （npm 发 Bearer）装不了 Basic 密码；JWT 又有 60d 有效期
      # （config.yaml security.api.jwt.sign.expiresIn）且已存在用户无法稳定
      # 重签（PUT /-/user/login 409，见 registry.controller.ts「2026-10-23」
      # 注释）。故走 USER/PASS：executor-node 在任务 .npmrc 生成
      # `//<host:port>/:_auth=<base64(user:pass)>`（execute.ts
      # buildNpmRcContent）。默认回落 REGISTRY_USER/PASS（与 admin-api 代理面
      # 同源凭据，demo 由 .env.demo 的 REGISTRY_PASS 驱动、与 registry 卷内
      # htpasswd 的 admin 账号匹配）——零新增密钥、永不过期；预签发 token
      # 场景（公网 npm）仍走 NPM_REGISTRY_TOKEN，优先级更高。
      NPM_REGISTRY_USER: ${NPM_REGISTRY_USER:-${REGISTRY_USER:-admin}}
      NPM_REGISTRY_PASS: ${NPM_REGISTRY_PASS:-${REGISTRY_PASS:?set REGISTRY_PASS in .env}}
      # 与 executor-python 的 PYPI_REGISTRY_URL 同语义：--index-url 替换默认
      # 索引、registry-pypi 无上游代理；可用 PYPI_EXTRA_INDEX_URL 追加官方索引。
      PYTHON_REGISTRY_URL: ${PYTHON_REGISTRY_URL-http://registry-pypi:8003/simple/}
      PYPI_EXTRA_INDEX_URL: ${PYPI_EXTRA_INDEX_URL:-}
      # P1（契约断裂修复，2026-10-25）：与上方 executor-python 块同族——netrc
      # 注入 uv/pip install 子进程（node 侧 defaultUvEnv，池目录下 .uv-netrc）。
      PYPI_REGISTRY_USERNAME: ${PYPI_REGISTRY_USERNAME:-}
      PYPI_REGISTRY_PASSWORD: ${PYPI_REGISTRY_PASSWORD:-}
      # ── python_task_multiversion：解释器缓存池（node 侧同构） ────────
      # executor-node 的 python 分支与 executor-python 对等（声明版本按需
      # 获取解释器）。uv 定位顺序：UV_BIN → PATH → desktop 内置（Electron
      # 注入 UV_BIN）→ 都无则声明版本的任务明确失败（reason=uv_missing）。
      # 注意：本 compose 服务基于 node:24-alpine（U-2，与 CI 的 node 24 对齐），
      # **当前镜像未内置 uv 也未装 python**（故 detectAvailableRuntimes 不会上报
      # python 能力）——以下变量在此服务上暂为惰性配置，供镜像补齐 uv 后直接
      # 生效；桌面端（executor-desktop 内置 uv + 宿主 python）为主要消费形态。
      UV_BIN: ${UV_BIN:-}
      UV_PYTHON_INSTALL_DIR: /data/interpreters
      UV_PYTHON_INSTALL_MIRROR: ${UV_PYTHON_INSTALL_MIRROR:-}
      INTERPRETER_DOWNLOAD_TIMEOUT_SECONDS: ${INTERPRETER_DOWNLOAD_TIMEOUT_SECONDS:-300}
      INTERPRETER_DOWNLOAD_CONCURRENCY: ${INTERPRETER_DOWNLOAD_CONCURRENCY:-2}
      # 注：INTERPRETER_SINGLE_VERSION_MB / INTERPRETER_TOTAL_GB 与
      # executor-python 同源注入——executor-node 自 NFR-15 起同样实现解释器池
      # 体积红线（interpreters.enforceInterpreterPoolLimits，与 python 侧
      # maintenance.enforce_interpreter_pool_limits 对等），两侧必须一致。
      INTERPRETER_SINGLE_VERSION_MB: ${INTERPRETER_SINGLE_VERSION_MB:-250}
      INTERPRETER_TOTAL_GB: ${INTERPRETER_TOTAL_GB:-4}
    # SEC-07: 最小权限双闸（镜像层已 non-root，见 apps/executor-node/Dockerfile
    # Q-09 —— adduser appuser + USER）。cap_drop/no-new-privileges 语义同
    # executor-python 上方注释。
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    # 资源硬限制（DEEP_REVIEW 补全）：任务子进程继承容器限制——nofile 上限防
    # fd 泄漏（chatty 任务开大量连接耗尽执行器 fd），pids_limit 防 fork 炸弹；
    # CPU 时间上限由 cpus='1.0' + 任务超时 kill 兜底（python 侧另有 RLIMIT_CPU）。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 512
    volumes:
      - executor_node_data:/data/tasks
      # python_task_multiversion：与 executor-python 共用同一解释器缓存**卷**。
      # ⚠ 两执行器基底 libc 不同（本服务 node:24-alpine = **musl**；
      #   executor-python 的 python:3.12-slim = **glibc**），因此**不能共用同一份
      #   解释器产物**——各自需要对应 libc 的构建。共卷本身是安全的：池目录名
      #   带 libc 分量（`linux-x86_64-musl` vs `linux-x86_64-gnu`），uv 按平台
      #   分量过滤，**非本平台的条目被安全跳过**（实测：池内混放 linux 命名条目
      #   时 `uv python list --only-installed` 仍 exit 0，本平台条目正常列出）。
      #   离线预填时须**两个 libc 各放一份**，见 OFFLINE-PROVISIONING.md §5.4。
      - interpreter_cache:/data/interpreters
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      # executor-node 显式绑 0.0.0.0（E-25，仅 IPv4），busybox wget 的 localhost
      # 解析到 ::1 恒 connection refused（2026-10-01 staging 实跑实证）→ 127.0.0.1。
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8002/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ── Package Registry ──────────────────────────────────────
  registry-pypi:
    build:
      context: ./apps/registry-pypi
      dockerfile: Dockerfile
    restart: unless-stopped
    # Host access is local-only by default; executors use the internal network.
    # For deliberate external package publishing, override this mapping explicitly.
    ports:
      - '127.0.0.1:8003:8003'
    environment:
      # P2-3（2026-10-26 审计）：这对是共享 Basic 口令——服务端有对端 IP 维度
      # 的失败退避（连续失败 5 次后按 2^n 秒拒答，成功清零），但 NAT 后多用户
      # 连坐、多副本计数不共享仍是残余风险；中期方向是 per-identity token
      # （每个调用方独立凭据，可单独吊销/限速），见
      # apps/registry-pypi/README.md「安全基线」。
      REGISTRY_USER: ${REGISTRY_USER:-admin}
      # F-2: Basic Auth 密码强制注入（未设置即 compose 解析报错）
      REGISTRY_PASS: ${REGISTRY_PASS:?set REGISTRY_PASS in .env}
      # E-34（DEEP_REVIEW 0ef3bbe）：旧 PYPI_API_KEY 是死配置——registry-pypi main.py
      # 从未读取它（grep 实证 0 处），鉴权只有 Basic（REGISTRY_USER/PASS）。保留会让运维
      # 误以为存在 token 鉴权通道。删除；将来若补 token 鉴权再连同 main.py 实现一并加回。
      PACKAGES_DIR: /data/packages
    volumes:
      - pypi_data:/data/packages
    # E-10（DEEP_REVIEW 0ef3bbe）：基础加固——只读根文件系统 + no-new-privileges
    # + cap_drop ALL。包写入目录挂载为 volume 可写。
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ['ALL']
    tmpfs:
      # P1-1（2026-10-26 registry-pypi 审计）：/tmp 无 size 上限时默认可达宿主
      # 内存一半（实测 16G）。认证前的 multipart spool（SpooledTemporaryFile
      # >1MB 部分落 /tmp）已被服务端 411/413 预检闸挡住（上传路由强制
      # Content-Length），这里再给 tmpfs 显式上限兜底：1g 对正常上传
      # （单包 ≤50MB）与运行期临时文件余量充足；打满后 multipart 解析报错
      # （对客户端 500），不影响 /data 卷与日志面。
      - /tmp:size=1g
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8003/health")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # P3-7（2026-10-26 审计）：关 uvicorn access log——每请求留痕由审计行
    # （registry.pypi.upload/.delete/.download）与结构化错误日志承接，access
    # log 属重复预算（logging 上限 10m*5）；高频 pip install 对 /simple/ 的
    # 轮询不再各占一行（401/退避拒绝等异常仍走服务端日志）。镜像 CMD 不变
    # （docker run 单跑形态不动），仅 compose 覆盖启动参数。
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --no-access-log
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  registry-npm:
    # O-3: major 浮动 tag（verdaccio:5）→ pin 到具体版本，升级不可复现问题与
    # 日志存储镜像同源（E-34 先例，现为 rustfs），5.x 内 minor 行为变化不再静默进入
    image: verdaccio/verdaccio:5.31.1@sha256:c77fec2127a1c3d17fc0795786f1e1bd88258e6d7af1835786ced4f7c7287da8
    restart: unless-stopped
    # Host access is local-only by default; executors use the internal network.
    # For deliberate external package publishing, override this mapping explicitly.
    ports:
      - '127.0.0.1:4873:4873'
    volumes:
      - npm_data:/verdaccio/storage
      - ./apps/registry-npm/config.yaml:/verdaccio/conf/config.yaml:ro
    # N-5（2026-10-26 审计）：verdaccio 不暴露文件 mode 配置，卷内 htpasswd 与
    # .verdaccio-db.json（含 JWT 签名 secret）默认 0644。容器以 uid 10001 运行、
    # 卷可写（read_only 只锁根 fs），启动前 umask 077 + chmod 600 收敛为仅属主
    # 可读写；卷属主 verdacci(10001) 与容器运行身份一致，chmod 可行（容器内
    # 实证）。umask 同时让 verdaccio 运行期新建的缓存文件继承最小权限。
    # 保留镜像默认 Cmd 的 --listen 参数语义：仅在其前面插入凭据收敛步骤后 exec。
    command: >
      /bin/sh -ec 'umask 077;
      [ -f /verdaccio/storage/htpasswd ] && chmod 600 /verdaccio/storage/htpasswd || true;
      [ -f /verdaccio/storage/.verdaccio-db.json ] && chmod 600 /verdaccio/storage/.verdaccio-db.json || true;
      exec verdaccio --config /verdaccio/conf/config.yaml --listen http://0.0.0.0:4873'
    # NETOPT-8⑧: E-10 同款加固——registry-pypi 段（read_only/no-new-privileges/
    # cap_drop/tmpfs）三件套+tmpfs 齐全，本段此前全缺。verdaccio 只写 storage 卷
    # （npm_data:/verdaccio/storage，htpasswd 也在其中，见 config.yaml），日志走
    # stdout（log: { type: stdout }），conf 为只读挂载——read_only 根文件系统
    # 不影响任何功能路径；tmpfs /tmp 供运行期临时文件。
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ['ALL']
    tmpfs:
      - /tmp
    healthcheck:
      # R8 冒烟发现：verdaccio 5 监听 0.0.0.0（仅 IPv4），容器内 localhost
      # 优先解析 ::1 → healthcheck 恒 connection refused/unhealthy。用 127.0.0.1。
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4873/-/ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      # N-3（2026-10-26 审计）：从 autoflow-public 摘除。逐个核对过调用方——
      # admin-api 代理面（docker-compose.yml NPM_REGISTRY_URL→registry.controller）、
      # executor-node 拉包（NPM_REGISTRY_URL）、admin-web nginx `/npm/` 上游
      # （apps/admin-web/nginx.conf:197）——全部在 autoflow-internal；该服务还
      # 是可写仓库（publish/unpublish），无任何理由暴露在 public 网络。
      - autoflow-internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ── Jaeger (可选，profile: jaeger) — OBS-01 ──────────────
  # 启用: docker compose --profile jaeger up -d
  # UI: http://localhost:16686 —— 从执行详情页复制 traceId 粘贴到 Jaeger
  # 「Search」框即可定位整条链路。
  # 注意：当前平台仅用 @opentelemetry/api（不引 sdk-*/exporter），span 尚未
  # 出站到 collector——本服务为未来接 Jaeger/Tempo 预置（TracerProvider 挂载
  # + OTEL_EXPORTER_OTLP_ENDPOINT 配置，升级路径见 docs/deployment.md
  # 「OTEL / Jaeger」段）。未启用 profile 时零资源占用。
  jaeger:
    image: jaegertracing/all-in-one:1.57@sha256:8f165334f418ca53691ce358c19b4244226ed35c5d18408c5acf305af2065fb9
    profiles: ['jaeger']
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      # OTLP gRPC（未来 exporter 出站目标）
      - '127.0.0.1:4317:4317'
      # OTLP HTTP
      - '127.0.0.1:4318:4318'
      # Jaeger UI（loopback-only，S9 同款主机面收紧）
      - '127.0.0.1:16686:16686'
    volumes:
      - jaeger_data:/badger
    networks:
      - autoflow-internal

  # ── PostgreSQL 定时备份 (可选，profile: backup) — M-1 ────────────
  # 启用: docker compose --profile backup up -d pg-backup
  # 备份产物落在 backup_data 卷（建议另挂宿主目录/对象存储做异地副本）；
  # 默认每日 02:00 全量 pg_dump（busybox crond 格式，BACKUP_SCHEDULE 可覆盖），
  # 按 BACKUP_RETENTION_DAYS 清理。脚本见 scripts/pg-backup.sh。
  pg-backup:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    profiles: ['backup']
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-autoflow}
      # 与 postgres 服务同源变量（其 :? 守卫已保证非空）
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-autoflow}
      BACKUP_DIR: /backup
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_data:/backup
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      # OPS-07（2026-10-27 实施轮 #9）：恢复脚本也必须挂进来。
      # scripts/pg-restore.sh 的"最常用"用法是
      #   docker compose --profile backup run --rm pg-backup bash /usr/local/bin/pg-restore.sh ...
      # 但此前只挂了 pg-backup.sh / entrypoint，容器里根本没有 pg-restore.sh
      # ⇒ 灾备时照抄 runbook 得到 "No such file or directory"，高压下运维会直接跳过
      # 迁移校验放流量。挂上即让 runbook 可照抄执行（只读、无副作用）。
      - ./scripts/pg-restore.sh:/usr/local/bin/pg-restore.sh:ro
      - ./scripts/pg-backup-entrypoint.sh:/usr/local/bin/pg-backup-entrypoint.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/pg-backup-entrypoint.sh']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoflow-internal

  # ── 监控与告警 (可选，profile: monitoring) — M-3/M-4 ─────────────
  # 启用: docker compose --profile monitoring up -d
  # 组件：Prometheus(指标采集) + Grafana(看板) + Alertmanager(告警路由) +
  #       alertmanager-hmac-proxy(告警加签侧车，OBS-02) +
  #       postgres_exporter / redis_exporter(基础设施指标) +
  #       Loki + Promtail(经 docker.sock 聚合全部容器日志)
  # 端口（loopback-only）：Grafana http://localhost:3000（默认 admin/admin，
  # 首次登录务必修改，或设置 GRAFANA_ADMIN_PASSWORD）；Prometheus
  # http://localhost:9090；Alertmanager http://localhost:9093；Loki
  # http://localhost:3100。
  # admin-api 已内置 /api/metrics（prom-client，R7 默认开启）——Prometheus 直接
  # 抓取应用指标。告警进平台通知渠道的链路：Alertmanager →（加签侧车）
  # → POST /api/alerts/webhook；侧车不映射宿主端口，仅内网可达，详见
  # scripts/alertmanager-hmac-proxy.mjs 与 docs/deployment.md「监控」段。
  prometheus:
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - '127.0.0.1:9090:9090'
    networks:
      - autoflow-internal
      - autoflow-public

  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # NETOPT-4：对齐 F-2/E-03 纪律——弱缺省 admin 是常见被扫面（loopback
      # 端口也防不了误暴露/容器逃逸后的横向）。改 :? 强制 .env 显式注入
      # （未设置/为空时 compose 解析即报错）；非 monitoring profile 下该
      # 服务不实例化，不影响主栈启动。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (monitoring profile)}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./config/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # 审计批次 A：dashboard 自动 provisioning（原为人工导入，README §2）。
      # provider 声明 + 仓库 dashboard 原件直挂（单一事实源，不做副本防漂移）；
      # provider 的 options.path 指向 /etc/grafana/provisioning/dashboards/
      # autoflow/ 子目录（Grafana 只把 provisioning 顶层的 *.yml 当 provider
      # 配置，JSON 放子目录互不干扰）。
      - ./config/monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docs/observability/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/autoflow/grafana-dashboard.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - autoflow-internal
      - autoflow-public

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - ./config/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '127.0.0.1:9093:9093'
    networks:
      - autoflow-internal
      - autoflow-public

  # OBS-02：Alertmanager 加签侧车。Alertmanager 原生 webhook_configs 不支持
  # 自定义签名头，而 admin-api 的 /api/alerts/webhook 强制要求 HMAC-SHA256
  # （未配置 ALERT_WEBHOOK_SECRET 时端点直接 503）——本服务就是两者之间那个
  # 「最小加签反代」：收 Alertmanager 的 POST 原始字节 → 附加
  # X-AutoCodeFlow-Timestamp / X-Hub-Signature-256 → 转发到 admin-api。
  # 实现与设计取舍见 scripts/alertmanager-hmac-proxy.mjs 头部注释；
  # 离线自检 scripts/alertmanager-hmac-proxy.selftest.mjs（CI 常驻）。
  alertmanager-hmac-proxy:
    # 只需 Node 标准库（零依赖、无构建）：直接挂脚本运行，不引入自定义镜像
    image: node:24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
    profiles: ['monitoring']
    # 刻意**不用** unless-stopped：未配置 ALERT_WEBHOOK_SECRET 时侧车 fail-closed
    # 退出（exit 1），配 unless-stopped 会变成无限重启刷屏。用 'no' 让它干净停下，
    # 原因留在 docker compose logs alertmanager-hmac-proxy 里（可见的失败）。
    restart: 'no'
    command: ['node', '/opt/alert-proxy/alertmanager-hmac-proxy.mjs']
    environment:
      # 与 admin-api **同源**：同一个 secret 既签（侧车）又验（admin-api）。
      # 空值时侧车拒绝启动，绝不退化成无鉴权转发。
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_PROXY_TARGET: ${ALERT_PROXY_TARGET:-http://admin-api:3105/api/alerts/webhook}
      # 容器内必须监听非回环地址（代码默认 127.0.0.1 只适合本机裸跑）。
      # 本服务**不映射宿主端口** ⇒ 仅在 compose 内网可达。
      ALERT_PROXY_BIND: ${ALERT_PROXY_BIND:-0.0.0.0}
      ALERT_PROXY_PORT: ${ALERT_PROXY_PORT:-9099}
      ALERT_PROXY_TIMEOUT_MS: ${ALERT_PROXY_TIMEOUT_MS:-10000}
    volumes:
      - ./scripts/alertmanager-hmac-proxy.mjs:/opt/alert-proxy/alertmanager-hmac-proxy.mjs:ro
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      # 端口经同一变量插值，改 ALERT_PROXY_PORT 不会让探针失联
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:${ALERT_PROXY_PORT:-9099}/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      # 只需内网（admin-api 同在 autoflow-internal）；不给 public 面
      - autoflow-internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      # 注意：密码含 URL 保留字符（@ : /）时需 URL 编码，否则 DSN 解析失败
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-autoflow}:${POSTGRES_PASSWORD}@postgres:5432/${DB_DATABASE:-autoflow}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoflow-internal

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0@sha256:4d0bf00eeb6b22d60acc65db79a8c324e3c18c959518c67fc65694770d5c8d72
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autoflow-internal

  loki:
    image: grafana/loki:3.0.0@sha256:757b5fadf816a1396f1fea598152947421fa49cb8b2db1ddd2a6e30fae003253
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - ./config/monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/local-config.yaml'
    ports:
      - '127.0.0.1:3100:3100'
    networks:
      - autoflow-internal
      - autoflow-public

  promtail:
    image: grafana/promtail:3.0.0@sha256:d3de3da9431cfbe74a6a94555050df5257f357e827be8e63f8998d509c37af8b
    profiles: ['monitoring']
    restart: unless-stopped
    # NETOPT-4：promtail 持宿主 docker.sock（等同 root 权限面），做最小加固：
    # 收掉全部 Linux capabilities + 根文件系统只读。positions 文件在容器层
    # /tmp（promtail.yml:10），read_only 下改由 tmpfs 承载（可写、随容器
    # 重建清零——positions 丢失仅导致日志重读，无数据损失）。
    cap_drop: ['ALL']
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - '-config.file=/etc/promtail/config.yml'
    depends_on:
      - loki
    networks:
      - autoflow-internal

volumes:
  postgres_data:
  redis_data:
  # RustFS 数据卷（原 minio_data）。⚠ 旧卷 `minio_data` 的数据**不能**原地复用
  # （RustFS 的 MinIO 磁盘格式兼容是 preview 构建，加密对象读不了）——旧卷保留
  # 到日志保留期（LOG_RETENTION_DAYS / TASK_EXECUTION_RETENTION_DAYS）走完后再
  # `docker volume rm <project>_minio_data`。这里已不再声明 minio_data，故
  # compose 不会自动创建/复用同名卷，旧卷只留在 docker 里等人工清理。
  rustfs_data:
  # RustFS 的日志目录（RUSTFS_OBS_LOG_DIRECTORY=/app/logs）——与数据盘分开，
  # 避免服务日志挤占对象存储目录
  rustfs_logs:
  pypi_data:
  npm_data:
  executor_python_data:
  executor_node_data:
  jaeger_data:
  # P3·运维（2026-10-25 审计）：admin-api 上传面（应用包 + 执行器包）的持久卷
  # ——挂载点 /app/uploads，语义见 admin-api 服务块内的注释；多副本（HA）
  # override 复用同一命名卷做共享。
  admin_uploads:
  # M-1: pg-backup profile 的备份产物卷
  backup_data:
  # M-3/M-4: monitoring profile 数据卷
  prometheus_data:
  grafana_data:
  loki_data:
  # python_task_multiversion：解释器缓存池（executor-python 与 executor-node
  # 共享）。豁免 TTL 清扫，由 INTERPRETER_SINGLE_VERSION_MB /
  # INTERPRETER_TOTAL_GB 体积红线 + 最久未使用回收治理。
  # ⚠ 该卷以非 root 的 appuser 身份写入；离线预填时须保证 appuser 可读可执行，
  #   见 docs/design/python-task-upload-and-multiversion/OFFLINE-PROVISIONING.md §5
  interpreter_cache:
