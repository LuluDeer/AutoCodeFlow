# docker-compose.yml  —  完整部署（生产 / staging / CI）
# 所有机密信息通过环境变量注入，请先复制 .env.example 为 .env 并填写。
# 本地开发仅启动基础设施请改用 infra/docker-compose.yml。
#
# E-34（DEEP_REVIEW 0ef3bbe）：删除 `version:` 字段——Compose V2 已弃用它并告警，
# 文件本身即 compose 规范（V2 不再需要 version 声明）。

networks:
  # 内部网络，服务间通信
  autoflow-internal:
    internal: true
  # 对外暴露网络
  autoflow-public:

services:
  # ── Infrastructure ──────────────────────────────────────
  # X-1（可扩展性审查）：postgres 为单实例，本 compose 不含流复制——主库故障
  # 即整个系统不可用。生产建议：云 RDS（主从 + 自动故障切换）或自建 PG 流复制
  # + Patroni；本文件保持单实例形态，不伪造不可运行的复制配置。
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      # F-2: :? 语法强制显式注入——未设置/为空时 compose 解析即报错（fail-fast），
      # 不再带空口令启动到容器层才暴露（postgres-replica 为 profile 服务且与
      # 本服务同源变量，此处守卫即覆盖）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-autoflow}
    # 512M was tight for the scheduled workload (audit log aggregation,
    # index builds during migrations)
    mem_limit: 1g
    # O-8: 资源限制统一用 compose 原生顶层字段（deploy.resources 是 swarm 字段，
    # 纯 compose up 下不生效且与 mem_limit 混用造成语义混乱，已删除）
    cpus: '0.5'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres uses /dev/shm for parallel sorts/hashes; the 64MB default
    # causes spilling to disk under load
    shm_size: 256mb
    # M-5: 1G 容器下的稳妥调优（PG 建议 shared_buffers ≈ 25% 内存；
    # max_connections 兼顾多副本 admin-api 连接池（每实例 DB_POOL_SIZE=20）与
    # 迁移/后台聚合任务；work_mem/effective_cache_size 按 1G 内存折算）
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=150", "-c", "work_mem=8MB", "-c", "effective_cache_size=768MB"]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autoflow}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autoflow-internal

  # ── 只读副本 (可选，profile: replica) — ARCH-24 ──────────────
  # 启用: docker compose --profile replica up -d postgres-replica
  # ⚠ 演示形态：此容器不真正做流复制——只起一个可连的空 PG 实例，供本地
  #   联调 DB_READ_REPLICA_URL 的连接与查询路由（SELECT 走副本、写面走主库
  #   的行为验证）；它不会自动同步主库数据。真实部署的读副本请用云 RDS
  #   read replica 或 PG 流复制（primary_conninfo + standby.signal），
  #   复制延迟/只读语义等注意点见 docs/deployment.md「读写分离（可选）」段。
  # 联调方式：启动后把 admin-api 的 DB_READ_REPLICA_URL 设为
  #   postgres://<POSTGRES_USER>@postgres-replica:5432/<DB_DATABASE>
  postgres-replica:
    image: postgres:16-alpine
    profiles: ['replica']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-autoflow}
    mem_limit: 512m
    # M-6: 与主库对称，避免副本在排序/哈希时 spill to disk
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autoflow}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autoflow-internal

  # X-2（可扩展性审查）：Leader 选举 / 分布式锁 / BullMQ / pull 派发队列均依赖
  # Redis，单实例为单点（应用侧已有 fail-open 降级：Redis 不可用退化为 DB
  # 条件 UPDATE claim 兜底）。生产建议 Redis Sentinel 或 Cluster。
  # 本文件的可运行改进：开启 AOF 持久化（appendonly yes），重启不丢队列/锁
  # 语义外的必要状态；数据落 redis_data 卷。
  # F-1/O-8: 资源限制用 compose 原生顶层字段（与 postgres 对齐；deploy.resources
  # 是 swarm 字段，纯 docker compose up 下不生效）。M-2: 启用密码认证（admin-api
  # 侧已支持 REDIS_PASSWORD，见 configuration.ts）。F-6: maxmemory 内联等效
  # config/redis/autoflow-redis.conf 的同名参数——该 conf 为隔离本地开发专用
  # （scripts/start-isolated.sh 消费，端口 6380），不挂载到此容器。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      # exec 形态（无 shell 层），密码作为独立 argv 传入，避免引号/元字符问题
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - autoflow-internal

  # ── Core Services ──────────────────────────────────────
  admin-api:
    # DEP-HA-1 多副本：本服务可 --scale admin-api=N 水平扩展（多实例行为一致
    # 性由 ARCH-31 保证）。扩容必须配合 docker-compose.ha.yml override 使用
    # （清空宿主端口防冲突 + 共享 uploads 卷）：
    #   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d --scale admin-api=2
    # 入口流量统一走 admin-web 内置 nginx（infra/nginx/default.conf 为运行时
    # 再解析，自动轮询多副本）。约束见 docs/deployment.md「多副本（HA）部署」。
    build:
      context: ./apps/admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    cpus: '1.0'
    ports:
      # E-03: loopback-only——admin-api 宿主面仅本机可路由（其余端口同款写法）；
      # 执行器回程走内网 ADMIN_API_URL=http://admin-api:3105，不依赖宿主映射
      - '127.0.0.1:3105:3105'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-autoflow}
      # F-2: 敏感变量统一 :? 强制注入（未设置/为空时 compose 解析即报错，
      # fail-fast，不再带空口令/空密钥静默启动）
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-autoflow}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      # M-2: redis 服务已强制 --requirepass，admin-api 侧必须携带同源密码
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # OBS-02: Alertmanager webhook 入站 HMAC secret（可选；未配置时
      # POST /api/alerts/webhook 503 安全缺省拒绝，见 alerts.controller.ts）
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET in .env}
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5176}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 显式堆上限（比依赖容器 mem_limit 兜底更早、更可控地 OOM）：500 并发
      # 实测峰值 RSS 394MB，512MB 堆 + 容器 768m 余量充裕；堆到 mem_limit 才
      # 被 cgroup 杀掉会连带同一容器的其它进程一起阵亡。
      NODE_OPTIONS: '--max-old-space-size=512'
      APP_PROTOCOL: ${APP_PROTOCOL:-http}
      # APP-002: 上传应用包时用它拼 executor 可下载的 packageUrl
      # （{API_BASE_URL}/uploads/packages/...）；未配置时上传接口直接 500。
      # 缺省 http://admin-api:3105 仅对**同 compose 网络内**的 executor-python /
      # executor-node 可达；宿主上的桌面执行器或跨机执行器必须在根 .env 覆盖为
      # 它们能访问的地址（私网地址还需 EXECUTOR_ALLOW_PRIVATE_NETWORK=true，
      # 否则执行器自己的 ssrf-guard 会拒掉下载）。
      API_BASE_URL: ${API_BASE_URL:-http://admin-api:3105}
      # LOG-02: execution log storage (db | s3); s3 needs the minio profile
      LOG_STORAGE_DRIVER: ${LOG_STORAGE_DRIVER:-db}
      LOG_STORAGE_ENDPOINT: ${LOG_STORAGE_ENDPOINT:-minio:9000}
      LOG_STORAGE_BUCKET: ${LOG_STORAGE_BUCKET:-autoflow-logs}
      LOG_STORAGE_ACCESS_KEY: ${LOG_STORAGE_ACCESS_KEY:-autoflow}
      LOG_STORAGE_SECRET_KEY: ${LOG_STORAGE_SECRET_KEY:-}
      LOG_STORAGE_USE_SSL: ${LOG_STORAGE_USE_SSL:-false}
      # E-03: 无缺省值——:? 语法强制 .env 显式注入（未设置/为空时 compose
      # 解析即报错，不再带缺省口令起服务）；弱口令/短口令由 configuration.ts
      # 生产 fail-fast 拒启。非 compose 部署未设置该变量时跳过初始管理员
      # 种子（users.service 既有行为）
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@autoflow.local}
      # python_task_multiversion：可声明的 Python 版本区间（写面校验）。
      # 与 executor-python 侧同名变量**同源注入**——两侧必须一致，否则会出现
      # "能保存但跑不了"（admin 放宽而执行器收紧）或"能跑但存不了"（反向）。
      # 读取点：src/modules/task/runtime-version.util.ts（getEnvVar，调用时读）。
      # 非法值静默回退契约缺省（3.7/3.14），不会让写面 500。
      PYTHON_RUNTIME_VERSION_MIN: ${PYTHON_RUNTIME_VERSION_MIN:-3.7}
      PYTHON_RUNTIME_VERSION_MAX: ${PYTHON_RUNTIME_VERSION_MAX:-3.14}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3105/api/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      admin-api:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3105}
      VITE_API_URL_INTERNAL: ${VITE_API_URL_INTERNAL:-http://localhost:3105}
      VITE_API_URL_EXTERNAL: ${VITE_API_URL_EXTERNAL:-}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ── MinIO (可选，profile: minio) ──────────────────────
  # 启用: docker compose --profile minio up -d
  # 再将 admin-api 的 LOG_STORAGE_DRIVER 设为 s3，执行日志将以 gzip
  # 对象存放在此，主库 execution_log_lines 不再增长（优化笔记 2.6）
  # X-3（可扩展性审查）：本单实例 minio 为文件存储单点；生产建议云 S3/OSS，
  # 或 minio 分布式多节点模式。
  # 注意：admin 侧对象回收由 WIKI-LOG-S3GC（S3LogObjectRetentionService，每日
  # 03:35）承担——按过期 s3 指针批量 remove execution-logs/ 前缀对象并清空指针
  # （单轮上限、余量次轮续收），admin 正常运行时 minio_data 卷不会随日志对象
  # 无限增长。bucket lifecycle 仅为可选兜底（admin 长期停机等场景），步骤见
  # docs/operations.md「S3/MinIO 日志对象生命周期」。
  minio:
    # E-34（DEEP_REVIEW 0ef3bbe）：旧 latest 浮动 tag 使日志存储组件升级不可复现
    # （其余服务均 pin：postgres:16-alpine / redis:7）。pin 到具体 RELEASE tag，
    # 升级走显式 bump。
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: ['minio']
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autoflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ── Executors ──────────────────────────────────────
  executor-python:
    build:
      context: ./apps/executor-python
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1G
    cpus: '1.0'
    # S9: /api/execute is a code-execution surface — host access is
    # loopback-only (same precedent as registry-pypi/registry-npm below);
    # admin-api reaches executors over the internal network, so this mapping
    # only affects host-side access. Override deliberately for external use.
    ports:
      - '127.0.0.1:8001:8001'
    environment:
      APP_NAME: executor-python-1
      PORT: 8001
      # E-25（DEEP_REVIEW 0ef3bbe）：容器内必须监听 0.0.0.0 才能被其他容器
      # 通过 Docker 网络访问；裸机默认已收为 127.0.0.1。
      BIND_ADDRESS: 0.0.0.0
      # S9: fail closed (503) instead of dev-mode allow-all when no token is
      # configured; admin-api holds the same EXECUTOR_SECRET below.
      REQUIRE_TOKEN: 'true'
      EXECUTOR_ADDRESS: executor-python:8001
      EXECUTOR_ADDRESS_PUBLIC: ${EXECUTOR_PYTHON_PUBLIC_ADDRESS:-executor-python:8001}
      ADMIN_API_URL: http://admin-api:3105
      ADMIN_API_URL_INTERNAL: ${ADMIN_API_URL_INTERNAL:-http://admin-api:3105}
      ADMIN_API_URL_EXTERNAL: ${ADMIN_API_URL_EXTERNAL:-}
      # F-2: 与 admin-api 侧同源强制注入（未设置即 compose 解析报错）
      EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET in .env}
      WORK_DIR: /data/tasks
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # DEEP-AUDIT D2-P1-1（2026-09-22）：任务沙箱显式启用 bwrap——bubblewrap
      # 用户命名空间 + 只读根文件系统 + PrivateTmp 隔离任务进程（最强隔离层）。
      # 此前 config.py 注释声称「生产容器由 compose 显式开启」而本文件实际未设置，
      # 最强隔离层在生产路径默认关闭。前置：宿主/内核须允许容器内 unprivileged
      # user namespaces；bwrap 二进制缺失或 userns 被禁时执行器 fail-closed
      # （failureReason=sandbox_unavailable），绝不静默降级为无沙箱运行。
      # 前置验证步骤见 docs/deployment.md「容器安全（SEC-07）」段。
      TASK_SANDBOX: 'bwrap'
      PYPI_REGISTRY_URL: ${PYPI_REGISTRY_URL:-http://registry-pypi:8003/simple/}
      # ── python_task_multiversion：解释器缓存池与多版本 ──────────────
      # 任务可声明 runtimeVersion（Python 主.次版本）按需获取解释器；不声明
      # 则沿用宿主解释器（存量语义逐字节不变）。
      # 池根目录：独立命名卷，**刻意与 WORK_DIR(/data/tasks) 分离**——WORK_DIR
      # 受磁盘 TTL 清扫（DISK_CLEANUP_TTL_DAYS）管理，解释器是可复用资产，
      # 被 TTL 误删就要重新下载（离线环境下永久不可恢复）。
      UV_PYTHON_INSTALL_DIR: /data/interpreters
      # 可选内网镜像（私有化模式 A）；留空 = 走 uv 默认源（Astral CDN /
      # GitHub Releases，在线主路径）。仅 http(s)，无 userinfo/query/fragment。
      UV_PYTHON_INSTALL_MIRROR: ${UV_PYTHON_INSTALL_MIRROR:-}
      # 单次下载独立超时预算（秒，D11）；实测单版本约 13~17s，300s 余量充裕。
      INTERPRETER_DOWNLOAD_TIMEOUT_SECONDS: ${INTERPRETER_DOWNLOAD_TIMEOUT_SECONDS:-300}
      # 下载全局有界并发（D13，默认 2；1 = 全局单队列）。不同版本并行下载、
      # 同版本共享一次；弱网/低磁盘部署可收紧。
      INTERPRETER_DOWNLOAD_CONCURRENCY: ${INTERPRETER_DOWNLOAD_CONCURRENCY:-2}
      # 体积红线（D12）：解释器层豁免 TTL，改由红线治理（超限告警 + LRU 回收）。
      INTERPRETER_SINGLE_VERSION_MB: ${INTERPRETER_SINGLE_VERSION_MB:-250}
      INTERPRETER_TOTAL_GB: ${INTERPRETER_TOTAL_GB:-4}
      # 可声明版本区间（主.次）；与 admin-api 侧同名变量须保持一致。
      # 注意：3.7 在线不可下载（uv 清单只到 3.8~3.14），需离线预填缓存卷，
      # 见 docs/design/python-task-upload-and-multiversion/OFFLINE-PROVISIONING.md
      PYTHON_RUNTIME_VERSION_MIN: ${PYTHON_RUNTIME_VERSION_MIN:-3.7}
      PYTHON_RUNTIME_VERSION_MAX: ${PYTHON_RUNTIME_VERSION_MAX:-3.14}
    # SEC-07: 最小权限双闸（镜像层已 non-root，见 apps/executor-python/Dockerfile
    # Q-08 —— adduser appuser + USER）。cap_drop 移除全部 Linux capabilities
    # （代码执行面不需要任何特权操作）；no-new-privileges 阻断 setuid 提权路径。
    # 真机验收（容器内非 root 且任务可跑）见 docs/deployment.md「容器安全」段。
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    # 资源硬限制：任务子进程继承容器限制——nofile 上限防 fd 泄漏，
    # pids_limit 防 fork 炸弹（代码执行面是 fork 大户）；CPU 时间上限由
    # cpus='1.0' + 任务超时 kill 兜底（代码层另设 RLIMIT_CPU，见 execute.py
    # _spawn_kwargs_for_platform）。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 512
    volumes:
      - executor_python_data:/data/tasks
      # python_task_multiversion：解释器缓存池独立命名卷（与 /data/tasks 分离，
      # 豁免 TTL 清扫）。离线预填 3.7 即预置到此卷，步骤见
      # docs/design/python-task-upload-and-multiversion/OFFLINE-PROVISIONING.md
      - interpreter_cache:/data/interpreters
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8001/health")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  executor-node:
    build:
      context: ./apps/executor-node
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1G
    cpus: '1.0'
    # S9: loopback-only host mapping — see executor-python above.
    ports:
      - '127.0.0.1:8002:8002'
    environment:
      APP_NAME: executor-node-1
      PORT: 8002
      # E-25（DEEP_REVIEW 0ef3bbe）：容器内必须监听 0.0.0.0 才能被其他容器
      # 通过 Docker 网络访问；裸机默认已收为 127.0.0.1。
      BIND_ADDRESS: 0.0.0.0
      # S9: fail closed (503) instead of dev-mode allow-all when no token is
      # configured; admin-api holds the same EXECUTOR_SECRET below.
      REQUIRE_TOKEN: 'true'
      EXECUTOR_ADDRESS: executor-node:8002
      EXECUTOR_ADDRESS_PUBLIC: ${EXECUTOR_NODE_PUBLIC_ADDRESS:-executor-node:8002}
      ADMIN_API_URL: http://admin-api:3105
      ADMIN_API_URL_INTERNAL: ${ADMIN_API_URL_INTERNAL:-http://admin-api:3105}
      ADMIN_API_URL_EXTERNAL: ${ADMIN_API_URL_EXTERNAL:-}
      # F-2: 与 admin-api 侧同源强制注入（未设置即 compose 解析报错）
      EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET in .env}
      WORK_DIR: /data/tasks
      MAX_CONCURRENT_TASKS: 10
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 显式堆上限：执行器承载任务子进程，BoundedLogBuffer 已防日志 OOM，但
      # 解释器池清单/心跳/回调聚合等仍有内存峰值；1024MB 堆给任务子进程与
      # 解释器池留足余量，比堆膨胀到 mem_limit 被 cgroup 杀掉更早、更可控。
      NODE_OPTIONS: '--max-old-space-size=1024'
      NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-http://registry-npm:4873}
      PYTHON_REGISTRY_URL: ${PYTHON_REGISTRY_URL:-http://registry-pypi:8003/simple/}
      # ── python_task_multiversion：解释器缓存池（node 侧同构） ────────
      # executor-node 的 python 分支与 executor-python 对等（声明版本按需
      # 获取解释器）。uv 定位顺序：UV_BIN → PATH → desktop 内置（Electron
      # 注入 UV_BIN）→ 都无则声明版本的任务明确失败（reason=uv_missing）。
      # 注意：本 compose 服务基于 node:24-alpine（U-2，与 CI 的 node 24 对齐），
      # **当前镜像未内置 uv 也未装 python**（故 detectAvailableRuntimes 不会上报
      # python 能力）——以下变量在此服务上暂为惰性配置，供镜像补齐 uv 后直接
      # 生效；桌面端（executor-desktop 内置 uv + 宿主 python）为主要消费形态。
      UV_BIN: ${UV_BIN:-}
      UV_PYTHON_INSTALL_DIR: /data/interpreters
      UV_PYTHON_INSTALL_MIRROR: ${UV_PYTHON_INSTALL_MIRROR:-}
      INTERPRETER_DOWNLOAD_TIMEOUT_SECONDS: ${INTERPRETER_DOWNLOAD_TIMEOUT_SECONDS:-300}
      INTERPRETER_DOWNLOAD_CONCURRENCY: ${INTERPRETER_DOWNLOAD_CONCURRENCY:-2}
      # 注：INTERPRETER_SINGLE_VERSION_MB / INTERPRETER_TOTAL_GB 与
      # executor-python 同源注入——executor-node 自 NFR-15 起同样实现解释器池
      # 体积红线（interpreters.enforceInterpreterPoolLimits，与 python 侧
      # maintenance.enforce_interpreter_pool_limits 对等），两侧必须一致。
      INTERPRETER_SINGLE_VERSION_MB: ${INTERPRETER_SINGLE_VERSION_MB:-250}
      INTERPRETER_TOTAL_GB: ${INTERPRETER_TOTAL_GB:-4}
    # SEC-07: 最小权限双闸（镜像层已 non-root，见 apps/executor-node/Dockerfile
    # Q-09 —— adduser appuser + USER）。cap_drop/no-new-privileges 语义同
    # executor-python 上方注释。
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    # 资源硬限制（DEEP_REVIEW 补全）：任务子进程继承容器限制——nofile 上限防
    # fd 泄漏（chatty 任务开大量连接耗尽执行器 fd），pids_limit 防 fork 炸弹；
    # CPU 时间上限由 cpus='1.0' + 任务超时 kill 兜底（python 侧另有 RLIMIT_CPU）。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 512
    volumes:
      - executor_node_data:/data/tasks
      # python_task_multiversion：与 executor-python 共用同一解释器缓存**卷**。
      # ⚠ 两执行器基底 libc 不同（本服务 node:24-alpine = **musl**；
      #   executor-python 的 python:3.12-slim = **glibc**），因此**不能共用同一份
      #   解释器产物**——各自需要对应 libc 的构建。共卷本身是安全的：池目录名
      #   带 libc 分量（`linux-x86_64-musl` vs `linux-x86_64-gnu`），uv 按平台
      #   分量过滤，**非本平台的条目被安全跳过**（实测：池内混放 linux 命名条目
      #   时 `uv python list --only-installed` 仍 exit 0，本平台条目正常列出）。
      #   离线预填时须**两个 libc 各放一份**，见 OFFLINE-PROVISIONING.md §5.4。
      - interpreter_cache:/data/interpreters
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8002/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ── Package Registry ──────────────────────────────────────
  registry-pypi:
    build:
      context: ./apps/registry-pypi
      dockerfile: Dockerfile
    restart: unless-stopped
    # Host access is local-only by default; executors use the internal network.
    # For deliberate external package publishing, override this mapping explicitly.
    ports:
      - '127.0.0.1:8003:8003'
    environment:
      REGISTRY_USER: ${REGISTRY_USER:-admin}
      # F-2: Basic Auth 密码强制注入（未设置即 compose 解析报错）
      REGISTRY_PASS: ${REGISTRY_PASS:?set REGISTRY_PASS in .env}
      # E-34（DEEP_REVIEW 0ef3bbe）：旧 PYPI_API_KEY 是死配置——registry-pypi main.py
      # 从未读取它（grep 实证 0 处），鉴权只有 Basic（REGISTRY_USER/PASS）。保留会让运维
      # 误以为存在 token 鉴权通道。删除；将来若补 token 鉴权再连同 main.py 实现一并加回。
      PACKAGES_DIR: /data/packages
    volumes:
      - pypi_data:/data/packages
    # E-10（DEEP_REVIEW 0ef3bbe）：基础加固——只读根文件系统 + no-new-privileges
    # + cap_drop ALL。包写入目录挂载为 volume 可写。
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ['ALL']
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8003/health")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  registry-npm:
    # O-3: major 浮动 tag（verdaccio:5）→ pin 到具体版本，升级不可复现问题与
    # minio 同源（E-34 先例），5.x 内 minor 行为变化不再静默进入
    image: verdaccio/verdaccio:5.31.1
    restart: unless-stopped
    # Host access is local-only by default; executors use the internal network.
    # For deliberate external package publishing, override this mapping explicitly.
    ports:
      - '127.0.0.1:4873:4873'
    volumes:
      - npm_data:/verdaccio/storage
      - ./apps/registry-npm/config.yaml:/verdaccio/conf/config.yaml:ro
    # NETOPT-8⑧: E-10 同款加固——registry-pypi 段（read_only/no-new-privileges/
    # cap_drop/tmpfs）三件套+tmpfs 齐全，本段此前全缺。verdaccio 只写 storage 卷
    # （npm_data:/verdaccio/storage，htpasswd 也在其中，见 config.yaml），日志走
    # stdout（log: { type: stdout }），conf 为只读挂载——read_only 根文件系统
    # 不影响任何功能路径；tmpfs /tmp 供运行期临时文件。
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ['ALL']
    tmpfs:
      - /tmp
    healthcheck:
      # R8 冒烟发现：verdaccio 5 监听 0.0.0.0（仅 IPv4），容器内 localhost
      # 优先解析 ::1 → healthcheck 恒 connection refused/unhealthy。用 127.0.0.1。
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4873/-/ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autoflow-internal
      - autoflow-public
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ── Jaeger (可选，profile: jaeger) — OBS-01 ──────────────
  # 启用: docker compose --profile jaeger up -d
  # UI: http://localhost:16686 —— 从执行详情页复制 traceId 粘贴到 Jaeger
  # 「Search」框即可定位整条链路。
  # 注意：当前平台仅用 @opentelemetry/api（不引 sdk-*/exporter），span 尚未
  # 出站到 collector——本服务为未来接 Jaeger/Tempo 预置（TracerProvider 挂载
  # + OTEL_EXPORTER_OTLP_ENDPOINT 配置，升级路径见 docs/deployment.md
  # 「OTEL / Jaeger」段）。未启用 profile 时零资源占用。
  jaeger:
    image: jaegertracing/all-in-one:1.57
    profiles: ['jaeger']
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      # OTLP gRPC（未来 exporter 出站目标）
      - '127.0.0.1:4317:4317'
      # OTLP HTTP
      - '127.0.0.1:4318:4318'
      # Jaeger UI（loopback-only，S9 同款主机面收紧）
      - '127.0.0.1:16686:16686'
    volumes:
      - jaeger_data:/badger
    networks:
      - autoflow-internal

  # ── PostgreSQL 定时备份 (可选，profile: backup) — M-1 ────────────
  # 启用: docker compose --profile backup up -d pg-backup
  # 备份产物落在 backup_data 卷（建议另挂宿主目录/对象存储做异地副本）；
  # 默认每日 02:00 全量 pg_dump（busybox crond 格式，BACKUP_SCHEDULE 可覆盖），
  # 按 BACKUP_RETENTION_DAYS 清理。脚本见 scripts/pg-backup.sh。
  pg-backup:
    image: postgres:16-alpine
    profiles: ['backup']
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-autoflow}
      # 与 postgres 服务同源变量（其 :? 守卫已保证非空）
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-autoflow}
      BACKUP_DIR: /backup
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_data:/backup
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - ./scripts/pg-backup-entrypoint.sh:/usr/local/bin/pg-backup-entrypoint.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/pg-backup-entrypoint.sh']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoflow-internal

  # ── 监控与告警 (可选，profile: monitoring) — M-3/M-4 ─────────────
  # 启用: docker compose --profile monitoring up -d
  # 组件：Prometheus(指标采集) + Grafana(看板) + Alertmanager(告警路由) +
  #       postgres_exporter / redis_exporter(基础设施指标) +
  #       Loki + Promtail(经 docker.sock 聚合全部容器日志)
  # 端口（loopback-only）：Grafana http://localhost:3000（默认 admin/admin，
  # 首次登录务必修改，或设置 GRAFANA_ADMIN_PASSWORD）；Prometheus
  # http://localhost:9090；Alertmanager http://localhost:9093；Loki
  # http://localhost:3100。
  # admin-api 已内置 /api/metrics（prom-client，R7 默认开启）——Prometheus 直接
  # 抓取应用指标。OBS-02 告警入站需 HMAC 签名（Alertmanager 原生 webhook 无法
  # 直接产生 HMAC），接线需 HMAC 转发侧车，见 docs/deployment.md「监控」段。
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - '127.0.0.1:9090:9090'
    networks:
      - autoflow-internal
      - autoflow-public

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # NETOPT-4：对齐 F-2/E-03 纪律——弱缺省 admin 是常见被扫面（loopback
      # 端口也防不了误暴露/容器逃逸后的横向）。改 :? 强制 .env 显式注入
      # （未设置/为空时 compose 解析即报错）；非 monitoring profile 下该
      # 服务不实例化，不影响主栈启动。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (monitoring profile)}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./config/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - autoflow-internal
      - autoflow-public

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - ./config/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '127.0.0.1:9093:9093'
    networks:
      - autoflow-internal
      - autoflow-public

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      # 注意：密码含 URL 保留字符（@ : /）时需 URL 编码，否则 DSN 解析失败
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-autoflow}:${POSTGRES_PASSWORD}@postgres:5432/${DB_DATABASE:-autoflow}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoflow-internal

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autoflow-internal

  loki:
    image: grafana/loki:3.0.0
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - ./config/monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/local-config.yaml'
    ports:
      - '127.0.0.1:3100:3100'
    networks:
      - autoflow-internal
      - autoflow-public

  promtail:
    image: grafana/promtail:3.0.0
    profiles: ['monitoring']
    restart: unless-stopped
    # NETOPT-4：promtail 持宿主 docker.sock（等同 root 权限面），做最小加固：
    # 收掉全部 Linux capabilities + 根文件系统只读。positions 文件在容器层
    # /tmp（promtail.yml:10），read_only 下改由 tmpfs 承载（可写、随容器
    # 重建清零——positions 丢失仅导致日志重读，无数据损失）。
    cap_drop: ['ALL']
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - '-config.file=/etc/promtail/config.yml'
    depends_on:
      - loki
    networks:
      - autoflow-internal

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pypi_data:
  npm_data:
  executor_python_data:
  executor_node_data:
  jaeger_data:
  # M-1: pg-backup profile 的备份产物卷
  backup_data:
  # M-3/M-4: monitoring profile 数据卷
  prometheus_data:
  grafana_data:
  loki_data:
  # python_task_multiversion：解释器缓存池（executor-python 与 executor-node
  # 共享）。豁免 TTL 清扫，由 INTERPRETER_SINGLE_VERSION_MB /
  # INTERPRETER_TOTAL_GB 体积红线 + 最久未使用回收治理。
  # ⚠ 该卷以非 root 的 appuser 身份写入；离线预填时须保证 appuser 可读可执行，
  #   见 docs/design/python-task-upload-and-multiversion/OFFLINE-PROVISIONING.md §5
  interpreter_cache:
